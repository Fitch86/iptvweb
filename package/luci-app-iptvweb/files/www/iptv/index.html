const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(line,name){const re=new RegExp(name+'="([^"]*)"','i'),m=line.match(re);return m?m[1]:''}
function parseM3U(text){
  const lines=text.split(/\r?\n/),out=[]; let info=null;
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith('#EXTINF:')) info=line;
    else if(info && !line.startsWith('#')){
      out.push({
        name:info.split(',').slice(1).join(',')||attr(info,'tvg-name'),
        id:attr(info,'tvg-id'), logo:attr(info,'tvg-logo'),
        group:attr(info,'group-title')||'其他', url:line
      });
      info=null;
    }
  }
  return out;
}
function streamUrl(ch){
  try{
    const u=new URL(ch.url, location.href);
    const m=u.pathname.match(/^\/udp\/([^:]+):(\d+)$/);
    if(m){
      const proxy=new URL('/cgi-bin/iptvweb-stream', window.location.href);
      proxy.searchParams.set('group', m[1]);
      proxy.searchParams.set('port', m[2]);
      return proxy.href;
    }
  }catch(e){}
  return new URL(ch.url, window.location.href).href;
}

function audioStreamUrl(ch){
  const candidates=[];
  try{ candidates.push(String(ch&&ch.url||'')); }catch(e){}
  try{ candidates.push(String(streamUrl(ch)||'')); }catch(e){}
  for(const raw of candidates){
    if(!raw) continue;
    try{
      const u=new URL(raw, window.location.href);
      const path=u.pathname.replace(/\/+$/,'');
      let m=path.match(/\/udp\/(\d+\.\d+\.\d+\.\d+):(\d+)$/);
      if(!m) m=raw.match(/\/udp\/(\d+\.\d+\.\d+\.\d+):(\d+)(?:[\/?#]|$)/);
      if(m){
        const proxy=new URL('/cgi-bin/iptvweb-audio-pes', window.location.href);
        proxy.searchParams.set('group', m[1]); proxy.searchParams.set('port', m[2]);
        return proxy.href;
      }
    }catch(e){}
  }
  return '';
}

function probeIndependentAudio(ch, seq){
  if(!isIOSSafari() || seq!==state.seq) return;
  const url=audioStreamUrl(ch); if(!url) return;
  try{
    const u=new URL(url, window.location.href);
    const probe=new URL('/cgi-bin/iptvweb-audio-probe', window.location.href);
    probe.search=u.search;
    fetch(probe.href, {cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    }).then(text=>{
      if(seq!==state.seq) return;
      let x;
      try{x=JSON.parse(text);}catch(e){ throw new Error('probe JSON parse: '+e.message+' body='+text.slice(0,240)); }
      if(x&&x.ok){
        state.webAudioInfo=x;
        log('SAFARI_AUDIO: MPEG header pid='+x.pid+' stream_type='+x.pmt_stream_type+' '+x.version+' '+x.layer+' '+x.bitrate_kbps+'kbps '+x.sample_rate+'Hz '+x.channels+'ch frame='+x.frame_length+' hex='+x.header_hex);
      } else {
        log('SAFARI_AUDIO: MPEG header probe failed '+(x&&x.error||'unknown'));
      }
    }).catch(e=>log('SAFARI_AUDIO: MPEG header probe error '+e.message));
  }catch(e){ log('SAFARI_AUDIO: MPEG header probe exception '+e.message); }
}

function prepareSafariAudioContextFromGesture() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) {
    log('SAFARI_MP2PCM: AudioContext unavailable');
    return null;
  }

  let ctx = state.webAudioCtx;
  if (!ctx || ctx.state === 'closed') {
    ctx = new Ctx({latencyHint: 'interactive'});
    state.webAudioCtx = ctx;
  }

  state.audioCtxRate = ctx.sampleRate;

  // 必须在频道点击手势中尽早调用 resume()
  try {
    const p = ctx.resume();
    if (p && p.catch) {
      p.catch(e => log('SAFARI_MP2PCM: prepared context resume failed ' + e.message));
    }
  } catch (e) {
    log('SAFARI_MP2PCM: prepared context resume error ' + e.message);
  }

  return ctx;
}

function discardPreparedSafariAudioContext() {
  const ctx = state.webAudioCtx;
  state.webAudioCtx = null;
  state.audioCtxRate = 0;

  if (ctx && ctx.state !== 'closed') {
    try {
      const p = ctx.close();
      if (p && p.catch) p.catch(() => {});
    } catch (_) {}
  }
}

function parsePmtStreamType(value) {
  if (Number.isInteger(value)) return value;

  if (typeof value === 'string') {
    const s = value.trim();
    if (/^0x[0-9a-f]+$/i.test(s)) return parseInt(s, 16);
    if (/^\d+$/.test(s)) return Number(s);
  }
  return null;
}

async function detectSafariAudioRoute(ch, seq) {
  const audioUrl = audioStreamUrl(ch);
  if (!audioUrl) {
    return { kind: 'av-mse', streamType: null, reason: 'no audio URL' };
  }

  const source = new URL(audioUrl, location.href);
  const probe = new URL('/cgi-bin/iptvweb-audio-probe', location.href);
  probe.search = source.search;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3000);

  try {
    const response = await fetch(probe.href, {
      cache: 'no-store',
      signal: controller.signal
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);

    const info = await response.json();
    if (seq !== state.seq) return null;

    const streamType = parsePmtStreamType(info.pmt_stream_type);

    // 只有明确识别为 MPEG Audio 才走独立解码。
    if (info.pmt_found === true && (streamType === 3 || streamType === 4)) {
      return { kind: 'mpeg-audio', streamType, info };
    }

    // AAC、未知类型、probe 不完整都保留 A/V 音轨。
    return { kind: 'av-mse', streamType, info };
  } catch (e) {
    return { kind: 'av-mse', streamType: null, reason: e.message };
  } finally {
    clearTimeout(timer);
  }
}

async function waitForWorkletSpace(seq){
  if(seq!==state.seq) throw new Error('stale playback sequence');
  if(state.audioWorkletInFlight < state.audioWorkletMaxInFlight) return;
  await new Promise((resolve,reject)=>{
    state.audioWorkletWaiters.push({resolve,reject,seq});
  });
  if(seq!==state.seq) throw new Error('stale playback sequence');
}

function notifyWorkletSpace(){
  while(state.audioWorkletWaiters.length && state.audioWorkletInFlight < state.audioWorkletMaxInFlight){
    const w=state.audioWorkletWaiters.shift();
    if(w.seq===state.seq) w.resolve(); else w.reject(new Error('stale playback sequence'));
  }
}

function resampleStereoLinear(stereo, frames, srcRate, dstRate){
  // Linear-interpolation resampler with cross-chunk phase carry, so total
  // output duration stays exact over long streams (no cumulative drift).
  state.audioResampleAcc += frames*dstRate/srcRate;
  const outFrames=Math.floor(state.audioResampleAcc);
  if(outFrames<=0) return {pcm:null,frames:0};
  state.audioResampleAcc-=outFrames;
  const step=srcRate/dstRate;
  const out=new Float32Array(outFrames*2);
  let pos=state.audioResamplePos;
  for(let i=0;i<outFrames;i++){
    const ip=pos|0, fr=pos-ip;
    const i0=Math.min(ip,frames-1), i1=Math.min(ip+1,frames-1);
    const l0=stereo[i0*2], l1=stereo[i1*2];
    const r0=stereo[i0*2+1], r1=stereo[i1*2+1];
    out[i*2]=l0+(l1-l0)*fr;
    out[i*2+1]=r0+(r1-r0)*fr;
    pos+=step;
  }
  state.audioResamplePos=Math.max(0,pos-frames);
  return {pcm:out,frames:outFrames};
}

function parseMpegAudioFrameHeader(a,o=0){
  if(!a || o+4>a.length || a[o]!==0xff || (a[o+1]&0xe0)!==0xe0) return null;
  const b1=a[o+1], b2=a[o+2], b3=a[o+3];
  const verBits=(b1>>3)&3, layerBits=(b1>>1)&3;
  if(verBits===1 || layerBits===0) return null;
  const version=verBits===3?'MPEG1':(verBits===2?'MPEG2':'MPEG2.5');
  const layer=layerBits===3?'I':(layerBits===2?'II':'III');
  const brIdx=(b2>>4)&15, srIdx=(b2>>2)&3, pad=(b2>>1)&1;
  const srTable={MPEG1:[44100,48000,32000],MPEG2:[22050,24000,16000],'MPEG2.5':[11025,12000,8000]};
  const brTable={
    MPEG1:[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320,0],
    MPEG2:[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160,0],
    'MPEG2.5':[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160,0]
  };
  const sampleRate=(srTable[version]||[])[srIdx]||0;
  const bitrate=(brTable[version]||[])[brIdx]||0;
  if(!sampleRate || !bitrate || brIdx===15 || srIdx===3) return null;
  let frameLength;
  if(layer==='I') frameLength=(Math.floor(12*bitrate*1000/sampleRate)+pad)*4;
  else frameLength=Math.floor((version==='MPEG1'?144:72)*bitrate*1000/sampleRate)+pad;
  const mode=(b3>>6)&3;
  return {version,layer,bitrateKbps:bitrate,sampleRate,frameLength,padding:pad,channels:mode===3?1:2};
}

function takeMpegAudioFrames(maxFrames=8){
  const frames=[];
  let b=state.audioMpegBuffer;
  while(frames.length<maxFrames && b.length>=4){
    let h=parseMpegAudioFrameHeader(b,0);
    if(!h){
      let found=-1;
      for(let i=1;i+4<=b.length;i++){
        if(parseMpegAudioFrameHeader(b,i)){ found=i; break; }
      }
      if(found<0){
        // Keep the last 3 bytes in case a sync/header straddles the next fetch chunk.
        const keep=b.length>3?b.subarray(b.length-3):b;
        state.audioMpegResyncBytes += b.length-keep.length;
        b=new Uint8Array(keep); break;
      }
      state.audioMpegResyncBytes += found;
      b=b.subarray(found);
      h=parseMpegAudioFrameHeader(b,0);
      if(!h) break;
    }
    if(b.length<h.frameLength) break;
    frames.push(b.slice(0,h.frameLength));
    state.audioMpegFrames++;
    b=b.subarray(h.frameLength);
  }
  state.audioMpegBuffer=b;
  return frames;
}

function appendMpegAudioBytes(part){
  const old=state.audioMpegBuffer||new Uint8Array(0);
  const b=new Uint8Array(old.length+part.length);
  b.set(old,0); b.set(part,old.length);
  state.audioMpegBuffer=b;
}

async function startWebAudioMpeg(ch, seq){
  if(!isIOSSafari() || seq!==state.seq) return;
  const url=audioStreamUrl(ch);
  log('SAFARI_AUDIO: MP2PCM continuous source='+url);
  if(!url){ state.webAudioState='no-url'; state.webAudioError='cannot extract multicast /udp/group:port'; log('SAFARI_AUDIO: cannot extract multicast /udp/group:port; MP2 decoder disabled'); return; }
  if(!window.AudioContext && !window.webkitAudioContext){
    state.webAudioState='unsupported'; state.webAudioError='AudioContext unavailable'; log('SAFARI_MP2PCM: AudioContext unavailable'); updateDiag(); return;
  }
  const decNS=window['mpg123-decoder'];
  if(!decNS || !decNS.MPEGDecoder){
    state.webAudioState='unsupported'; state.webAudioError='local mpg123-decoder unavailable'; log('SAFARI_MP2PCM: local mpg123-decoder.min.js unavailable'); updateDiag(); return;
  }
  try{
    //const Ctx=window.AudioContext||window.webkitAudioContext;
    //const ctx=new Ctx({latencyHint:'interactive'}); state.webAudioCtx=ctx;
	let ctx=state.webAudioCtx;
    if (!ctx || ctx.state === 'closed') {
      ctx = new Ctx({latencyHint:'interactive'});
    }
    state.webAudioCtx = ctx;
	
    state.webAudioState='connecting'; state.audioUrl=url;
    state.audioAbortController=new AbortController();
    state.audioPcmQueue=[]; state.audioQueuedSeconds=0; state.audioNextTime=0;
    state.audioScheduledDuration=0; state.audioPlayedEstimate=0; state.audioVideoAnchor=0;
    state.audioStarted=false; state.audioStreamDone=false; state.audioChunks=0; state.audioDecodedSamples=0;
    state.audioRate=0; state.audioChannels=0; state.audioSyncDrift=0; state.audioSyncResets=0;
    state.audioWorkletInFlight=0; state.audioWorkletWaiters=[]; state.audioWorkletReady=false;
    state.audioRingSeconds=0; state.audioWorkletUnderruns=0; state.audioWorkletOverflows=0;
    state.audioCtxRate=ctx.sampleRate; state.audioResampleActive=false; state.audioResampleAcc=0; state.audioResamplePos=0; state.audioMpegBuffer=new Uint8Array(0); state.audioMpegFrames=0; state.audioMpegResyncBytes=0;
    log('SAFARI_MP2PCM: AudioContext created state='+ctx.state);
    log('SAFARI_MP2PCM: AudioContext rate='+ctx.sampleRate+'Hz (playback clock)');
    state.audioCtxRate=ctx.sampleRate;
    try{ await ctx.resume(); log('SAFARI_MP2PCM: AudioContext resume state='+ctx.state); }catch(e){ log('SAFARI_MP2PCM: AudioContext resume failed '+e.name+': '+e.message); }
    if(seq!==state.seq) return;

    // AudioWorklet is unavailable for the normal http://192.168.1.1 UI on iOS
    // because AudioWorklet requires a secure context. Prefer it when available,
    // otherwise use a ScriptProcessorNode fallback with the same bounded PCM queue.
    state.webAudioBackend='none';
    const workletUrl='/luci-static/resources/iptvweb/audio-worklet/pcm-player-worklet.js';
    if(ctx.audioWorklet && ctx.audioWorklet.addModule && window.AudioWorkletNode){
      try{
        await ctx.audioWorklet.addModule(workletUrl);
        if(seq!==state.seq) return;
        const node=new AudioWorkletNode(ctx,'iptvweb-pcm-player',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
        node.connect(ctx.destination);
        node.port.onmessage=e=>{
          const d=e.data||{};
          if(seq!==state.seq) return;
          if(d.type==='ready'){
            state.audioWorkletReady=true;
            log('SAFARI_MP2PCM: AudioWorklet ready rate='+((d.sampleRate||0))+'Hz ring='+((d.capacityFrames||0)/Math.max(1,d.sampleRate||44100)).toFixed(2)+'s');
          }else if(d.type==='ack'){
            state.audioWorkletInFlight=Math.max(0,state.audioWorkletInFlight-1);
            notifyWorkletSpace();
          }else if(d.type==='resetAck'){
            state.audioWorkletInFlight=Math.max(0,state.audioWorkletInFlight-Number(d.dropped||0));
            notifyWorkletSpace();
          }else if(d.type==='stats'){
            state.audioRingSeconds=Number(d.queuedSeconds||0);
            state.audioWorkletUnderruns=Number(d.underruns||0);
            state.audioWorkletOverflows=Number(d.overflows||0);
            state.audioPlaying=!!d.started;
          }else if(d.type==='started'){
            state.audioPlaying=true;
            log('SAFARI_MP2PCM: AudioWorklet playback started at audioTime='+Number(d.time||0).toFixed(3));
          }else if(d.type==='underrun'){
            state.audioWorkletUnderruns=Number(d.count||state.audioWorkletUnderruns+1);
            log('SAFARI_MP2PCM: AudioWorklet underrun #'+state.audioWorkletUnderruns);
          }else if(d.type==='overflow'){
            state.audioWorkletOverflows=Number(d.count||state.audioWorkletOverflows+1);
            log('SAFARI_MP2PCM: AudioWorklet ring overflow #'+state.audioWorkletOverflows);
          }
        };
        state.webAudioWorkletNode=node;
        await new Promise(resolve=>{
          const deadline=performance.now()+1000;
          const tick=()=>{ if(state.audioWorkletReady || performance.now()>deadline) resolve(); else setTimeout(tick,10); };
          tick();
        });
        if(!state.audioWorkletReady) throw new Error('AudioWorklet did not become ready');
        state.webAudioBackend='worklet';
      }catch(e){
        try{ if(state.webAudioWorkletNode){state.webAudioWorkletNode.disconnect();state.webAudioWorkletNode.port.close();} }catch(_e){}
        state.webAudioWorkletNode=null;
        state.audioWorkletReady=false;
        log('SAFARI_MP2PCM: AudioWorklet unavailable ('+e.message+'); using ScriptProcessor fallback');
      }
    } else {
      log('SAFARI_MP2PCM: AudioWorklet unavailable; using ScriptProcessor fallback');
    }
    if(state.webAudioBackend==='none'){
      // Plain HTTP iOS Safari cannot use AudioWorklet. Do not use
      // ScriptProcessor here: its main-thread callback is sensitive to the
      // fetch/decoder event loop and was causing repeated PCM underruns.
      state.webAudioBackend='buffersource';
      state.audioScheduleQueue=[];
      state.audioSchedulePendingSamples=0;
      state.audioScheduleCursor=0;
      state.audioScheduleStarted=false;
      state.audioScheduledSources=[];
      state.audioQueuedSeconds=0;
      state.audioRingSeconds=0;
      log('SAFARI_MP2PCM: AudioBufferSource fallback ready scheduler=audio-thread');
    }

    const decoder=new decNS.MPEGDecoder({enableGapless:false});
    state.webAudioDecoder=decoder;
    await decoder.ready;
    if(seq!==state.seq) return;
    state.webAudioState='streaming';
    log('SAFARI_MP2PCM: decoder ready; continuous MPEG frame stream');

    const r=await fetch(url,{cache:'no-store',signal:state.audioAbortController.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(!r.body || !r.body.getReader) throw new Error('ReadableStream unavailable');
    const reader=r.body.getReader();
    state.audioReader=reader;
	while(seq===state.seq){
	  const part=await reader.read();
	  if(part.done){ state.audioStreamDone=true; break; }
	  if(!part.value || !part.value.byteLength) continue;
	  
	  // ★ 直接把收到的字节喂给 decoder，不要前端自己切帧
	  const decodeWall0=performance.now();
	  let result;
	  try{
		result = decoder.decode(part.value);   // ← 用 decode 而不是 decodeFrame
		state.audioDecodeCalls++;
	  }catch(e){
		state.audioDecodeErrors++;
		log('SAFARI_MP2PCM: decode ERROR #'+state.audioDecodeErrors+' '+e.name+': '+e.message+' bytes='+part.value.byteLength);
		continue;
	  }
	  state.audioDecodeWallMs+=performance.now()-decodeWall0;
	  state.audioLastDecodeWall=performance.now();
	  
	  if(!result || !result.samplesDecoded){
		state.audioDecodeEmpty++;
		continue;
	  }
	  
	  const samples = result.samplesDecoded;
	  const rate = result.sampleRate || 48000;
	  const channels = result.channelData.length;
	  state.audioRate=rate; state.audioChannels=channels;
	  state.audioChunks++; state.audioDecodedSamples+=samples;
	  
	  // 交错 L/R
	  const stereo=new Float32Array(samples*2);
	  const left = result.channelData[0] || null;
	  const right = result.channelData[1] || left;
	  for(let i=0;i<samples;i++){
		stereo[i*2]   = left  ? (left[i]||0)  : 0;
		stereo[i*2+1] = right ? (right[i]||0) : stereo[i*2];
	  }
	  
	  const ctxRate=ctx.sampleRate;
	  if(state.audioChunks===1){
		log('SAFARI_MP2PCM: first batch decoded='+rate+'Hz ch='+channels+' ctx='+ctxRate+'Hz resample='+(rate!==ctxRate?'on':'off')+' samples='+samples+' inputBytes='+part.value.byteLength);
	  }
	  
	  let outStereo=stereo, outSamples=samples;
	  if(rate!==ctxRate){
		state.audioResampleActive=true;
		const rs=resampleStereoLinear(stereo,samples,rate,ctxRate);
		if(!rs.pcm || !rs.frames) continue;
		outStereo=rs.pcm; outSamples=rs.frames;
	  }
	  
	  // ... 原有的 worklet/buffersource 入队逻辑保持不变
	  if(state.webAudioBackend==='worklet'){
		await waitForWorkletSpace(seq);
		state.audioWorkletInFlight++;
		const chunkId=state.audioChunks;
		state.webAudioWorkletNode.port.postMessage({type:'pcm',id:chunkId,data:outStereo.buffer,samples:outSamples,rate:ctxRate},[outStereo.buffer]);
	  }else if(state.webAudioBackend==='buffersource'){
		state.audioScheduleQueue.push({pcm:outStereo,samples:outSamples});
		state.audioSchedulePendingSamples+=outSamples;
		state.audioQueuedSeconds=state.audioSchedulePendingSamples/ctxRate;
		state.audioRingSeconds=state.audioQueuedSeconds;
		if(!state.audioStarted && state.firstFrameAt && state.audioQueuedSeconds>=0.75) startAudioWorkletClock(seq);
		if(state.audioStarted) scheduleBufferSourceQueue(seq);
	  }
	  
	  // 诊断日志（保留）
	  const nowDiag=performance.now();
	  if(nowDiag-(state.audioLastDiagWall||0)>=1000){
		const dt=Math.max(0.001,(nowDiag-(state.audioLastDiagWall||nowDiag))/1000);
		const dc=state.audioChunks-(state.audioLastDiagChunks||0);
		const ds=state.audioDecodedSamples-(state.audioLastDiagSamples||0);
		log('SAFARI_MP2PCM: PCMSTAT chunks='+state.audioChunks+' dChunks='+dc+' samples='+state.audioDecodedSamples+' dSamples='+ds+' rate='+rate+' ctx='+ctxRate+' queue='+state.audioQueuedSeconds.toFixed(3)+'s decodeCalls='+state.audioDecodeCalls+' empty='+state.audioDecodeEmpty+' errors='+state.audioDecodeErrors+' wallSamplesPerSec='+(ds/dt).toFixed(0));
		state.audioLastDiagWall=nowDiag; state.audioLastDiagChunks=state.audioChunks; state.audioLastDiagSamples=state.audioDecodedSamples;
	  }
	}
    try{ reader.releaseLock(); }catch(e){}
    state.audioReader=null;
    if(state.audioStreamDone) log('SAFARI_MP2PCM: stream ended');
  }catch(e){
    if(seq!==state.seq || e.name==='AbortError') return;
    state.webAudioState='decode-error'; state.webAudioError=e.name+': '+e.message; state.audioError='WebAudioMP2PCMError';
    log('SAFARI_MP2PCM: '+e.name+': '+e.message); updateDiag();
  }
}

function startAudioWorkletClock(seq){
  if(seq!==state.seq || !state.webAudioCtx || state.audioStarted) return;
  if(state.webAudioBackend==='worklet' && !state.webAudioWorkletNode) return;
  if(state.webAudioBackend!=='worklet' && state.webAudioBackend!=='scriptprocessor' && state.webAudioBackend!=='buffersource') return;
  const v=$('video');
  if(!state.firstFrameAt && !state.firstPlayingAt) return;
  state.audioVideoAnchor=Number(v.currentTime||0);
  const startAt=state.webAudioCtx.currentTime+state.audioStartDelay;
  state.audioStartContextTime=startAt;
  state.audioStarted=true; state.audioPlaying=false; state.audioPendingStart=false;
  state.audioStartedAt=performance.now()+state.audioStartDelay*1000;
  if(state.webAudioBackend==='worklet' && state.webAudioWorkletNode){
    state.webAudioWorkletNode.port.postMessage({type:'start',startAt});
  }else if(state.webAudioBackend==='buffersource'){
    state.audioScheduleCursor=startAt;
    state.audioScheduleStarted=true;
    scheduleBufferSourceQueue(seq);
  }
  log('SAFARI_MP2PCM: audio anchor video='+state.audioVideoAnchor.toFixed(3)+' startDelay='+state.audioStartDelay.toFixed(2)+'s backend='+state.webAudioBackend);
}

function scheduleBufferSourceQueue(seq){
  if(seq!==state.seq || !state.webAudioCtx || state.webAudioBackend!=='buffersource' || !state.audioScheduleStarted) return;
  const ctx=state.webAudioCtx;
  const now=ctx.currentTime;
  if(state.audioScheduleCursor < now+0.02) state.audioScheduleCursor=now+0.02;
  while(state.audioScheduleQueue.length){
    const q=state.audioScheduleQueue.shift();
    const frames=q.samples|0;
    if(!frames) continue;
    const ab=ctx.createBuffer(2,frames,ctx.sampleRate);
    const left=new Float32Array(frames), right=new Float32Array(frames);
    for(let i=0;i<frames;i++){
      const l=q.pcm[i*2]||0;
      left[i]=l; right[i]=q.pcm[i*2+1]||l;
    }
    ab.copyToChannel(left,0); ab.copyToChannel(right,1);
    const src=ctx.createBufferSource();
    src.buffer=ab; src.connect(ctx.destination);
    const at=Math.max(state.audioScheduleCursor,ctx.currentTime+0.01);
    try{ src.start(at); }catch(e){ state.audioDecodeErrors++; try{src.disconnect();}catch(_){}; continue; }
    state.audioScheduledSources.push(src);
    src.onended=()=>{ try{src.disconnect();}catch(_){}; const i=state.audioScheduledSources.indexOf(src); if(i>=0) state.audioScheduledSources.splice(i,1); };
    state.audioScheduleCursor=at+frames/ctx.sampleRate;
    state.audioSchedulePendingSamples=Math.max(0,state.audioSchedulePendingSamples-frames);
  }
  state.audioQueuedSeconds=Math.max(0,state.audioScheduleCursor-ctx.currentTime);
  state.audioRingSeconds=state.audioQueuedSeconds;
}

function schedulePcmQueue(seq){
  startAudioWorkletClock(seq);
}

function audioSyncTick(seq){
  if(seq!==state.seq || !state.webAudioCtx || !state.audioStarted) return;
  const ctx=state.webAudioCtx, v=$('video');
  const now=ctx.currentTime;
  const audioPos=Math.max(0,now-state.audioStartContextTime);
  const videoPos=Math.max(0,(Number(v.currentTime||0)-state.audioVideoAnchor));
  const drift=audioPos-videoPos;
  state.audioPlayedEstimate=audioPos; state.audioSyncDrift=drift;
  // The Worklet owns the real audio clock. Do not repeatedly flush the ring
  // buffer for ordinary network jitter; only re-anchor after a large error.
  const sinceReset=state.audioLastResetAt ? (performance.now()-state.audioLastResetAt)/1000 : 999;
  if(Math.abs(drift)>0.80 && sinceReset>=5){
    log('SAFARI_AVSYNC: drift='+drift.toFixed(3)+'s video='+videoPos.toFixed(3)+' audio='+audioPos.toFixed(3)+' ring='+state.audioRingSeconds.toFixed(3)+'s');
    resetAudioSchedule(seq,'drift');
  }

}

function resetAudioSchedule(seq,reason){
  if(seq!==state.seq || !state.webAudioCtx) return;
  const ctx=state.webAudioCtx;
  state.audioVideoAnchor=Number($('video').currentTime||0);
  const startAt=ctx.currentTime+0.10;
  state.audioStartContextTime=startAt;
  state.audioLastResetAt=performance.now();
  state.audioSyncResets++;
  if(state.webAudioBackend==='worklet' && state.webAudioWorkletNode){
    state.webAudioWorkletNode.port.postMessage({type:'reset',startAt});
  }else if(state.webAudioBackend==='scriptprocessor'){
    state.audioPcmQueue=[]; state.audioPcmOffset=0; state.audioQueuedSeconds=0; state.audioRingSeconds=0;
  }else if(state.webAudioBackend==='buffersource'){
    for(const src of state.audioScheduledSources||[]){ try{src.stop();}catch(_){} try{src.disconnect();}catch(_){} }
    state.audioScheduledSources=[]; state.audioScheduleQueue=[]; state.audioSchedulePendingSamples=0;
    state.audioScheduleCursor=ctx.currentTime+0.10; state.audioQueuedSeconds=0; state.audioRingSeconds=0; state.audioScheduleStarted=true;
  }
  if(reason) log('SAFARI_AVSYNC: '+state.webAudioBackend+' re-anchor reason='+reason+' reset#='+state.audioSyncResets);
}

function rel(){return state.playStarted?((performance.now()-state.playStarted)/1000).toFixed(3):'0.000'}

function rangeText(r){
  try{
    if(!r||!r.length) return '-';
    const a=[];
    for(let i=0;i<r.length;i++) a.push(r.start(i).toFixed(3)+'-'+r.end(i).toFixed(3));
    return a.join(' | ');
  }catch(e){ return 'ERR:'+e.message; }
}
function bufferAhead(v){
  try{
    if(!v.buffered.length) return 0;
    const t=v.currentTime;
    for(let i=0;i<v.buffered.length;i++){
      if(t>=v.buffered.start(i)-0.05 && t<=v.buffered.end(i)+0.05) return Math.max(0, v.buffered.end(i)-t);
    }
    return 0;
  }catch(e){ return 0; }
}
function chromeCounters(v){
  const g=k=> (k in v) ? v[k] : '-';
  return 'decV='+g('webkitVideoDecodedByteCount')+' decA='+g('webkitAudioDecodedByteCount')+' frames='+g('webkitDecodedFrameCount')+' drop='+g('webkitDroppedFrameCount');
}
function mseDump(){
  try{
    const p=state.player; if(!p) return '-';
    const ctl=p._msectl || p._mseController || null;
    if(!ctl) return 'no _msectl';
    const sbs=ctl._sourceBuffers || ctl.sourceBuffers;
    if(!sbs) return 'no sourceBuffers';
    const parts=[];
    const keys=(!Array.isArray(sbs) && typeof sbs==='object') ? Object.keys(sbs) : null;
    if(keys){
      for(const k of keys){
        const sb=sbs[k];
        if(!sb){ parts.push(k+':null'); continue; }
        parts.push(k+' type='+(sb.type||'?')+' buffered='+rangeText(sb.buffered)+' updating='+!!sb.updating+' tsOffset='+Number(sb.timestampOffset||0).toFixed(4));
      }
      return parts.join(' || ') || 'empty';
    }
    return String(sbs);
  }catch(e){ return 'ERR:'+e.message; }
}

function gesturePlay(reason){

  log('USER_GESTURE '+reason+' paused='+v.paused+' current='+v.currentTime.toFixed(3)+' readyState='+v.readyState+' bufferAhead='+bufferAhead(v).toFixed(3));
  if(p){
    startStuckMonitor(state.seq);

  if(!p) return;
  try{
    const q=p.play();
    if(q&&q.then) q.then(()=>log('GESTURE player.play resolved')).catch(e=>log('GESTURE player.play rejected '+e.name+': '+e.message));
  }catch(e){ log('GESTURE player.play threw '+e.name+': '+e.message); }
}
function recoverPlayback(reason){
  const v=$('video'), p=state.player, now=performance.now();
  if(!p) return;
  if(state.recoveries>=2){ log('RECOVERY skipped limit=2 reason='+reason); return; }
  if(now-state.lastRecoveryAt<3000){ log('RECOVERY skipped cooldown reason='+reason); return; }
  state.lastRecoveryAt=now; state.recoveries++;
  log('RECOVERY #'+state.recoveries+' reason='+reason+' paused='+v.paused+' current='+v.currentTime.toFixed(3)+' readyState='+v.readyState+' bufferAhead='+bufferAhead(v).toFixed(3));
  try{
    const q=p.play();
    if(q&&q.then) q.then(()=>log('RECOVERY player.play resolved')).catch(e=>log('RECOVERY player.play rejected '+e.name+': '+e.message));
  }catch(e){ log('RECOVERY player.play threw '+e.name+': '+e.message); }
}
function startStuckMonitor(seq){
  if(state.stuckTimer) clearInterval(state.stuckTimer);
  state.lastProgressWall=performance.now();
  state.lastProgressTime=$('video').currentTime||0;
  state.playingSince=0;
  state.stuckTimer=setInterval(()=>{
    if(seq!==state.seq){ clearInterval(state.stuckTimer); return; }
    const v=$('video'), now=performance.now();
    if(v.paused||v.ended){ state.lastProgressWall=now; state.lastProgressTime=v.currentTime||0; return; }
    const t=v.currentTime||0;
    if(t>state.lastProgressTime+0.05){ state.lastProgressTime=t; state.lastProgressWall=now; return; }
    if(state.playingSince && now-state.playingSince>=2500 && now-state.lastProgressWall>=2000){
      recoverPlayback('time-not-advancing');
      state.playingSince=now;
    }
  }, 500);
}

function classifyTimeline(){
  const v=$('video'), now=performance.now(), tl=state.timeline;
  let reason='', c='STARTING';
  const recent=tl.filter(x=>now-x.wall<4000);
  const decoded=state.stats && Number(state.stats.decodedFrames||0);
  const buffered=bufferAhead(v);
  const playing=!!state.firstPlayingAt && !v.paused && !v.ended;
  if(state.userPaused && v.paused){ c='USER PAUSED'; reason='用户主动暂停'; state.classification=c; state.classificationReason=reason; return c; }
  if(v.error||state.lastErrorText){ c='MEDIA ERROR'; reason=state.lastErrorText||('video.error code='+v.error.code); }
  else if(state.audioDecodeError){ c='AUDIO DECODE ERROR'; reason='mpegts audio decode failure'; }
  else if(playing && recent.length>=2){
    const a=recent[0], b=recent[recent.length-1];
    const dt=(b.wall-a.wall)/1000, ct=b.currentTime-a.currentTime, pf=b.presentedFrames-a.presentedFrames;
    if(dt>=1.5 && ct<0.08){
      if(pf<=0 && decoded>10){ c='DECODER/TIMELINE STUCK'; reason='currentTime 与 presentedFrames 均不推进'; }
      else { c='TIMELINE STUCK'; reason='有 buffer，但 currentTime 不推进'; }
    } else if(ct>0.08 || pf>0){ c='PLAYBACK OK'; reason='时间线持续推进'; }
  }
  if(c==='STARTING' && recent.length>=2){
    const a=recent[0], b=recent[recent.length-1], dt=(b.wall-a.wall)/1000, ct=b.currentTime-a.currentTime;
    if(dt>=1.5 && ct<0.08 && buffered>1){ c='BUFFER GROWING NO PLAY'; reason='bufferAhead 在增长，但播放时间线未推进'; }
  }
  if(c==='STARTING' && state.firstPlayingAt){ c='PLAY STARTED'; reason='已触发 playing'; }
  if(c==='STARTING' && state.mediaInfo){ c='MEDIA DETECTED'; reason='已识别编码'; }
  state.classification=c; state.classificationReason=reason; state.classificationAt=now;
  return c;
}
function timelineSample(source){

  const item={

    currentTime:Number(v.currentTime||0), mediaTime:isFinite(mediaTime)?mediaTime:null,

// Safari Video-only fallback: filter MPEG-TS before mpegts.js sees it.
// We keep PAT/PMT/PCR/video packets, rewrite PMT to remove audio ES entries,
// and drop all other elementary-stream packets. This is intentionally a
// browser-side custom loader experiment; the normal A/V path is untouched.
function makeSafariVideoOnlyLoader(){
  const Base=mpegts.BaseLoader;
  if(!Base) throw new Error('mpegts.BaseLoader unavailable');
  const K=Base;
  class SafariVideoOnlyLoader extends K {
    constructor(seekHandler, config){
      super('SafariVideoOnlyLoader');
      this._seekHandler=seekHandler; this._config=config||{};
      this._status=0; this._needStash=false; this._aborter=null;
      this._buffer=new Uint8Array(0); this._byteStart=0; this._outBytes=0;
      this._patPid=null; this._pmtPid=null; this._videoPid=null; this._pcrPid=null;
      this._sectionBuf=new Map(); this._sectionNeed=new Map(); this._sectionType=new Map();
      this._started=false; this._closed=false;
    }
    open(dataSource, range){
      this._status=1; this._dataSource=dataSource; this._range=range||{};
      const url=dataSource.url;
      const headers=new Headers();
      try{
        const h=(this._config&&this._config.headers)||{};
        Object.keys(h).forEach(k=>headers.set(k,h[k]));
      }catch(e){}
      if(range && (range.from!=null || range.to!=null)){
        const from=range.from==null?0:range.from;
        const to=range.to==null?'':range.to;
        headers.set('Range','bytes='+from+'-'+to);
      }
      this._aborter=new AbortController();
      fetch(url,{headers,signal:this._aborter.signal,cache:'no-store'}).then(async r=>{
        if(!r.ok && r.status!==206) throw new Error('HTTP '+r.status);
        this._status=2;
        if(!r.body) throw new Error('ReadableStream unavailable');
        const reader=r.body.getReader();
        let pos=(range&&range.from!=null)?range.from:0;
        while(!this._closed){
          const q=await reader.read();
          if(q.done) break;
          if(!q.value || !q.value.length) continue;
          const out=this._filterChunk(q.value);
          if(out.length){
            const ab=out.buffer.slice(out.byteOffset,out.byteOffset+out.byteLength);
            this._outBytes+=out.byteLength;
            if(this.onDataArrival) this.onDataArrival(ab,pos,this._outBytes);
            pos+=out.byteLength;
          }
        }
        if(this._closed) return;
        this._status=4;
        if(this.onComplete) this.onComplete((range&&range.from!=null)?range.from:0,pos-1);
      }).catch(e=>{
        if(this._closed || (e&&e.name==='AbortError')) return;
        this._status=3;
        if(this.onError) this.onError('Exception',{code:-1,msg:String(e&&e.message||e)});
      });
    }
    abort(){ try{ if(this._aborter) this._aborter.abort(); }catch(e){} this._status=0; }
    destroy(){ this._closed=true; this.abort(); this._buffer=new Uint8Array(0); }
    isWorking(){ return this._status===1 || this._status===2; }
    get status(){ return this._status; }
    get needStashBuffer(){ return this._needStash; }
    _appendBuffer(a){
      if(!this._buffer.length) this._buffer=a.slice();
      else { const x=new Uint8Array(this._buffer.length+a.length); x.set(this._buffer); x.set(a,this._buffer.length); this._buffer=x; }
    }
    _filterChunk(chunk){
      this._appendBuffer(chunk);
      const packets=[]; let off=0;
      while(this._buffer.length-off>=188){
        if(this._buffer[off]!==0x47){
          const n=this._buffer.indexOf(0x47,off+1);
          if(n<0){ off=this._buffer.length; break; }
          off=n;
          if(this._buffer.length-off<188) break;
        }
        if(this._buffer.length-off<188) break;
        let ok=true;
        for(let i=1;i<4;i++){ if(this._buffer[off+i]===undefined){ok=false;break;} }
        if(!ok) break;
        packets.push(this._buffer.slice(off,off+188)); off+=188;
      }
      this._buffer=this._buffer.slice(off);
      const out=[];
      for(const pkt of packets){
        const pid=((pkt[1]&0x1f)<<8)|pkt[2];
        if(pid===0){ this._inspectPAT(pkt); out.push(pkt); continue; }
        if(this._pmtPid!=null && pid===this._pmtPid){
          const rp=this._rewritePMTPacket(pkt);
          if(rp) out.push(rp);
          continue;
        }
        if(this._videoPid!=null && pid===this._videoPid){ out.push(pkt); continue; }
        if(this._pcrPid!=null && pid===this._pcrPid){ out.push(pkt); continue; }
      }
      const total=out.length*188; const ret=new Uint8Array(total);
      for(let i=0;i<out.length;i++) ret.set(out[i],i*188);
      return ret;
    }
    _payload(pkt){
      const afc=(pkt[3]>>4)&3;
      let o=4;
      if(afc===0 || afc===2) return null;
      if(afc===3){ const n=pkt[4]; o=5+n; if(o>188) return null; }
      return pkt.slice(o);
    }
    _inspectPAT(pkt){
      if(!(pkt[1]&0x40)) return;
      const pl=this._payload(pkt); if(!pl||pl.length<9) return;
      const ptr=pl[0]; const s=1+ptr;
      if(pl.length<s+8 || pl[s]!==0x00) return;
      const sectionLen=((pl[s+1]&0x0f)<<8)|pl[s+2];
      const end=Math.min(pl.length,s+3+sectionLen);
      for(let i=s+8;i+3<end-4;i+=4){
        const pn=(pl[i]<<8)|pl[i+1], pid=((pl[i+2]&0x1f)<<8)|pl[i+3];
        if(pn!==0){ this._pmtPid=pid; break; }
      }
    }
    _sectionFromPacket(pkt){
      const pl=this._payload(pkt); if(!pl) return null;
      const pusi=!!(pkt[1]&0x40); const pid=((pkt[1]&0x1f)<<8)|pkt[2];
      let data=pl;
      if(pusi){ const ptr=data[0]||0; if(ptr+1>data.length) return null; data=data.slice(1+ptr); }
      if(!data.length) return null;
      return {pid,data,pusi};
    }
    _rewritePMTPacket(pkt){
      const x=this._sectionFromPacket(pkt); if(!x) return pkt;
      if(!x.pusi) return null; // Current IPTV PMTs fit one TS packet; never leak an unfiltered continuation.
      const d=x.data;
      if(d.length<12 || d[0]!==0x02) return pkt;
      const sl=((d[1]&0x0f)<<8)|d[2];
      const fullLen=3+sl;
      if(fullLen>d.length) return pkt;
      const section=d.slice(0,fullLen);
      const pcr=((section[8]&0x1f)<<8)|section[9];
      this._pcrPid=pcr;
      const pil=((section[10]&0x0f)<<8)|section[11];
      let i=12+pil; if(i>section.length-4) return pkt;
      const es=[];
      while(i<section.length-4){
        if(i+5>section.length-4) break;
        const st=section[i], ep=((section[i+1]&0x1f)<<8)|section[i+2];
        const eil=((section[i+3]&0x0f)<<8)|section[i+4];
        if(i+5+eil>section.length-4) break;
        const keep=(st===0x1b || st===0x24 || st===0x02 || st===0x10 || st===0x1f || st===0x20);
        if(keep){ es.push(section.slice(i,i+5+eil)); if(this._videoPid==null) this._videoPid=ep; }
        i+=5+eil;
      }
      if(this._videoPid==null || !es.length) return pkt;
      const body=section.slice(0,12+pil);
      const newSection=new Uint8Array(12+pil+es.reduce((n,a)=>n+a.length,0)+4);
      newSection.set(body,0); let o=body.length; for(const e of es){newSection.set(e,o);o+=e.length;}
      const newLen=newSection.length-3;
      newSection[1]=(newSection[1]&0xf0)|((newLen>>8)&0x0f); newSection[2]=newLen&0xff;
      const crc=this._crc32(newSection.slice(0,newSection.length-4));
      newSection[newSection.length-4]=(crc>>>24)&255; newSection[newSection.length-3]=(crc>>>16)&255;
      newSection[newSection.length-2]=(crc>>>8)&255; newSection[newSection.length-1]=crc&255;
      // Repack a one-packet PMT. Preserve continuity counter and adaptation field.
      const np=pkt.slice(); const afc=(np[3]>>4)&3; let po=4;
      if(afc===3){po=5+(np[4]||0);} else if(afc!==1) return pkt;
      const avail=188-po; const payload=new Uint8Array(avail); payload.fill(0xff); payload[0]=0; payload.set(newSection,1);
      np.set(payload,po); this._sectionVideoLogged=true;
      if(!this._loggedFilter){ this._loggedFilter=true; setTimeout(()=>log('SAFARI_TS_FILTER: PMT rewritten; video PID='+this._videoPid+' PCR PID='+this._pcrPid+' audio ES removed'),0); }
      return np;
    }
    _crc32(data){
      let crc=0xffffffff;
      for(let i=0;i<data.length;i++){
        crc^=data[i]<<24;
        for(let b=0;b<8;b++) crc=(crc&0x80000000)?((crc<<1)^0x04c11db7)>>>0:(crc<<1)>>>0;
      }
      return crc>>>0;
    }
  }
  return SafariVideoOnlyLoader;
}

function safariMseFallbackToVideo(ch, url, seq, failedPlayer){
  if(seq!==state.seq || !isIOSSafari() || state.safariFallbackTried) return;
  if(state.player!==failedPlayer) return;
  state.safariFallbackTried=true;
  state.safariFallbackTimer=0;
  log('SAFARI_MSE_FALLBACK: A/V MSE 失败，开始一次性 Video-only 回退');
  setStatus('Safari MSE失败 → 回退 Video-only');
  stopDiagTimers();
  try{ failedPlayer.pause(); }catch(e){}
  try{ failedPlayer.unload(); }catch(e){ log('FALLBACK unload error '+e.message); }
  try{ failedPlayer.detachMediaElement(); }catch(e){ log('FALLBACK detach error '+e.message); }
  try{ failedPlayer.destroy(); }catch(e){ log('FALLBACK destroy error '+e.message); }
  if(state.player===failedPlayer) state.player=null;
  const v=$('video');
  try{ v.pause(); }catch(e){}
  try{ v.removeAttribute('src'); v.load(); }catch(e){ log('FALLBACK video reset error '+e.message); }
  state.playIssuedAt=0;
  state.firstFrameAt=0;
  state.firstPlayingAt=0;
  state.waitingStart=0;
  state.stallStart=0;
  state.waitingCount=0;
  state.stallCount=0;
  state.lastProgressWall=performance.now();
  state.lastProgressTime=0;
  state.playingSince=0;
  state.mediaInfo=null;
  state.lastErrorText='';
  state.audioDecodeError=false;
  state.classification='FALLBACK';
  state.classificationReason='Safari A/V MSE error → Video-only';
  state.avMode='video-fallback';
  log('SAFARI_MSE_FALLBACK: old player fully destroyed; waiting 250ms before Video-only create');
  setTimeout(()=>{
    if(seq!==state.seq || state.safariFallbackTried!==true || state.player) return;
    log('SAFARI_MSE_FALLBACK: createPlayer mode=video, hasAudio=false + TS filter');
    createPlayer(ch, url, seq, 'video');
    // WebAudio experiment is independent of the video-only fallback.
  },250);
}

function scheduleSafariMseFallback(ch, url, seq, failedPlayer, details, type){
  if (isIOSSafari() && state.safariAudioRoute !== 'mpeg-audio') {
    log('SAFARI_MSE_FALLBACK: route=' + state.safariAudioRoute +
        '，保留 A/V，不切换到 video-only');
    return;
  }
  if(!isIOSSafari() || state.safariFallbackTried) return;
  if(state.avMode!=='av' || state.player!==failedPlayer) return;
  const text=String(details||type||'');
  const isMse=/MSE|mse/i.test(text) || text===String(mpegts.ErrorDetails && mpegts.ErrorDetails.MEDIA_MSE_ERROR || 'MEDIA_MSE_ERROR');
  if(!isMse) return;
  if(state.safariFallbackTimer) return;
  log('SAFARI_MSE_FALLBACK: detected mpegts ERROR '+text+'; 600ms 后回退');
  state.safariFallbackTimer=setTimeout(()=>safariMseFallbackToVideo(ch,url,seq,failedPlayer),600);
}

function createPlayer(ch, url, seq, mode){
  if(seq!==state.seq) return;
  const v=$('video');
  const iosSafari=isIOSSafari();
  attachVideoDiagnostics(v, seq);
  if(mode==='muted'){ v.muted=true; v.volume=0; log('audio experiment: muted=true volume=0 (audio still demuxed)'); }
  else { v.muted=false; }
  // iPhone/iPad Safari uses ManagedMediaSource. Marking the source live is important
  // for Apple's live-MSE path; keep the proven isLive=false path on other browsers.
  const ds={type:'mpegts', url:url, isLive:iosSafari};
  if(mode==='video') {
    ds.hasAudio=false;
  }
  const config=playerConfig();
  if(mode==='video' && iosSafari){
    try{ config.customLoader=makeSafariVideoOnlyLoader(); log('SAFARI_TS_FILTER: custom MPEG-TS video-only loader enabled via Config.customLoader');
      if(mode==='video') log('SAFARI_AUDIO: video MSE path is audio-free; WebAudio MPEG Audio PES experiment is independent'); }
    catch(e){ log('SAFARI_TS_FILTER: custom loader unavailable '+e.message); }
  }
  log('CONFIG '+JSON.stringify(config));
  log('MediaDataSource '+JSON.stringify(ds));
  if(iosSafari) log('iOS Safari path: ManagedMediaSource + isLive=true');
  try{
    if(window.MediaSource){
      log('isTypeSupported video/mp4;codecs="avc1.640029"='+MediaSource.isTypeSupported('video/mp4; codecs="avc1.640029"'));
      log('isTypeSupported audio/mp4;codecs="mp3"='+MediaSource.isTypeSupported('audio/mp4; codecs="mp3"'));
      log('isTypeSupported audio/mpeg='+MediaSource.isTypeSupported('audio/mpeg'));
    }
  }catch(e){}
  let p;
  try{ p=mpegts.createPlayer(ds, config); }
  catch(e){ setStatus('播放器创建失败'); log('createPlayer error '+e.stack); return; }
  state.player=p;
  p.on(mpegts.Events.ERROR, (type, details, info)=>{
    if(seq!==state.seq) return;
    state.lastErrorText=String(details||type);
    if(/audio/i.test(String(details||'')+' '+JSON.stringify(info||{}))) state.audioDecodeError=true;
    log('mpegts.ERROR type='+type+' details='+details+' info='+JSON.stringify(info||{}));
    scheduleSafariMseFallback(ch,url,seq,p,details,type);
    setStatus('播放错误：'+details);
    updateDiag();
  });
  p.on(mpegts.Events.MEDIA_INFO, info=>{
    if(seq!==state.seq) return;
    state.mediaInfo=info||{};
    if(info&&info.videoCodec) state.lastVideoCodec=info.videoCodec;
    if(info&&info.width) state.lastVideoWidth=info.width;
    if(info&&info.height) state.lastVideoHeight=info.height;
    log('MEDIA_INFO '+JSON.stringify(info));
    log('MSE after MEDIA_INFO '+mseDump());
    const vc=info&&info.videoCodec?info.videoCodec:'';
    const ac=info&&info.audioCodec?info.audioCodec:'';
    setStatus((mode==='video'?(state.safariFallbackTried?'Safari回退 Video-only · ':'Video-only · '):mode==='muted'?'Muted-AV · ':'A/V · ')+(vc||'')+(ac?' · '+ac:''));
    updateDiag();
  });
  ['LOADING_COMPLETE','RECOVERED_EARLY_EOF','STATISTICS_INFO'].forEach(name=>{
    const ev=mpegts.Events[name];
    if(!ev) return;
    p.on(ev, info=>{
      if(seq!==state.seq) return;
      if(name==='STATISTICS_INFO'){ state.stats=info||{}; return; }
      log(name+(info?' '+JSON.stringify(info):''));
    });
  });
  if(mpegts.LoggingControl && mpegts.LoggingControl.addLogListener){
    try{
      mpegts.LoggingControl.addLogListener((type, msg)=>{
        if(seq!==state.seq) return;
        const text=String(msg||'');
        if(!/PMT|PTS|DTS|timestamp|continuity|discontinuity|PCR|PES|private|SourceBuffer|timestampOffset/i.test(text)) return;
        if(/PTS/i.test(text)) state.ts.pts++;
        if(/DTS/i.test(text)) state.ts.dts++;
        if(/continuity|discontinuity/i.test(text)) state.ts.continuity++;
        // TSLOG is intentionally suppressed to prevent video/transport diagnostics from
        // pushing the MP2PCM diagnostic lines out of the on-page log buffer.
        if(false && $('microMode').value==='full') log('TSLOG '+text.slice(0,700));
      });
    }catch(e){ log('TSLOG listener install failed '+e.message); }
  }
  p.attachMediaElement(v); log('attachMediaElement');
  p.load(); log('player.load()');
  startStuckMonitor(seq); startDiagTimer(seq);
  const startStableMonitor=()=>{
    if(!isIOSSafari() || mode!=='video') return;
    if(state.stableTimer) clearTimeout(state.stableTimer);
    state.stableSince=performance.now(); state.stableLogged=false;
    state.stableTimer=setTimeout(()=>{
      if(seq!==state.seq || state.player!==p || v.paused || v.readyState<2) return;
      state.stableTimer=0; state.stableLogged=true;
      log('SAFARI_VIDEO_ONLY_STABLE: continuous playback >=30s');
      setStatus('Safari Video-only · 稳定播放 ≥30s');
      updateDiag();
    },30000);
  };
  v.addEventListener('playing', startStableMonitor, {once:true});
  const start=()=>{
    if(seq!==state.seq || state.playIssuedAt) return;
    state.startTimer=0;
    state.playIssuedAt=performance.now();
    log('EXPLICIT play() readyState='+v.readyState+' bufferAhead='+bufferAhead(v).toFixed(3)+' (no buffer gate)');
    try{
      const q=p.play();
      if(q&&q.then) q.then(()=>log('player.play resolved')).catch(e=>log('player.play rejected '+e.name+': '+e.message));
    }catch(e){ log('player.play threw '+e.name+': '+e.message); }
  };
  if(v.readyState>=1) start();
  else v.addEventListener('loadedmetadata', start, {once:true});
}

function resetPlayState(){

  state.playStarted=performance.now();
  state.firstFrameAt=0; state.firstPlayingAt=0; state.last={t:0,wall:0};
  state.waitingStart=0; state.stallStart=0; state.waitingCount=0; state.stallCount=0;
  state.stats={}; state.playIssuedAt=0; state.lastRecoveryAt=0; state.recoveries=0;
  state.lastProgressWall=performance.now(); state.lastProgressTime=0; state.playingSince=0;
  state.mediaInfo=null; state.lastVideoCodec=''; state.lastVideoWidth=0; state.lastVideoHeight=0; state.lastErrorText=''; state.audioDecodeError=false;
  state.ts={pts:0,dts:0,continuity:0,privateAudio:[]};
  state.timeline=[]; state.lastFrame=null;
  state.classification='STARTING'; state.classificationReason='';
  state.userPaused=false; state.stopping=false; state.nudgedThisPlay=false;
  state.safariFallbackTried=false;
  state.audioUrl=''; state.audioStartedAt=0; state.audioError=''; state.audioPlaying=false;
  state.webAudioState='off'; state.webAudioError=''; state.webAudioInfo=null; state.webAudioBuffer=null; state.webAudioSource=null; state.webAudioDecoder=null;
  state.audioDecodeError=false;
  state.stableSince=0; state.stableLogged=false;
  if(state.stableTimer){ clearTimeout(state.stableTimer); state.stableTimer=0; }
  if(state.safariFallbackTimer){ clearTimeout(state.safariFallbackTimer); state.safariFallbackTimer=0; }
}

function play(ch){
  const seq=++state.seq;
  state.current=ch; state.active=ch.group; renderGroups();
  stopPlayer();
  const v=$('video');
  installGestureHooks();
  try{ v.pause(); }catch(e){}
  v.autoplay=false; v.removeAttribute('autoplay'); v.removeAttribute('src'); v.load();
  if(state.startTimer){ clearTimeout(state.startTimer); state.startTimer=0; }
  resetPlayState();
  $('now').firstChild.textContent=ch.name;
  const url=streamUrl(ch);
  //state.avMode=isIOSSafari() ? 'video' : avMode();
  //log('PLAY '+ch.name);
  //log('URL '+url);
  //log('isLive='+ (isIOSSafari()?'true (iOS Safari)':'false') +' avMode='+state.avMode+' safariFallbackTried='+state.safariFallbackTried+' rev='+REV);
  // Start the WebAudio MPEG Audio PES experiment from the channel-selection gesture.
  // It is independent of the video MSE path and is intentionally best-effort.
  //if(isIOSSafari()) startWebAudioMpeg(ch, seq);

  if (isIOSSafari()) {
    // Safari 上如果要异步等待 probe，AudioContext 最好仍在频道点击手势中
    // 同步创建/调用 resume；startWebAudioMpeg 应复用这个 context。
    prepareSafariAudioContextFromGesture();

	detectSafariAudioRoute(ch, seq).then(route => {
	  if (!route || seq !== state.seq) return;

	  if (route.kind === 'mpeg-audio') {
		state.safariAudioRoute = 'mpeg-audio';
		state.avMode = 'video';

		log('SAFARI route=video-only + MPEG Audio stream_type=' +
			route.streamType);

		startWebAudioMpeg(ch, seq);
		createPlayer(ch, url, seq, 'video');
	  } else {
		state.safariAudioRoute = 'av-mse';
		state.avMode = 'av';

		log('SAFARI route=A/V MSE stream_type=' +
			(route.streamType == null ? 'unknown' : route.streamType));

		discardPreparedSafariAudioContext();
		createPlayer(ch, url, seq, 'av');
	  }
	}).catch(e => {
	  if (seq !== state.seq) return;

	  state.safariAudioRoute = 'unknown';
	  state.avMode = 'av';

	  log('SAFARI route probe failed; keep A/V: ' + e.message);
	  discardPreparedSafariAudioContext();
	  createPlayer(ch, url, seq, 'av');
	});

    return;
  }

  // 非 iOS Safari 保持原有逻辑
  state.avMode = avMode();
  //createPlayer(ch, url, seq, state.avMode);
  
  //const iosSafari = isIOSSafari();
  //const useAvMse = iosSafari && safariUsesAvMse(ch);
  //const useMp2Pcm = iosSafari && !useAvMse;

  //state.avMode = iosSafari
  //  ? (useAvMse ? 'av' : 'video')
  //  : avMode();

  //log('Safari route=' + (useAvMse ? 'AV-MSE (AAC)' :
  //  useMp2Pcm ? 'video-only + MP2PCM' : state.avMode));

  // 只有走 MP2PCM 的频道才启动独立 MPEG 音频解码
  //if (useMp2Pcm) startWebAudioMpeg(ch, seq);  

  if(!window.mpegts || !mpegts.isSupported()){
    setStatus('浏览器不支持 MSE MPEG-TS / mpegts.js 未安装');
    log('mpegts.isSupported=false localMarker='+!!window.__iptvwebMpegtsLocalRequired);
    return;
  }
  createPlayer(ch, url, seq, state.avMode);
}

function stopPlayback(){
  state.stopping=true;
  stopWebAudio(); state.userPaused=false;
  log('STOP: 用户请求停止并断开流');
  stopDiagTimers();
  const p=state.player, v=$('video');
  try{ v.pause(); }catch(e){}
  try{ if(p) p.unload(); }catch(e){ log('STOP unload error '+e.message); }
  try{ if(p) p.detachMediaElement(); }catch(e){}
  try{ if(p) p.destroy(); }catch(e){}
  state.player=null;
  try{ v.removeAttribute('src'); v.load(); }catch(e){}
  setStatus('已停止并断开');
  log('STOP: player destroyed / stream disconnected');
  state.stopping=false;
  updateDiag();
}
function jumpToLatest(){
  const v=$('video');
  try{
    if(!v.buffered.length){ log('JUMP: 无 buffered'); return; }
    const end=v.buffered.end(v.buffered.length-1);
    const target=Math.max(v.buffered.start(v.buffered.length-1), end-0.5);
    log('JUMP: bufferedEnd='+end.toFixed(3)+' target='+target.toFixed(3));
    v.currentTime=target;
    const p=v.play();
    if(p&&p.catch) p.catch(e=>log('JUMP play rejected '+e.name+': '+e.message));
  }catch(e){ log('JUMP error '+e.message); }
}
function reinit(){
  if(!state.current){ log('REINIT: 没有当前频道'); return; }
  log('REINIT: '+state.current.name);
  play(state.current);
}

function detectAudioPayload(a){
  const scan=a.subarray(0,Math.min(a.length,16384));
  const eac3=findEac3Frames(scan,8);
  if(eac3.length) return {codec:eac3[0].codec,frames:eac3};
  const mp3=findMp3Frames(scan,8);
  if(mp3.length) return {codec:'MP3',frames:mp3};
  for(let i=0;i+7<scan.length;i++){
    if(scan[i]===0xff && (scan[i+1]&0xf6)===0xf0){
      const profile=((scan[i+2]>>6)&3)+1, srIdx=(scan[i+2]>>2)&15;
      const sr=[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000][srIdx]||0;
      if(sr) return {codec:'AAC-ADTS',frames:[{offset:i,profile,sampleRate:sr}]};
    }
  }
  return {codec:'UNKNOWN',frames:[]};
}

function parseTsBuffer(u8){
  const res={
    bytes:u8.length, packets:0, syncLoss:0, continuity:0, mediaContinuity:0, nullContinuity:0, disc:0, rai:[],
    pids:{}, pmt:[], privateAudio:[], pesSamples:{},
    video:{pid:null,type:null,firstPts:null,firstDts:null,lastPts:null,count:0},
    audio:{pid:null,type:null,firstPts:null,firstDts:null,lastPts:null,count:0},
    pcr:{pid:null,first:null,last:null,count:0}
  };
  let off=0;
  while(off<u8.length && u8[off]!==0x47) off++;
  const lastCC={}; let pmtPid=null;
  const pesBuf={}, pesMeta={};
  function finalizePes(pid){
    const a=pesBuf[pid]; if(!a||a.length<9) return;
    const h=readPesHeader(a); if(!h) return;
    const payload=a.subarray(h.headerBytes);
    const rec={pid,streamId:h.sid,packetLength:h.len,pts:h.pts,dts:h.dts,payloadLength:payload.length,head:hexBytes(payload,128),audio:detectAudioPayload(payload)};
    const arr=res.pesSamples[pid]||(res.pesSamples[pid]=[]); if(arr.length<8) arr.push(rec);
  }
  function startPes(pid, bytes){
    finalizePes(pid); pesBuf[pid]=Array.from(bytes); 
  }
  for(; off+188<=u8.length; ){
    if(u8[off]!==0x47){
      res.syncLoss++; let f=-1; for(let i=off+1;i+188<=u8.length;i++) if(u8[i]===0x47){f=i;break;}
      if(f<0) break; off=f; continue;
    }
    const p=u8.subarray(off,off+188); off+=188; res.packets++;
    const pid=((p[1]&31)<<8)|p[2], pusi=!!(p[1]&0x40), afc=(p[3]>>4)&3, cc=p[3]&15;
    let d=4, hasPcr=false;
    if(afc===2 || afc===3){ const al=p[4]; d=5+al; if(al>=1){ const flags=p[5]; if(flags&0x80) res.disc++; if(flags&0x40) res.rai.push({pkt:res.packets,pid}); if(al>=7&&(flags&0x10)){ const base=((p[6]*0x1000000)+(p[7]<<16)+(p[8]<<8)+p[9])>>>0, ext=((p[10]&1)<<8)|p[11], v=base*300+ext; if(res.pcr.first==null){res.pcr.first=v;res.pcr.pid=pid} res.pcr.last=v;res.pcr.count++;hasPcr=true; } } }
    const rec=res.pids[pid]||(res.pids[pid]={packets:0,starts:0,continuity:0}); rec.packets++; if(pusi) rec.starts++;
    if(lastCC[pid]!=null && ((lastCC[pid]+1)&15)!==cc && !hasPcr){ rec.continuity++; res.continuity++; if(pid===8191) res.nullContinuity++; else res.mediaContinuity++; }
    lastCC[pid]=cc;
    if(!(afc===1||afc===3)||d>=188) continue;
    const payload=p.subarray(d);
    if(pusi && pid===0 && payload.length){
      let i=payload[0]+1; if(i+8<payload.length && payload[i]===0x00){ const sl=((payload[i+1]&15)<<8)|payload[i+2]; let o=i+8,end=Math.min(payload.length,i+3+sl); while(o+4<=end){const prog=(payload[o]<<8)|payload[o+1],ppid=((payload[o+2]&31)<<8)|payload[o+3];if(prog)pmtPid=ppid;o+=4;} }
    }
    if(pusi && pmtPid!=null && pid===pmtPid && payload.length){
      let i=payload[0]+1; if(i+12<payload.length && payload[i]===0x02){ const sl=((payload[i+1]&15)<<8)|payload[i+2], pil=((payload[i+10]&15)<<8)|payload[i+11]; let o=i+12+pil,end=Math.min(payload.length,i+3+sl),streams=[]; while(o+5<=end){ const st=payload[o],epid=((payload[o+1]&31)<<8)|payload[o+2],eil=((payload[o+3]&15)<<8)|payload[o+4]; streams.push({type:st,pid:epid,name:streamTypeName(st)}); if(st===27||st===36||st===2||st===1){if(res.video.pid==null){res.video.pid=epid;res.video.type=st}} if(st===3||st===4||st===15||st===17){if(res.audio.pid==null){res.audio.pid=epid;res.audio.type=st}} if(st===6) res.privateAudio.push({pid:epid,type:st}); o+=5+eil; } if(streams.length) res.pmt=streams; }
    }
    if(pusi){ startPes(pid,payload); } else if(pesBuf[pid] && pesBuf[pid].length<200000){ pesBuf[pid].push(...payload); }
    if(pusi && payload.length>=14 && payload[0]===0 && payload[1]===0 && payload[2]===1){
      const sid=payload[3],flags=payload[7],po=9; let pts=null,dts=null; if((flags&0x80)&&po+4<payload.length)pts=pts90(payload,po); if((flags&0xc0)===0xc0&&po+9<payload.length)dts=pts90(payload,po+5);
      const isVid=(res.video.pid!=null&&pid===res.video.pid)||(sid>=0xe0&&sid<=0xef), isAud=(res.audio.pid!=null&&pid===res.audio.pid)||(sid>=0xc0&&sid<=0xdf);
      if(isVid){res.video.count++;if(res.video.firstPts==null&&pts!=null)res.video.firstPts=pts;if(res.video.firstDts==null&&dts!=null)res.video.firstDts=dts;if(pts!=null)res.video.lastPts=pts;if(res.video.pid==null)res.video.pid=pid}
      if(isAud){res.audio.count++;if(res.audio.firstPts==null&&pts!=null)res.audio.firstPts=pts;if(res.audio.firstDts==null&&dts!=null)res.audio.firstDts=dts;if(pts!=null)res.audio.lastPts=pts;if(res.audio.pid==null)res.audio.pid=pid}
    }
  }
  Object.keys(pesBuf).forEach(finalizePes);
  for(const x of res.privateAudio){ x.samples=res.pesSamples[x.pid]||[]; }
  return res;
}
function fmtPts(v){ if(v==null)return '-'; return v+' ('+(v/90).toFixed(3)+' ms, '+(v/90000).toFixed(6)+' s)'; }
function formatAudioMicroscope(res){
  const lines=['===== E-AC-3 精确解析 + Private PES rev'+REV+' ====='];
  const pids=[...new Set([...res.privateAudio.map(x=>x.pid),...Object.keys(res.pesSamples).map(Number).filter(pid=>pid!==res.video.pid&&pid!==8191)])];
  if(!pids.length) lines.push('未发现可分析的音频/PES PID');
  for(const pid of pids){
    const samples=res.pesSamples[pid]||[], pmt=res.privateAudio.find(x=>x.pid===pid), all=[];
    for(const s of samples){
      const a=s.audio||{codec:'UNKNOWN',frames:[]};
      lines.push(`PID ${pid} ${pmt?'PMT type='+pmt.type+'('+streamTypeName(pmt.type)+')':'PMT type=-'} PES stream_id=0x${s.streamId.toString(16).padStart(2,'0')} len=${s.packetLength} payload=${s.payloadLength}`);
      lines.push('  PTS='+fmtPts(s.pts)+' DTS='+fmtPts(s.dts));
      lines.push('  payload[0:128]='+s.head);
      if((a.codec==='E-AC-3'||a.codec==='AC-3')&&a.frames.length){
        a.frames.slice(0,4).forEach((f,i)=>lines.push(`  ${a.codec} frame#${i+1} offset=${f.offset} len=${f.frameLength} ${f.bitrateKbps}kbps ${f.sampleRate}Hz ${f.channels}ch acmod=${f.acmod} lfe=${f.lfeon} bsid=${f.bsid} blocks=${f.blocks} samples=${f.samplesPerFrame} duration=${f.sampleDurationMs.toFixed(3)}ms consecutive=${f.consecutiveFrames}`));
        all.push(...a.frames);
      } else if(a.codec==='MP3'&&a.frames.length){
        a.frames.slice(0,4).forEach((f,i)=>lines.push(`  MP3 frame#${i+1} offset=${f.offset} ${f.version} Layer ${f.layer} ${f.bitrateKbps}kbps ${f.sampleRate}Hz ${f.channels}ch ${f.channelMode} frameLen=${f.frameLength}`));
        all.push(...a.frames);
      } else if(a.codec!=='UNKNOWN') lines.push('  DETECTED '+a.codec+' '+JSON.stringify(a.frames[0]||{}));
      else lines.push('  DETECTED UNKNOWN');
    }
    if(all.length && (all[0].codec==='E-AC-3'||all[0].codec==='AC-3')){
      const lens=[...new Set(all.map(x=>x.frameLength))], sr=[...new Set(all.map(x=>x.sampleRate))], br=[...new Set(all.map(x=>x.bitrateKbps))], ch=[...new Set(all.map(x=>x.channels))];
      lines.push('  SUMMARY '+all[0].codec+' frameLen='+lens.join(',')+' bytes sampleRate='+sr.join(',')+'Hz bitrate='+br.join(',')+'kbps channels='+ch.join(',')+' frames='+all.length);
    }
  }
  return lines.join('\n');
}

function formatTsReport(res){
  const avDelta=(res.audio.firstPts!=null&&res.video.firstPts!=null)?(res.audio.firstPts-res.video.firstPts)/90:null;
  const raiGaps=[];for(let i=1;i<res.rai.length;i++)raiGaps.push(res.rai[i].pkt-res.rai[i-1].pkt);
  const lines=['===== TS/PCR 分析 rev'+REV+' =====',
    'bytes='+res.bytes+' packets='+res.packets+' syncLoss='+res.syncLoss+' CC_err='+res.continuity+' media_CC_err='+res.mediaContinuity+' null_CC_err='+res.nullContinuity+' discontinuity_indicator='+res.disc,
    'PMT streams: '+(res.pmt.length?res.pmt.map(s=>'pid='+s.pid+' type='+s.type+'('+s.name+')').join(', '):'(not seen)'),
    'PCR pid='+(res.pcr.pid??'-')+' count='+res.pcr.count+' first='+(res.pcr.first??'-')+' last='+(res.pcr.last??'-'),
    'VIDEO pid='+(res.video.pid??'-')+' type='+(res.video.type!=null?streamTypeName(res.video.type):'-')+' pes='+res.video.count,
    '  first PTS='+fmtPts(res.video.firstPts),'  first DTS='+fmtPts(res.video.firstDts),'  last  PTS='+fmtPts(res.video.lastPts),
    'STANDARD AUDIO pid='+(res.audio.pid??'-')+' type='+(res.audio.type!=null?streamTypeName(res.audio.type):'-')+' pes='+res.audio.count,
    '  first PTS='+fmtPts(res.audio.firstPts),'  first DTS='+fmtPts(res.audio.firstDts),'  last  PTS='+fmtPts(res.audio.lastPts),
    'PRIVATE PES AUDIO count='+res.privateAudio.length,
    'A-V start delta (audio-video) = '+(avDelta==null?'n/a':avDelta.toFixed(3)+' ms'),
    'RAI/random_access count='+res.rai.length+(res.rai.length?(' first_pkt='+res.rai[0].pkt+' intervals_pkts='+(raiGaps.slice(0,12).join(',')||'-')):''),
    '',formatAudioMicroscope(res),
    avDelta==null?'':(Math.abs(avDelta)>400?'INTERPRET: A/V PTS 起始差 >400ms，Chrome 初始化 waiting 可能涉及 A/V 对齐；需结合音频帧实际 PTS 判断。':'INTERPRET: A/V PTS 起始差较小，优先检查音频编码/MSE coded-frame。')];
  return lines.filter(Boolean).join('\n');
}

async function load(){
  state.current=null; state.active='';
  stopPlayer();
  setStatus('正在读取 M3U…');
  const ac=new AbortController();
  const t=setTimeout(()=>ac.abort(), 20000);
  try{
    const r=await fetch('/cgi-bin/iptvweb-m3u?'+Date.now(), {cache:'no-store', signal:ac.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text=await r.text();
    state.items=parseM3U(text);
    state.groups=[...new Set(state.items.map(x=>x.group))];
    if(state.items.length) state.active=state.items[0].group;
    renderGroups();
    if(!state.items.length){
      setStatus('M3U 解析到 0 个频道');
  
    }else{
      setStatus(state.items.length+' 个频道');
    }
  }catch(e){
    const msg=e.name==='AbortError'?'M3U 读取超时 20s':'M3U 读取失败: '+(e.message||e);
    setStatus(msg);
    console.error(e);

  }finally{
    clearTimeout(t);
  }
}
