const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(line,name){const re=new RegExp(name+'="([^"]*)"','i'),m=line.match(re);return m?m[1]:''}
function parseM3U(text){
  const lines=text.split(/\r?\n/),out=[]; let info=null;
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith('#EXTINF:')) info=line;
    else if(info && !line.startsWith('#')){
      out.push({
        name:info.split(',').slice(1).join(',')||attr(info,'tvg-name'),
        id:attr(info,'tvg-id'), logo:attr(info,'tvg-logo'),
        group:attr(info,'group-title')||'其他', url:line
      });
      info=null;
    }
  }
  return out;
}
function streamUrl(ch){
  try{
    const u=new URL(ch.url, location.href);
    const m=u.pathname.match(/^\/udp\/([^:]+):(\d+)$/);
    if(m){
      const proxy=new URL('/cgi-bin/iptvweb-stream', window.location.href);
      proxy.searchParams.set('group', m[1]);
      proxy.searchParams.set('port', m[2]);
      return proxy.href;
    }
  }catch(e){}
  return new URL(ch.url, window.location.href).href;
}

function audioStreamUrl(ch){
  const candidates=[];
  try{ candidates.push(String(ch&&ch.url||'')); }catch(e){}
  try{ candidates.push(String(streamUrl(ch)||'')); }catch(e){}
  for(const raw of candidates){
    if(!raw) continue;
    try{
      const u=new URL(raw, window.location.href);
      const path=u.pathname.replace(/\/+$/,'');
      let m=path.match(/\/udp\/(\d+\.\d+\.\d+\.\d+):(\d+)$/);
      if(!m) m=raw.match(/\/udp\/(\d+\.\d+\.\d+\.\d+):(\d+)(?:[\/?#]|$)/);
      if(m){
        const proxy=new URL('/cgi-bin/iptvweb-audio-pes', window.location.href);
        proxy.searchParams.set('group', m[1]); proxy.searchParams.set('port', m[2]);
        return proxy.href;
      }
    }catch(e){}
  }
  return '';
}

function probeIndependentAudio(ch, seq){
  if(!isIOSSafari() || seq!==state.seq) return;
  const url=audioStreamUrl(ch); if(!url) return;
  try{
    const u=new URL(url, window.location.href);
    const probe=new URL('/cgi-bin/iptvweb-audio-probe', window.location.href);
    probe.search=u.search;
    fetch(probe.href, {cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    }).then(text=>{
      if(seq!==state.seq) return;
      let x;
      try{x=JSON.parse(text);}catch(e){ throw new Error('probe JSON parse: '+e.message+' body='+text.slice(0,240)); }
      if(x&&x.ok){
        state.webAudioInfo=x;
        log('SAFARI_AUDIO: MPEG header pid='+x.pid+' stream_type='+x.pmt_stream_type+' '+x.version+' '+x.layer+' '+x.bitrate_kbps+'kbps '+x.sample_rate+'Hz '+x.channels+'ch frame='+x.frame_length+' hex='+x.header_hex);
      } else {
        log('SAFARI_AUDIO: MPEG header probe failed '+(x&&x.error||'unknown'));
      }
    }).catch(e=>log('SAFARI_AUDIO: MPEG header probe error '+e.message));
  }catch(e){ log('SAFARI_AUDIO: MPEG header probe exception '+e.message); }
}

function prepareSafariAudioContextFromGesture() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) {
    log('SAFARI_MP2PCM: AudioContext unavailable');
    return null;
  }

  let ctx = state.webAudioCtx;
  if (!ctx || ctx.state === 'closed') {
    ctx = new Ctx({latencyHint: 'interactive'});
    state.webAudioCtx = ctx;
  }

  state.audioCtxRate = ctx.sampleRate;

  // 必须在频道点击手势中尽早调用 resume()
  try {
    const p = ctx.resume();
    if (p && p.catch) {
      p.catch(e => log('SAFARI_MP2PCM: prepared context resume failed ' + e.message));
    }
  } catch (e) {
    log('SAFARI_MP2PCM: prepared context resume error ' + e.message);
  }

  return ctx;
}

function discardPreparedSafariAudioContext() {
  const ctx = state.webAudioCtx;
  state.webAudioCtx = null;
  state.audioCtxRate = 0;

  if (ctx && ctx.state !== 'closed') {
    try {
      const p = ctx.close();
      if (p && p.catch) p.catch(() => {});
    } catch (_) {}
  }
}

function parsePmtStreamType(value) {
  if (Number.isInteger(value)) return value;

  if (typeof value === 'string') {
    const s = value.trim();
    if (/^0x[0-9a-f]+$/i.test(s)) return parseInt(s, 16);
    if (/^\d+$/.test(s)) return Number(s);
  }
  return null;
}

async function detectSafariAudioRoute(ch, seq) {
  const audioUrl = audioStreamUrl(ch);

  if (!audioUrl) {
    return {
      kind: 'av-mse',
      streamType: null,
      reason: 'no audio URL'
    };
  }

  let probe;

  try {
    const source = new URL(audioUrl, location.href);
    probe = new URL('/cgi-bin/iptvweb-audio-probe', location.href);
    probe.search = source.search;
  } catch (e) {
    return {
      kind: 'probe-error',
      streamType: null,
      reason: 'invalid audio URL: ' + String(e && e.message || e)
    };
  }

  const maxAttempts = 2;
  let lastReason = 'unknown';

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    if (seq !== state.seq) return null;

    const startedAt = performance.now();
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 6500);

    try {
      const response = await fetch(probe.href, {
        cache: 'no-store',
        signal: controller.signal
      });

      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }

      const info = await response.json();

      if (seq !== state.seq) return null;

      log(
        'SAFARI_AUDIO_PROBE: attempt=' + attempt +
        ' elapsedMs=' + (performance.now() - startedAt).toFixed(0) +
        ' raw=' + JSON.stringify(info)
      );

      if (!info || info.ok !== true || info.pmt_found !== true) {
        throw new Error(
          info && info.error
            ? info.error
            : 'PMT probe incomplete'
        );
      }

      const streamType = parsePmtStreamType(info.pmt_stream_type);

      if (streamType === 3 || streamType === 4) {
        return {
          kind: 'mpeg-audio',
          streamType,
          hasVideo: info.has_video !== false,
          info
        };
      }

      // 保留原有策略：AAC 或已解析 PMT 中未识别的音频类型走 A/V。
      return {
        kind: 'av-mse',
        streamType,
        info
      };

    } catch (e) {
      if (seq !== state.seq) return null;

      lastReason =
        (e && e.name ? e.name + ': ' : '') +

	  // 诊断日志（保留）
	  const nowDiag=performance.now();
	  if(nowDiag-(state.audioLastDiagWall||0)>=1000){
		const dt=Math.max(0.001,(nowDiag-(state.audioLastDiagWall||nowDiag))/1000);
		const dc=state.audioChunks-(state.audioLastDiagChunks||0);
		const ds=state.audioDecodedSamples-(state.audioLastDiagSamples||0);
		log('SAFARI_MP2PCM: PCMSTAT chunks='+state.audioChunks+' dChunks='+dc+' samples='+state.audioDecodedSamples+' dSamples='+ds+' rate='+rate+' ctx='+ctxRate+' queue='+state.audioQueuedSeconds.toFixed(3)+'s decodeCalls='+state.audioDecodeCalls+' empty='+state.audioDecodeEmpty+' errors='+state.audioDecodeErrors+' wallSamplesPerSec='+(ds/dt).toFixed(0));
		state.audioLastDiagWall=nowDiag; state.audioLastDiagChunks=state.audioChunks; state.audioLastDiagSamples=state.audioDecodedSamples;
	  }
	}
    try{ reader.releaseLock(); }catch(e){}
    state.audioReader=null;
    if(state.audioStreamDone) log('SAFARI_MP2PCM: stream ended');
  }catch(e){
    if(seq!==state.seq || e.name==='AbortError') return;
    state.webAudioState='decode-error'; state.webAudioError=e.name+': '+e.message; state.audioError='WebAudioMP2PCMError';
    log('SAFARI_MP2PCM: '+e.name+': '+e.message); 
  }
}

function startAudioWorkletClock(seq){
  if(seq!==state.seq || !state.webAudioCtx || state.audioStarted) return;
  if(state.webAudioBackend==='worklet' && !state.webAudioWorkletNode) return;
  if(state.webAudioBackend!=='worklet' && state.webAudioBackend!=='scriptprocessor' && state.webAudioBackend!=='buffersource') return;
  const v=$('video');
  if(!state.safariAudioOnly && !state.firstFrameAt && !state.firstPlayingAt) return;
  state.audioVideoAnchor=Number(v.currentTime||0);
  const startAt=state.webAudioCtx.currentTime+state.audioStartDelay;
  state.audioStartContextTime=startAt;
  state.audioStarted=true; state.audioPlaying=false; state.audioPendingStart=false;
  state.audioStartedAt=performance.now()+state.audioStartDelay*1000;
  if(state.webAudioBackend==='worklet' && state.webAudioWorkletNode){
    state.webAudioWorkletNode.port.postMessage({type:'start',startAt});
  }else if(state.webAudioBackend==='buffersource'){
    state.audioScheduleCursor=startAt;
    state.audioScheduleStarted=true;
    scheduleBufferSourceQueue(seq);
  }
  log('SAFARI_MP2PCM: audio anchor video='+state.audioVideoAnchor.toFixed(3)+' startDelay='+state.audioStartDelay.toFixed(2)+'s backend='+state.webAudioBackend);
}

function scheduleBufferSourceQueue(seq){
  if(seq!==state.seq || !state.webAudioCtx || state.webAudioBackend!=='buffersource' || !state.audioScheduleStarted) return;
  const ctx=state.webAudioCtx;
  const now=ctx.currentTime;
  if(state.audioScheduleCursor < now+0.02) state.audioScheduleCursor=now+0.02;
  while(state.audioScheduleQueue.length){
    const q=state.audioScheduleQueue.shift();
    const frames=q.samples|0;
    if(!frames) continue;
    const ab=ctx.createBuffer(2,frames,ctx.sampleRate);
    const left=new Float32Array(frames), right=new Float32Array(frames);
    for(let i=0;i<frames;i++){
      const l=q.pcm[i*2]||0;
      left[i]=l; right[i]=q.pcm[i*2+1]||l;
    }
    ab.copyToChannel(left,0); ab.copyToChannel(right,1);
    const src=ctx.createBufferSource();
    src.buffer=ab; src.connect(ctx.destination);
    const at=Math.max(state.audioScheduleCursor,ctx.currentTime+0.01);
    try{ src.start(at); }catch(e){ state.audioDecodeErrors++; try{src.disconnect();}catch(_){}; continue; }
    state.audioScheduledSources.push(src);
    src.onended=()=>{ try{src.disconnect();}catch(_){}; const i=state.audioScheduledSources.indexOf(src); if(i>=0) state.audioScheduledSources.splice(i,1); };
    state.audioScheduleCursor=at+frames/ctx.sampleRate;
    state.audioSchedulePendingSamples=Math.max(0,state.audioSchedulePendingSamples-frames);
  }
  state.audioQueuedSeconds=Math.max(0,state.audioScheduleCursor-ctx.currentTime);
  state.audioRingSeconds=state.audioQueuedSeconds;
}

function schedulePcmQueue(seq){
  startAudioWorkletClock(seq);
}

function audioSyncTick(seq){
  if(seq!==state.seq || !state.webAudioCtx || !state.audioStarted) return;
  const ctx=state.webAudioCtx, v=$('video');
  const now=ctx.currentTime;
  const audioPos=Math.max(0,now-state.audioStartContextTime);
  const videoPos=Math.max(0,(Number(v.currentTime||0)-state.audioVideoAnchor));
  const drift=audioPos-videoPos;
  state.audioPlayedEstimate=audioPos; state.audioSyncDrift=drift;
  // The Worklet owns the real audio clock. Do not repeatedly flush the ring
  // buffer for ordinary network jitter; only re-anchor after a large error.
  const sinceReset=state.audioLastResetAt ? (performance.now()-state.audioLastResetAt)/1000 : 999;
  if(Math.abs(drift)>0.80 && sinceReset>=5){
    log('SAFARI_AVSYNC: drift='+drift.toFixed(3)+'s video='+videoPos.toFixed(3)+' audio='+audioPos.toFixed(3)+' ring='+state.audioRingSeconds.toFixed(3)+'s');
    resetAudioSchedule(seq,'drift');
  }
  
}

function resetAudioSchedule(seq,reason){
  if(seq!==state.seq || !state.webAudioCtx) return;
  const ctx=state.webAudioCtx;
  state.audioVideoAnchor=Number($('video').currentTime||0);
  const startAt=ctx.currentTime+0.10;
  state.audioStartContextTime=startAt;
  state.audioLastResetAt=performance.now();
  state.audioSyncResets++;
  if(state.webAudioBackend==='worklet' && state.webAudioWorkletNode){
    state.webAudioWorkletNode.port.postMessage({type:'reset',startAt});
  }else if(state.webAudioBackend==='scriptprocessor'){
    state.audioPcmQueue=[]; state.audioPcmOffset=0; state.audioQueuedSeconds=0; state.audioRingSeconds=0;
  }else if(state.webAudioBackend==='buffersource'){
    for(const src of state.audioScheduledSources||[]){ try{src.stop();}catch(_){} try{src.disconnect();}catch(_){} }
    state.audioScheduledSources=[]; state.audioScheduleQueue=[]; state.audioSchedulePendingSamples=0;
    state.audioScheduleCursor=ctx.currentTime+0.10; state.audioQueuedSeconds=0; state.audioRingSeconds=0; state.audioScheduleStarted=true;
  }
  if(reason) log('SAFARI_AVSYNC: '+state.webAudioBackend+' re-anchor reason='+reason+' reset#='+state.audioSyncResets);
}

function parseXmltvTimestamp(value){
  const m=String(value||'').trim().match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})(?:\s*([+-])(\d{2}):?(\d{2}))?/);
  if(!m)return NaN;
  const utc=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
  const sign=m[7]==='-'?-1:1,offset=m[7]?(+m[8]*60 + +m[9]):480;
  return utc-sign*offset*60000;
}

function shiftEpgDate(date,days){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);}

}

async function loadEpg(force){
  const status=$('epgStatus');
  if(status)status.textContent='正在获取 XMLTV…';
  try{
    const url='/cgi-bin/iptvweb-epg'+(force?'?refresh=1':'?'+Date.now());
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const xml=await response.text();
    const doc=new DOMParser().parseFromString(xml,'application/xml');
    if(doc.getElementsByTagName('parsererror').length)throw new Error('XMLTV XML 解析失败');
    const byId=Object.create(null),nodes=doc.getElementsByTagName('programme');
    let validCount=0,invalidCount=0,minStart=Infinity,maxStop=-Infinity;
    for(let i=0;i<nodes.length;i++){
      const node=nodes[i],id=node.getAttribute('channel');
      if(!id){invalidCount++;continue;}
      const start=parseXmltvTimestamp(node.getAttribute('start')),stop=parseXmltvTimestamp(node.getAttribute('stop'));
      if(!Number.isFinite(start)||!Number.isFinite(stop)||stop<=start){invalidCount++;continue;}
      validCount++;minStart=Math.min(minStart,start);maxStop=Math.max(maxStop,stop);
      const titleNode=node.getElementsByTagName('title')[0],descNode=node.getElementsByTagName('desc')[0];
      (byId[id]||(byId[id]=[])).push({start,stop,title:titleNode?(titleNode.textContent||'').trim():'',desc:descNode?(descNode.textContent||'').trim():''});
    }
    Object.keys(byId).forEach(id=>byId[id].sort((a,b)=>a.start-b.start));
    if(!Object.keys(byId).length)throw new Error('XMLTV 中没有有效 programme 记录');
    state.epgById=byId;
    state.epgStats={raw:nodes.length,valid:validCount,invalid:invalidCount,minDate:Number.isFinite(minStart)?bjInput(minStart).date:'',maxDate:Number.isFinite(maxStop)?bjInput(maxStop-1).date:''};
    state.epgLoaded=true;state.epgUpdatedAt=Date.now();
    if(status)status.textContent='已加载 '+nodes.length+' 条节目记录';
    renderGroups();renderEpgPanel(state.current);
    if(!state.epgTimer)state.epgTimer=setInterval(()=>{renderGroups();renderEpgPanel(state.current);},60000);
  }catch(e){
    if(!state.epgLoaded)state.epgLoaded=false;
    if(status)status.textContent='获取失败：'+(e.message||e);
    renderGroups();renderEpgPanel(state.current);
    console.error('IPTV EPG:',e);
  }
}

function bufferAhead(v){
  try{
    if(!v.buffered || !v.buffered.length) return 0;

    const t = v.currentTime;
    for(let i = 0; i < v.buffered.length; i++){
      const s = v.buffered.start(i);
      const e = v.buffered.end(i);
      if(t >= s - 0.05 && t <= e + 0.05){
        return Math.max(0, e - t);
      }
    }

    // 启动时 currentTime=0，但首个缓冲区间从一个小的正时间开始。
    // 这是启动缓冲长度的估算，不表示 currentTime 到缓冲区之间连续可播。
    if(t <= 0.05){
      const s = v.buffered.start(0);
      const e = v.buffered.end(0);
      if(s >= 0 && s <= 0.5 && e >= s){
        return Math.max(0, e - s);
      }
    }

    return 0;
  }catch(e){
    return 0;
  }
}

    }

    return out.slice(0, w);
  }

  function skipScalingList(reader, size) {
    let lastScale = 8, nextScale = 8;
    for (let j = 0; j < size; j++) {
      if (nextScale !== 0) {
        const deltaScale = reader.readSEG();
        nextScale = (lastScale + deltaScale + 256) % 256;
      }
      lastScale = (nextScale === 0) ? lastScale : nextScale;
    }
  }

  const H264_HIGH_PROFILES = [100,110,122,244,44,83,86,118,128,138,139,134,135];

  function parseSPS(spsNalWithHeader) {
    const rbsp = removeEmulationPrevention(spsNalWithHeader.subarray(1));
    const r = new BitReader(rbsp);
    const profileIdc = r.readBits(8);
    r.readBits(8); r.readBits(8);
    r.readUEG();
    let chromaFormatIdc = 1, separateColourPlane = false;
    if (H264_HIGH_PROFILES.indexOf(profileIdc) !== -1) {
      chromaFormatIdc = r.readUEG();
      if (chromaFormatIdc === 3) separateColourPlane = !!r.readBit();
      r.readUEG(); r.readUEG(); r.readBit();
      if (r.readBit()) {
        const count = (chromaFormatIdc !== 3) ? 8 : 12;
        for (let i = 0; i < count; i++) if (r.readBit()) skipScalingList(r, i < 6 ? 16 : 64);
      }
    }
    const frameNumBits = r.readUEG() + 4;
    const picOrderCntType = r.readUEG();
    if (picOrderCntType === 0) {
      r.readUEG();
    } else if (picOrderCntType === 1) {
      r.readBit(); r.readSEG(); r.readSEG();
      const numRef = r.readUEG();
      for (let i = 0; i < numRef; i++) r.readSEG();
    }
    r.readUEG(); r.readBit(); r.readUEG(); r.readUEG();
    const frameMbsOnly = !!r.readBit();
    return { profileIdc, chromaFormatIdc, separateColourPlane, frameNumBits, frameMbsOnly };
  }

  function isISliceNal(buf, nal) {
    const type = buf[nal.start] & 0x1f;
    if (type !== 1 && type !== 5) return false;
    try {
      const prefix = removeEmulationPrevention(buf.subarray(nal.start + 1, Math.min(nal.start + 17, nal.end)));
      const r = new BitReader(prefix);
      r.readUEG();
      const sliceType = r.readUEG();
      return (sliceType % 5) === 2;
    } catch (e) { return false; }
  }

  function rewriteSliceToIDR(nal, sps) {
    if (!nal || nal.length < 2) {
      throw new Error('invalid slice NAL');
    }

    /*
     * scanAnnexBNals() 可能把 Annex-B 的 trailing_zero_8bits
     * 包含在 nal 的末尾。
     *
     * 这些尾部 00 不属于 slice 的核心 EBSP/RBSP，不能参与
     * remove/addEmulationPrevention，否则大量连续 00 会导致
     * 插入大量 03，使 NAL 异常膨胀。
     */
    let coreEnd = nal.length;

    while (
      coreEnd > 1 &&
      nal[coreEnd - 1] === 0x00
    ) {
      coreEnd--;
    }

    const trailingZeroBytes = nal.length - coreEnd;

    if (coreEnd < 2) {
      throw new Error(
        'invalid slice NAL core: nalBytes=' + nal.length +
        ', trailingZeros=' + trailingZeroBytes
      );
    }

    /*
     * 不包含：
     *   - NAL header（nal[0]）
     *   - NAL 末尾的 trailing_zero_8bits
     */
    const rbsp = removeEmulationPrevention(
      nal.subarray(1, coreEnd)
    );

    if (!rbsp.length) {
      throw new Error('empty slice RBSP');
    }

    const r = new BitReader(rbsp);

    const firstMb = r.readUEG();
    const sliceType = r.readUEG();
    const ppsId = r.readUEG();

    let colourPlaneId = 0;

    if (sps.separateColourPlane) {
      colourPlaneId = r.readBits(2);
    }

    // 丢弃原 non-IDR slice 的 frame_num。
    r.readBits(sps.frameNumBits);

    /*
     * CCTV3 的 SPS 日志显示 frameMbsOnly=false，
     * 所以必须先读取并保留 field_pic_flag /
     * bottom_field_flag，然后才能插入 idr_pic_id。
     */
    let fieldPicFlag = 0;
    let bottomFieldFlag = 0;

    if (!sps.frameMbsOnly) {
      fieldPicFlag = r.readBit();

      if (fieldPicFlag) {
        bottomFieldFlag = r.readBit();
      }
    }

    const w = new BitWriter();

    w.writeUEG(firstMb);
    w.writeUEG(sliceType);
    w.writeUEG(ppsId);

    if (sps.separateColourPlane) {
      w.writeBits(colourPlaneId, 2);
    }

    // 合成 IDR 的 frame_num 设置为 0。
    w.writeBits(0, sps.frameNumBits);

    if (!sps.frameMbsOnly) {
      w.writeBit(fieldPicFlag);

      if (fieldPicFlag) {
        w.writeBit(bottomFieldFlag);
      }
    }

    /*
     * IDR slice_header 比 non-IDR 多出 idr_pic_id。
     * 这里使用 0。
     */
    w.writeUEG(0);

    /*
     * 将剩余的原始 RBSP bit 原样复制。
     * 注意：这里只复制核心 RBSP，不包含已经剥离的尾部零字节。
     */
    const totalBits = rbsp.length * 8;

    while (r.pos < totalBits) {
      w.writeBit(r.readBit());
    }

    const newRbsp = addEmulationPrevention(
      w.toBytes()
    );

    /*
     * 输出结构：
     *
     *   新 NAL header
     *   + 新核心 EBSP
     *   + 原样保留的 trailing_zero_8bits
     */
    const out = new Uint8Array(
      1 + newRbsp.length + trailingZeroBytes
    );

    let nalRefIdc = nal[0] & 0x60;

    // IDR slice 的 nal_ref_idc 不能为 0。
    if (nalRefIdc === 0) {
      nalRefIdc = 0x60;
    }

    // 保留 forbidden_zero_bit，NAL type 改为 5。
    out[0] =
      (nal[0] & 0x80) |
      nalRefIdc |
      0x05;

    out.set(newRbsp, 1);

    // 尾部零字节原样接回，不重新进行防竞争处理。
    if (trailingZeroBytes > 0) {
      out.set(
        nal.subarray(coreEnd),
        1 + newRbsp.length
      );
    }

    /*
     * I→IDR 会因为新增 idr_pic_id、字节对齐和防竞争字节而
     * 产生少量长度变化，但不应增加几十、几百甚至几千字节。
     */
    const delta = out.length - nal.length;

    if (Math.abs(delta) > 64) {
      throw new Error(
        'suspicious NAL growth while converting I to IDR: ' +
        nal.length + 'B→' + out.length + 'B' +
        ', coreBytes=' + coreEnd +
        ', trailingZeros=' + trailingZeroBytes +
        ', frameNumBits=' + sps.frameNumBits
      );
    }

    return out;
  }

  function scanAnnexBNals(buf, from) {
    const starts = [];
    let i = from; const n = buf.length;
    while (i < n - 2) {
      if (buf[i] === 0 && buf[i+1] === 0 && buf[i+2] === 1) {
        let scStart = i;
        if (i > from && buf[i-1] === 0) scStart = i - 1;
        starts.push({ scStart, dataStart: i + 3 });
        i += 3;
      } else i++;
    }
    const nals = [];
    for (let k = 0; k < starts.length; k++) {
      const cur = starts[k];
      const nextScStart = (k + 1 < starts.length) ? starts[k+1].scStart : n;
      nals.push({ scStart: cur.scStart, start: cur.dataStart, end: nextScStart,
        scBytes: buf.subarray(cur.scStart, cur.dataStart) });
    }
    return nals;
  }

  function parsePesHeader(pes) {
    if (pes.length < 9) return null;
    if (!(pes[0] === 0 && pes[1] === 0 && pes[2] === 1)) return null;
    const pesPacketLength = (pes[4] << 8) | pes[5];
    const pesHeaderDataLength = pes[8];
    const esStart = 9 + pesHeaderDataLength;
    if (esStart > pes.length) return null;
    return { pesPacketLength, esStart };
  }

  function extractTSPayload(pkt) {
    const afc = (pkt[3] >> 4) & 0x3;
    let offset = 4;
    if (afc === 2) return null;
    if (afc === 3) offset = 5 + pkt[4];
    else if (afc !== 1) return null;
    if (offset >= 188) return null;
    return pkt.subarray(offset, 188);
  }

  function rebuildFirstPacket(originalPkt, newPayload) {
    const afc0 = (originalPkt[3] >> 4) & 0x3;
    const payloadOffset = (afc0 === 3) ? (5 + originalPkt[4]) : 4;
    const capacity = 188 - payloadOffset;

    if (newPayload.length >= capacity) {
      const out = new Uint8Array(188);
      out.set(originalPkt.subarray(0, payloadOffset), 0);
      out.set(newPayload.subarray(0, capacity), payloadOffset);
      return { packet: out, consumed: capacity };
    }
    const out = new Uint8Array(188);
    out[0] = 0x47; out[1] = originalPkt[1]; out[2] = originalPkt[2];
    const avail = newPayload.length;
    if (afc0 === 3) {
      const origAfLen = originalPkt[4];
      const shortfall = capacity - avail;
      const newAfLen = origAfLen + shortfall;
      out[3] = originalPkt[3];
      out[4] = newAfLen;
      out.set(originalPkt.subarray(5, 5 + origAfLen), 5);
      for (let i = 0; i < shortfall; i++) out[5 + origAfLen + i] = 0xFF;
      out.set(newPayload, 5 + newAfLen);
    } else {
      out[3] = (originalPkt[3] & 0x0f) | 0x30;
      const afLen = 183 - avail;
      out[4] = afLen;
      if (afLen > 0) { out[5] = 0x00; for (let i = 0; i < afLen - 1; i++) out[6 + i] = 0xFF; }
      out.set(newPayload, 5 + afLen);
    }
    return { packet: out, consumed: avail };
  }

  function buildSubsequentPacket(pid, payload, offset) {
    const out = new Uint8Array(188);
    out[0] = 0x47; out[1] = (pid >> 8) & 0x1f; out[2] = pid & 0xff;
    const remaining = payload.length - offset;
    if (remaining >= 184) {
      out[3] = 0x10;
      out.set(payload.subarray(offset, offset + 184), 4);
      return { packet: out, consumed: 184 };
    }
    const L = 183 - remaining;
    out[3] = 0x30; out[4] = L;
    if (L > 0) { out[5] = 0x00; for (let i = 0; i < L - 1; i++) out[6 + i] = 0xFF; }
    out.set(payload.subarray(offset, offset + remaining), 5 + L);
    return { packet: out, consumed: remaining };
  }

  class PesAssembler {
    constructor() { this.packets = []; this.started = false; }
    push(pkt, pusi) {
      let completed = null;
      if (pusi) {
        if (this.started && this.packets.length) completed = this._finish();
        this.started = true;
        this.packets = [pkt];
      } else if (this.started) {
        this.packets.push(pkt);
      }
      return completed;
    }
    flush() {
      if (this.started && this.packets.length) {
        const r = this._finish();
        this.packets = []; this.started = false;
        return r;
      }
      return null;
    }
    _finish() {
      const pkts = this.packets;
      const parts = []; let total = 0;
      for (const p of pkts) {
        const pl = extractTSPayload(p);
        if (pl) { parts.push(pl); total += pl.length; }
      }
      const pesBytes = new Uint8Array(total);
      let off = 0;
      for (const p of parts) { pesBytes.set(p, off); off += p.length; }
      return { packets: pkts, pesBytes };
    }
  }

  function readOpenGopPesPts90k(pesBytes) {
    if (!pesBytes || pesBytes.length < 14) {
      return null;
    }

    if (
      pesBytes[0] !== 0x00 ||
      pesBytes[1] !== 0x00 ||
      pesBytes[2] !== 0x01
    ) {
      return null;
    }

    const ptsDtsFlags = (pesBytes[7] >> 6) & 0x03;

    // 10 = 只有 PTS；11 = PTS + DTS。
    if (ptsDtsFlags !== 2 && ptsDtsFlags !== 3) {
      return null;
    }

    const p0 = pesBytes[9];
    const p1 = pesBytes[10];
    const p2 = pesBytes[11];
    const p3 = pesBytes[12];
    const p4 = pesBytes[13];

    // 使用乘法而不是 32 位移位，因为 PTS 是 33 位。
    return (
      ((p0 >>> 1) & 0x07) * 1073741824 + // 2^30
      p1 * 4194304 +                     // 2^22
      ((p2 >>> 1) & 0x7f) * 32768 +      // 2^15
      p3 * 128 +                         // 2^7
      ((p4 >>> 1) & 0x7f)
    );
  }

  function openGopPtsDelta90k(value, anchor) {
    const MOD = 8589934592; // 2^33
    const HALF = 4294967296;

    let delta = value - anchor;

    if (delta > HALF) {
      delta -= MOD;
    } else if (delta < -HALF) {
      delta += MOD;
    }

    return delta;
  }

  class OpenGopFixer {
    constructor(pid, logFn, opts) {
      this.pid = pid;
      this.log = logFn || (() => {});
      this.dryRun = !!(opts && opts.dryRun);
      this.assembler = new PesAssembler();
      this.lastSpsParams = null;
	  this.spsSignature = null;
      this.outCc = 0;
      this.ccInited = false;
      //this.stats = { rewritten: 0, wouldRewrite: 0, passthrough: 0, failed: 0 };
	  this.stats = { rewritten: 0, wouldRewrite: 0, passthrough: 0, failed: 0, droppedLeading: 0 };
	  
      // ★ 新增：只启动一次的状态
      this.bootstrapped = false;         // 是否已经做过唯一一次 I→IDR 转换
      this.frameNumOffset = 0;           // 永久生效的 frame_num 常量偏移	  
	  this.onBootstrap = (opts && opts.onBootstrap) || null;   // 新增
	  // 启动用合成 IDR 的 PTS。
  	  this.bootstrapPts90k = null;

	  // 在启动阶段删除 PTS 早于 bootstrap I 图像的 Open-GOP leading pictures。
	  this.leadingDropActive = false;
	  this.leadingDropCount = 0;
    }

    feed(pkt) {
      const pusi = !!(pkt[1] & 0x40);
      const completed = this.assembler.push(pkt, pusi);
      if (!completed) return [];
      return this._emit(completed);
    }

    flush() {
      const completed = this.assembler.flush();
      return completed ? this._emit(completed) : [];
    }

	_emit({ packets, pesBytes }) {
	  let outPackets = packets;

	  try {
		const anyTei = packets.some(
		  p => (p[1] & 0x80) !== 0
		);

		if (anyTei) {
		  this.stats.passthrough++;
		} else if (this._shouldDropLeadingPes(pesBytes)) {
		  /*
		   * 整个 leading picture PES 不输出。
		   *
		   * 这里必须直接返回 []，不能调用 _restampCc()。
		   * 因为没有 TS 包实际输出，输出 CC 也不应前进。
		   * 下一个正常 PES 会继续使用当前 outCc，因此不会制造 CC GAP。
		   */
		  this.stats.droppedLeading++;
		  return [];
		} else {
		  const rewritten = this._maybeRewrite(pesBytes);

		  if (!rewritten) {
			this.stats.passthrough++;
		  } else if (this.dryRun) {
			this.stats.wouldRewrite++;

			this.log(
			  '[DRYRUN] PID=' + this.pid +
			  ' would rewrite, ' +
			  pesBytes.length + 'B→' +
			  rewritten.length + 'B'
			);
		  } else {
			outPackets = this._repacketize(
			  packets,
			  rewritten
			);

			this.stats.rewritten++;

			this.log(
			  'PID=' + this.pid +
			  ' rewritten ' +
			  pesBytes.length + 'B→' +
			  rewritten.length + 'B, packets ' +
			  packets.length + '→' +
			  outPackets.length
			);
		  }
		}
	  } catch (e) {
		this.stats.failed++;

		this.log(
		  'PID=' + this.pid +
		  ' rewrite failed (' +
		  (e && e.message) +
		  '), passthrough original'
		);

		outPackets = packets;
	  }

	  return this._restampCc(outPackets);
	}

    _restampCc(packets) {
      const out = [];
      for (const p of packets) {
        const afc = (p[3] >> 4) & 0x3;
        const q = new Uint8Array(p);
        if (afc === 1 || afc === 3) {
          if (!this.ccInited) { this.outCc = p[3] & 0xf; this.ccInited = true; }
          q[3] = (q[3] & 0xf0) | (this.outCc & 0xf);
          this.outCc = (this.outCc + 1) & 0xf;
        }
        out.push(q);
      }
      return out;
    }

	_shouldDropLeadingPes(pesBytes) {
	  if (
		!this.leadingDropActive ||
		this.bootstrapPts90k == null
	  ) {
		return false;
	  }

	  const pts = readOpenGopPesPts90k(pesBytes);

	  if (pts == null) {
		return false;
	  }

	  const delta90k = openGopPtsDelta90k(
		pts,
		this.bootstrapPts90k
	  );

	  const deltaMs = delta90k / 90;

	  /*
	   * bootstrap 之后按解码顺序到达、但 PTS 早于 bootstrap
	   * I 图像的帧，就是 Open GOP 的 leading pictures。
	   *
	   * 限定在 bootstrap 前一秒内，避免遇到真正的 PTS
	   * discontinuity 时误删。
	   */
	  if (delta90k < 0 && delta90k >= -90000) {
		this.leadingDropCount++;

		this.log(
		  'PID=' + this.pid +
		  ' DROP leading picture' +
		  ' PTS90k=' + pts +
		  ' bootstrapPTS90k=' + this.bootstrapPts90k +
		  ' deltaMs=' + deltaMs.toFixed(3) +
		  ' count=' + this.leadingDropCount
		);

		return true;
	  }

	  /*
	   * 已经超过 bootstrap 一秒，正常 GOP 已经稳定，
	   * 关闭启动专用的判断，避免永久保留状态。
	   */
	  if (delta90k >= 90000) {
		this.leadingDropActive = false;

		this.log(
		  'PID=' + this.pid +
		  ' leading-picture drop window closed' +
		  ' dropped=' + this.leadingDropCount
		);
	  } else if (delta90k < -90000) {
		// 更大的负跳变更可能是真正的时间戳 discontinuity。
		this.leadingDropActive = false;

		this.log(
		  'PID=' + this.pid +
		  ' leading-picture drop window cancelled' +
		  ' because of large negative PTS deltaMs=' +
		  deltaMs.toFixed(3)
		);
	  }

	  return false;
	}
	
    // ★ 核心重写：只在"首次启动"时做一次 I→IDR 转换；之后永远只做 frame_num 平移
    _maybeRewrite(pesBytes) {
      const pes = parsePesHeader(pesBytes);
      if (!pes) return null;
      const nals = scanAnnexBNals(pesBytes, pes.esStart);
      if (!nals.length) return null;

      let hasRealIdr = false, spsNal = null;
      const sliceNals = []; // 所有 NAL type===1（I/P/B slice 都在这里）
      for (const n of nals) {
        const type = pesBytes[n.start] & 0x1f;
        if (type === 5) hasRealIdr = true;
        else if (type === 7) spsNal = n;
        else if (type === 1) sliceNals.push(n);
      }

      if (spsNal) {
        try {
          const parsed = parseSPS(pesBytes.subarray(spsNal.start, spsNal.end));
          const sig = parsed.frameNumBits + ':' + parsed.separateColourPlane + ':' + parsed.frameMbsOnly;
  		  if (sig !== this.spsSignature) {
		    this.spsSignature = sig;
		    this.bootstrapped = false;
		    this.frameNumOffset = 0;

		    this.bootstrapPts90k = null;
		    this.leadingDropActive = false;
		    this.leadingDropCount = 0;

		    this.log(
			  'PID=' + this.pid +
			  ' SPS changed, re-arm bootstrap'
		    );
		  }
          this.lastSpsParams = parsed;
        } catch (e) {
          this.log('PID=' + this.pid + ' SPS parse failed: ' + e.message);
        }
      }

      // 上游如果真的来了一个原生 IDR，说明不再需要我们的 hack，复位状态
  	  if (hasRealIdr) {
	    if (!this.bootstrapped) {
		  this.log('PID=' + this.pid + ' real IDR encountered before any bootstrap, using it as anchor (offset=0)');
	    } else if (this.frameNumOffset !== 0) {
		  this.log('PID=' + this.pid + ' real IDR superseded synthetic anchor, resetting offset to 0 (no further fake-IDR will be created)');
	    }
	    // 关键修正：无论之前是否做过合成 IDR 转换，一旦遇到真实 IDR，
	    // 就把它当作新的、干净的锚点，永久标记为“已启动”，
	    // 绝不允许因为“遇到了真实 IDR”而重新把 bootstrapped 置为 false。
	    this.bootstrapped = true;
	    this.frameNumOffset = 0;
		
		this.bootstrapPts90k = null;
		this.leadingDropActive = false;
		this.leadingDropCount = 0;
	    return null;
	  }
	  
      if (!sliceNals.length) return null;
      if (!this.lastSpsParams) return null;

	  if (!this.bootstrapped) {
	    /*
	     * 寻找这个 bootstrap PES 中的全部 I slice。
	     *
	     * 原逻辑只将第一个 I slice 改成 IDR，其余 I slice 仅修改
	     * frame_num，可能造成同一幅多 slice 图像中：
	     *
	     *   第一个 slice：NAL type 5（IDR）
	     *   其余 slice：  NAL type 1（non-IDR）
	     *
	     * 现在改为将该 bootstrap 图像中的全部 I slice 都转换为 IDR。
	     */
	    const bootstrapISlices = [];

	    for (const n of sliceNals) {
		  if (isISliceNal(pesBytes, n)) {
		    bootstrapISlices.push(n);
		  }
	    }

	    if (!bootstrapISlices.length) {
		  // 当前 PES 没有 I slice，继续等待可用于启动的图像。
		  // 此时上游视频 gate 尚未正式输出视频，因此直接返回即可。
		  return null;
	    }

	    // 使用第一个 I slice 读取原始 frame_num。
	    const firstISliceNal = bootstrapISlices[0];

	    // Set 中保存的是 scanAnnexBNals() 返回的同一批 NAL 对象，
	    // 因此可以直接通过对象身份判断该 NAL 是否属于 bootstrap I slice。
	    const bootstrapISet = new Set(bootstrapISlices);

	    let originalFn;

	    try {
		  const tmpRbsp = removeEmulationPrevention(
		    pesBytes.subarray(
			  firstISliceNal.start + 1,
			  firstISliceNal.end
		    )
		  );

		const mask = 1 << bitInByte;

		  buf[byteIndex] |= mask;

		coreNal.subarray(1)

	  r.readUEG(); // slice_type
	  r.readUEG(); // pic_parameter_set_id

	  if (this.lastSpsParams.separateColourPlane) {
		r.readBits(2); // colour_plane_id
	  }

	  const fnBits = this.lastSpsParams.frameNumBits;
	  const frameNumBitOffset = r.pos;

	  if (
		frameNumBitOffset < 0 ||
		frameNumBitOffset + fnBits > rbsp.length * 8
	  ) {
		throw new Error(
		  'frame_num is outside slice RBSP: offset=' +
		  frameNumBitOffset +
		  ', bits=' + fnBits +
		  ', rbspBytes=' + rbsp.length

	  const out = new Uint8Array(
		1 + newEbsp.length + trailingZeroBytes

	  if (trailingZeroBytes > 0) {

		  originalNal.subarray(coreEnd),
		  1 + newEbsp.length
		);
	  }

		out.length - originalNal.length;

	  if (Math.abs(delta) > 64) {
		throw new Error(
		  'suspicious NAL growth after excluding trailing zeros: ' +
		  originalNal.length + 'B→' + out.length + 'B' +
		  ', coreBytes=' + coreEnd +
		  ', trailingZeros=' + trailingZeroBytes +
		  ', origFn=' + origFn +
		  ', newFn=' + newFn +
		  ', fnBits=' + fnBits
		);
	  }

	  const b3 = pl[offset + 3];

		((b0 >> 4) & 0x0f) !== prefix ||

		(b2 & 1) === 0 ||
		(b4 & 1) === 0

		pl[0] !== 0x00 || pl[1] !== 0x00 || pl[2] !== 0x01 ||

    _trackStartupPts(data) {

		  i + 4 < all.length &&

		  all[i + 2] === 0 && all[i + 3] === 1

        const keep=(st===0x01 || st===0x02 || st===0x10 || st===0x1b || st===0x20 || st===0x24 || st===0x42 || st===0xd1 || st===0xd4 || st===0xea || st===0x1f);
        //if(keep){ es.push(section.slice(i,i+5+eil)); this._videoPids.add(ep); if(this._videoPid==null) this._videoPid=ep; }
		if(keep){ es.push(section.slice(i,i+5+eil)); this._videoPids.add(ep); this._videoStreamTypeByPid.set(ep, st); if(this._videoPid==null) this._videoPid=ep; }
        i+=5+eil;
      }
      if(!this._loggedPmt){
        this._loggedPmt=true;
        log('SAFARI_TS_FILTER: PMT version='+((section[5]>>1)&0x1f)+' PCR PID='+pcr+' videoStreams='+es.map(e=>'0x'+e[0].toString(16)+':'+(((e[1]&0x1f)<<8)|e[2])).join(','));
      }
      if(this._videoPid==null || !es.length) return pkt;
      const body=section.slice(0,12+pil);
      const newSection=new Uint8Array(12+pil+es.reduce((n,a)=>n+a.length,0)+4);
      newSection.set(body,0); let o=body.length; for(const e of es){newSection.set(e,o);o+=e.length;}
      const newLen=newSection.length-3;
      newSection[1]=(newSection[1]&0xf0)|((newLen>>8)&0x0f); newSection[2]=newLen&0xff;
      const crc=this._crc32(newSection.slice(0,newSection.length-4));
      newSection[newSection.length-4]=(crc>>>24)&255; newSection[newSection.length-3]=(crc>>>16)&255;
      newSection[newSection.length-2]=(crc>>>8)&255; newSection[newSection.length-1]=crc&255;
      // Repack a one-packet PMT. Preserve continuity counter and adaptation field.
      const np=pkt.slice(); const afc=(np[3]>>4)&3; let po=4;
      if(afc===3){po=5+(np[4]||0);} else if(afc!==1) return pkt;
      const avail=188-po; const payload=new Uint8Array(avail); payload.fill(0xff); payload[0]=0; payload.set(newSection,1);
      np.set(payload,po); this._sectionVideoLogged=true;
      if(!this._loggedFilter){ this._loggedFilter=true; setTimeout(()=>log('SAFARI_TS_FILTER: PMT rewritten; video PID='+this._videoPid+' PCR PID='+this._pcrPid+' audio ES removed'),0); }
      return np;
    }
    _crc32(data){
      let crc=0xffffffff;
      for(let i=0;i<data.length;i++){
        crc^=data[i]<<24;
        for(let b=0;b<8;b++) crc=(crc&0x80000000)?((crc<<1)^0x04c11db7)>>>0:(crc<<1)>>>0;
      }
      return crc>>>0;
    }
  }

}

function startCCTV16VideoOnlyDiagnostic(videoEl, url) {
  const dataSource = {
    type: 'mpegts',
    url,
    isLive: true,
    hasVideo: true,
    hasAudio: false
  };

  const config = {
    // 仅用于诊断：先关闭 worker，减少自定义 loader 调试变量。
    enableWorker: false,
    enableWorkerForMSE: false,

    enableStashBuffer: true,
    stashInitialSize: 393216,
    lazyLoad: true,
    deferLoadAfterSourceOpen: true,
    autoCleanupSourceBuffer: false,
    liveBufferLatencyChasing: false,
    fixAudioTimestampGap: false,

    customLoader: makeSafariVideoOnlyLoader(null)
  };

  videoEl.playsInline = true;
  videoEl.muted = true;

  // 仅用于此次诊断，避免远程播放选项干扰 MMS。
  if ('disableRemotePlayback' in videoEl) {
    videoEl.disableRemotePlayback = true;
  }

  // 测试实际 HEVC codec，而不是原日志中的 AVC codec。
  const hevcMime = 'video/mp4; codecs="hvc1.1.1.L150.B0"';

  for (const name of ['MediaSource', 'ManagedMediaSource']) {
    const C = window[name];

    if (C && typeof C.isTypeSupported === 'function') {
      console.log(
        'CCTV16_TEST: ' + name +
        '.isTypeSupported(' + hevcMime + ')=',
        C.isTypeSupported(hevcMime)
      );
    }
  }

  for (const eventName of [
    'loadedmetadata', 'loadeddata', 'playing', 'waiting', 'error'
  ]) {
    videoEl.addEventListener(eventName, () => {
      const err = videoEl.error;

      console.log(
        'CCTV16_TEST: video event=' + eventName,
        'readyState=' + videoEl.readyState,
        'currentTime=' + videoEl.currentTime,
        'size=' + videoEl.videoWidth + 'x' + videoEl.videoHeight,
        'error=' + (err ? `${err.code}: ${err.message}` : 'none')
      );
    });
  }

  if (typeof videoEl.requestVideoFrameCallback === 'function') {
    videoEl.requestVideoFrameCallback((now, meta) => {
      console.log(
        'CCTV16_TEST: first video frame',
        'mediaTime=' + meta.mediaTime,
        'size=' + meta.width + 'x' + meta.height
      );
    });
  }

  console.log(
    'CCTV16_TEST: FORCED video-only, customLoader enabled',
    dataSource
  );

  const p = mpegts.createPlayer(dataSource, config);

  p.on(mpegts.Events.ERROR, (type, detail, info) => {
    console.error('CCTV16_TEST: mpegts.ERROR', type, detail, info);
  });

  p.on(mpegts.Events.MEDIA_INFO, info => {
    console.log('CCTV16_TEST: MEDIA_INFO', info);
  });

  p.attachMediaElement(videoEl);
  p.load();

  // 本次测试不等 buffer gate，直接请求播放。
  try {
    const result = p.play();

    if (result && typeof result.catch === 'function') {
      result.catch(e => {
        console.error('CCTV16_TEST: play rejected', e);
      });
    }
  } catch (e) {
    console.error('CCTV16_TEST: play threw', e);
  }

  return p;
}

function safariMseFallbackToVideo(ch, url, seq, failedPlayer){
  if(seq!==state.seq || !isIOSSafari() || state.safariFallbackTried) return;
  if(state.player!==failedPlayer) return;
  state.safariFallbackTried=true;
  state.safariFallbackTimer=0;
  log('SAFARI_MSE_FALLBACK: A/V MSE 失败，开始一次性 Video-only 回退');
  setStatus('Safari MSE失败 → 回退 Video-only');
  stopDiagTimers();
  try{ failedPlayer.pause(); }catch(e){}
  try{ failedPlayer.unload(); }catch(e){ log('FALLBACK unload error '+e.message); }
  try{ failedPlayer.detachMediaElement(); }catch(e){ log('FALLBACK detach error '+e.message); }
  try{ failedPlayer.destroy(); }catch(e){ log('FALLBACK destroy error '+e.message); }
  if(state.player===failedPlayer) state.player=null;
  const v=$('video');
  try{ v.pause(); }catch(e){}
  try{ v.removeAttribute('src'); v.load(); }catch(e){ log('FALLBACK video reset error '+e.message); }
  state.playIssuedAt=0;
  state.firstFrameAt=0;
  state.firstPlayingAt=0;
  state.waitingStart=0;
  state.stallStart=0;
  state.waitingCount=0;
  state.stallCount=0;
  state.lastProgressWall=performance.now();
  state.lastProgressTime=0;
  state.playingSince=0;
  state.mediaInfo=null;
  state.lastErrorText='';
  state.audioDecodeError=false;
  state.classification='FALLBACK';
  state.classificationReason='Safari A/V MSE error → Video-only';
  state.avMode='video-fallback';
  log('SAFARI_MSE_FALLBACK: old player fully destroyed; waiting 250ms before Video-only create');
  setTimeout(()=>{
    if(seq!==state.seq || state.safariFallbackTried!==true || state.player) return;
    log('SAFARI_MSE_FALLBACK: createPlayer mode=video, hasAudio=false + TS filter');
    createPlayer(ch, url, seq, 'video');
    // WebAudio experiment is independent of the video-only fallback.
  },250);
}

function scheduleSafariMseFallback(ch, url, seq, failedPlayer, details, type){
  if (isIOSSafari() && state.safariAudioRoute !== 'mpeg-audio') {
    log('SAFARI_MSE_FALLBACK: route=' + state.safariAudioRoute +
        '，保留 A/V，不切换到 video-only');
    return;
  }
  if(!isIOSSafari() || state.safariFallbackTried) return;
  if(state.avMode!=='av' || state.player!==failedPlayer) return;
  const text=String(details||type||'');
  const isMse=/MSE|mse/i.test(text) || text===String(mpegts.ErrorDetails && mpegts.ErrorDetails.MEDIA_MSE_ERROR || 'MEDIA_MSE_ERROR');
  if(!isMse) return;
  if(state.safariFallbackTimer) return;
  log('SAFARI_MSE_FALLBACK: detected mpegts ERROR '+text+'; 600ms 后回退');
  state.safariFallbackTimer=setTimeout(()=>safariMseFallbackToVideo(ch,url,seq,failedPlayer),600);
}

function createPlayer(ch, url, seq, mode, extraOpts){
  extraOpts = extraOpts || {};
  if(seq!==state.seq) return;
  const v=$('video');
  const iosSafari=isIOSSafari();
  attachVideoDiagnostics(v, seq);
  if(mode==='muted'){ v.muted=true; v.volume=0; log('audio experiment: muted=true volume=0 (audio still demuxed)'); }
  else { v.muted=false; }
  // iPhone/iPad Safari uses ManagedMediaSource. Marking the source live is important
  // for Apple's live-MSE path; keep the proven isLive=false path on other browsers.
  const ds={type:'mpegts', url:url, isLive:extraOpts.isLive!==undefined?!!extraOpts.isLive:iosSafari};
  if(mode==='video') {
    ds.hasAudio=false;
  }
  const config=playerConfig();
  if(extraOpts.rawFetch && !(mode==='video' && iosSafari && extraOpts.safariVideoOnly)) config.customLoader=makeRelayFetchLoader(extraOpts);
  if(mode==='video' && iosSafari && (!extraOpts.rawFetch || extraOpts.safariVideoOnly)){
	try{
      config.customLoader = makeSafariVideoOnlyLoader(extraOpts.onOpenGopBootstrap || null, extraOpts.onBytes || null, extraOpts.onAudioPes || null, extraOpts.onVideoPts || null);
      log('SAFARI_TS_FILTER: custom MPEG-TS video-only loader enabled via Config.customLoader');
      log('SAFARI_AUDIO: video MSE path is audio-free; WebAudio MPEG Audio PES experiment is independent');
    }
    catch(e){ log('SAFARI_TS_FILTER: custom loader unavailable '+e.message); }
  } 
  log('CONFIG '+JSON.stringify(config));
  log('MediaDataSource '+JSON.stringify(ds));
  if(iosSafari) log('iOS Safari path: ManagedMediaSource + isLive=true');
  try{
    if(window.MediaSource){
      log('isTypeSupported video/mp4;codecs="avc1.640029"='+MediaSource.isTypeSupported('video/mp4; codecs="avc1.640029"'));
      log('isTypeSupported audio/mp4;codecs="mp3"='+MediaSource.isTypeSupported('audio/mp4; codecs="mp3"'));
      log('isTypeSupported audio/mpeg='+MediaSource.isTypeSupported('audio/mpeg'));
    }
  }catch(e){}
  let p;
  try{ p=mpegts.createPlayer(ds, config); }
  catch(e){ setStatus('播放器创建失败'); log('createPlayer error '+e.stack); return; }
  state.player=p;
  p.on(mpegts.Events.ERROR, (type, details, info)=>{
    if(seq!==state.seq) return;
    state.lastErrorText=String(details||type);
    if(extraOpts.onError){try{extraOpts.onError(new Error(String(details||type)));}catch(e){}}
    if(/audio/i.test(String(details||'')+' '+JSON.stringify(info||{}))) state.audioDecodeError=true;
    log('mpegts.ERROR type='+type+' details='+details+' info='+JSON.stringify(info||{}));
    scheduleSafariMseFallback(ch,url,seq,p,details,type);
    setStatus('播放错误：'+details);
    
  });
  p.on(mpegts.Events.MEDIA_INFO, info=>{
    if(seq!==state.seq) return;
    state.mediaInfo=info||{};
    if(info&&info.videoCodec) state.lastVideoCodec=info.videoCodec;
    if(info&&info.width) state.lastVideoWidth=info.width;
    if(info&&info.height) state.lastVideoHeight=info.height;
    log('MEDIA_INFO '+JSON.stringify(info));
    const vc=info&&info.videoCodec?info.videoCodec:'';
    const ac=info&&info.audioCodec?info.audioCodec:'';
    setStatus((mode==='video'?(state.safariFallbackTried?'Safari回退 Video-only · ':'Video-only · '):mode==='muted'?'Muted-AV · ':'A/V · ')+(vc||'')+(ac?' · '+ac:''));
    
  });
  ['LOADING_COMPLETE','RECOVERED_EARLY_EOF','STATISTICS_INFO'].forEach(name=>{
    const ev=mpegts.Events[name];
    if(!ev) return;
    p.on(ev, info=>{
      if(seq!==state.seq) return;
      if(name==='STATISTICS_INFO'){ state.stats=info||{}; return; }
      if(name==='LOADING_COMPLETE'&&extraOpts.onComplete){try{extraOpts.onComplete();}catch(e){}}
      log(name+(info?' '+JSON.stringify(info):''));
    });
  });
  p.attachMediaElement(v);
  p.load();
  const start=()=>{
    if(seq!==state.seq || state.playIssuedAt) return;
    state.startTimer=0;
    state.playIssuedAt=performance.now();
    log('EXPLICIT play() readyState='+v.readyState+' bufferAhead='+bufferAhead(v).toFixed(3)+' (no buffer gate)');
    try{
      const q=p.play();
      if(q&&q.then) q.then(()=>log('player.play resolved')).catch(e=>log('player.play rejected '+e.name+': '+e.message));
    }catch(e){ log('player.play threw '+e.name+': '+e.message); }
  };

  const needBufferGate = (mode==='video' && iosSafari);
  const startGated=()=>{
    log('startGated ENTERED readyState='+v.readyState+' bufferAhead='+bufferAhead(v).toFixed(3));
    if(seq!==state.seq || state.playIssuedAt){ log('startGated SKIP seq/played'); return; }
    const MIN_AHEAD=1.2;
    const MAX_WAIT_MS=4000;
    const t0=performance.now();
    let fired=false;
    const fire=(reason)=>{
      if(fired||seq!==state.seq||state.playIssuedAt) return;
      fired=true;
      cleanup();
      state.startTimer=0;
      state.playIssuedAt=performance.now();
      const ahead=bufferAhead(v);
      log('EXPLICIT play() readyState='+v.readyState+' bufferAhead='+ahead.toFixed(3)+' reason='+reason);
      try{
        const q=p.play();
        if(q&&q.then) q.then(()=>log('player.play resolved')).catch(e=>log('player.play rejected '+e.name+': '+e.message));
      }catch(e){ log('player.play threw '+e.name+': '+e.message); }
    };
	let lastGateDiag = performance.now();

	const rangesText = () => {
	  const ranges = [];
	  try {
		for (let i = 0; i < v.buffered.length; i++) {
		  ranges.push(
			'[' + v.buffered.start(i).toFixed(3) +
			',' + v.buffered.end(i).toFixed(3) + ']'
		  );
		}
	  } catch (_) {}
	  return '[' + ranges.join(',') + ']';
	};

	const check = () => {
	  if (seq !== state.seq) {
		cleanup();
		return;
	  }

	  const ahead = bufferAhead(v);
	  const now = performance.now();

	  if (now - lastGateDiag >= 500) {
		lastGateDiag = now;
		log(
		  'START_GATE_CHECK readyState=' + v.readyState +
		  ' paused=' + v.paused +
		  ' currentTime=' + (Number(v.currentTime) || 0).toFixed(3) +
		  ' ahead=' + ahead.toFixed(3) +
		  ' buffered=' + rangesText()
		);
	  }

	  // 下面原有的阈值判断保持不变
	  if (ahead >= MIN_AHEAD) {
		fire('buffer>=' + MIN_AHEAD + 's(' + ahead.toFixed(3) + ')');
		return;
	  }
	  if (performance.now() - t0 > MAX_WAIT_MS) {
		fire('timeout(ahead=' + ahead.toFixed(3) + ')');
	  }
	};	
    const onProgress=()=>check();
    const ticker=setInterval(check, 100);
    const cleanup=()=>{
      v.removeEventListener('progress', onProgress);
      v.removeEventListener('timeupdate', onProgress);
      v.removeEventListener('canplaythrough', onProgress);
      v.removeEventListener('canplay', onProgress);
      v.removeEventListener('durationchange', onProgress);
      clearInterval(ticker);
    };
    v.addEventListener('progress', onProgress);
    v.addEventListener('timeupdate', onProgress);
    v.addEventListener('canplaythrough', onProgress);
    v.addEventListener('canplay', onProgress);
    v.addEventListener('durationchange', onProgress);
    check();
  };

  const kick = needBufferGate ? startGated : start;
  log('START scheduling needBufferGate='+needBufferGate+' readyState='+v.readyState);
  if(v.readyState>=1) kick();
  else v.addEventListener('loadedmetadata', kick, {once:true});
}

  state.playStarted=performance.now();
  state.firstFrameAt=0; state.firstPlayingAt=0; state.last={t:0,wall:0};
  state.waitingStart=0; state.stallStart=0; state.waitingCount=0; state.stallCount=0;
  state.stats={}; state.playIssuedAt=0; state.lastRecoveryAt=0; state.recoveries=0;
  state.lastProgressWall=performance.now(); state.lastProgressTime=0; state.playingSince=0;
  state.mediaInfo=null; state.lastVideoCodec=''; state.lastVideoWidth=0; state.lastVideoHeight=0; state.lastErrorText=''; state.audioDecodeError=false;
  state.ts={pts:0,dts:0,continuity:0,privateAudio:[]};
  state.timeline=[]; state.lastFrame=null;
  state.classification='STARTING'; state.classificationReason='';
  state.userPaused=false; state.stopping=false; state.nudgedThisPlay=false;
  state.safariFallbackTried=false;
  state.audioUrl=''; state.audioStartedAt=0; state.audioError=''; state.audioPlaying=false;
  state.webAudioState='off'; state.webAudioError=''; state.webAudioInfo=null; state.webAudioBuffer=null; state.webAudioSource=null; state.webAudioDecoder=null;
  state.audioDecodeError=false;

  if(state.stableTimer){ clearTimeout(state.stableTimer); state.stableTimer=0; }
  if(state.safariFallbackTimer){ clearTimeout(state.safariFallbackTimer); state.safariFallbackTimer=0; }
}

function play(ch){
  stopCatchupTicker();state.catchup.active=false;$('catchupPanel').hidden=true;
  const seq=++state.seq;state.sourceKind='multicast';state.liveFallbackTried=false;
  state.safariAudioOnly=false;
  state.current=ch; state.active=ch.group; state.selectedEpg=null; state.epgDate=bjInput(Date.now()).date; state.epgLocatePending=true; renderGroups();
  stopPlayer();

  // 新频道开始前，先把上一个频道可能残留的遮罩/定时器清掉
  if (state.cancelOpenGopConceal) {
    try { state.cancelOpenGopConceal(); } catch(e){}
    state.cancelOpenGopConceal = null;
  }

  const v=$('video');
  v.controls=true;
  installGestureHooks();
  try{ v.pause(); }catch(e){}
  v.autoplay=false; v.removeAttribute('autoplay'); v.removeAttribute('src'); v.load();
  if(state.startTimer){ clearTimeout(state.startTimer); state.startTimer=0; }
  resetPlayState();
  $('now').firstChild.textContent=ch.name;
  renderEpgPanel(ch);
  const url=streamUrl(ch);
  log('PLAY name='+ch.name+' url='+url+' seq='+seq+' ua='+navigator.userAgent);

  if (isIOSSafari()) {
    prepareSafariAudioContextFromGesture();

    detectSafariAudioRoute(ch, seq).then(route => {
      if (!route || seq !== state.seq) return;

  	  if (route.kind === 'probe-error') {
	    state.safariAudioRoute = 'unknown';
	    state.avMode = 'av';

	    discardPreparedSafariAudioContext();

	    log('SAFARI route probe failed: ' + route.reason);
	    setStatus('Safari 音频探测失败，请重试');
	    return;
	  }

      if (route.kind === 'mpeg-audio') {
        state.safariAudioRoute = 'mpeg-audio';
        state.safariAudioOnly = route.hasVideo === false;
        state.avMode = state.safariAudioOnly ? 'audio-only' : 'video';

        log('SAFARI route=video-only + MPEG Audio stream_type=' + route.streamType);

        startWebAudioMpeg(ch, seq);
        if (state.safariAudioOnly) {
          const v2=$('video');
          v2.controls=false;
          try{ v2.pause(); v2.removeAttribute('src'); v2.load(); }catch(e){}
          setStatus('Safari 广播音频 · MPEG Audio');
          return;
        }

        // 关键改动：不再无条件 arm，而是把回调传进去，
        // 只有 OpenGopFixer 真正做了 bootstrap 才会触发遮罩
        createPlayer(ch, url, seq, 'video', {
          onError:e=>startLiveRelayFallback(ch,seq),onComplete:()=>startLiveRelayFallback(ch,seq),
          onOpenGopBootstrap: function (pid) {
            if (seq !== state.seq) return;      // 频道已切换，忽略过期回调
            log('OpenGOP bootstrap detected on PID=' + pid + ', arming recovery mask');
            if (state.cancelOpenGopConceal) {
              state.cancelOpenGopConceal();
              state.cancelOpenGopConceal = null;
            }
            state.cancelOpenGopConceal = armOpenGopStartupConceal(
              $('video'),
              function (msg) { diagnosticLog('[' + ch.name + ']' + ' ' + msg); },
              1600
            );
          }
        });
      } else {
        state.safariAudioRoute = 'av-mse';
        state.avMode = 'av';
        log('SAFARI route=A/V MSE stream_type=' + (route.streamType == null ? 'unknown' : route.streamType));
        discardPreparedSafariAudioContext();
        createPlayer(ch, url, seq, 'av',{onError:e=>startLiveRelayFallback(ch,seq),onComplete:()=>startLiveRelayFallback(ch,seq)});
      }
    }).catch(e => {
      if (seq !== state.seq) return;
      state.safariAudioRoute = 'unknown';
      state.avMode = 'av';
      log('SAFARI route probe failed; keep A/V: ' + e.message);
      discardPreparedSafariAudioContext();
      createPlayer(ch, url, seq, 'av');
    });

    return;
  }

  // 非 iOS Safari 保持原有逻辑
  state.avMode = avMode();
  if(!window.mpegts || !mpegts.isSupported()){
    setStatus('浏览器不支持 MSE MPEG-TS / mpegts.js 未安装');
    log('mpegts.isSupported=false localMarker='+!!window.__iptvwebMpegtsLocalRequired);
    return;
  }
  createPlayer(ch, url, seq, state.avMode,{onError:e=>startLiveRelayFallback(ch,seq),onComplete:()=>startLiveRelayFallback(ch,seq)});
}

function stopPlayback(){
  state.seq++;stopCatchupTicker();state.catchup.active=false;
  state.stopping=true;
  stopWebAudio(); state.userPaused=false;
  log('STOP: 用户请求停止并断开流');

  if (state.cancelOpenGopConceal) {
    try { state.cancelOpenGopConceal(); }
    catch (e) { log('STOP cancelOpenGopConceal error ' + e.message); }
    state.cancelOpenGopConceal = null;
  }
  // 防御性兜底：万一 cancel 函数本身没把遮罩隐藏干净，这里强制隐藏一次
  try { hideRecoveryMask(); } catch (e) {}

  stopDiagTimers();
  const p=state.player, v=$('video');
  try{ v.pause(); }catch(e){}
  try{ if(p) p.unload(); }catch(e){ log('STOP unload error '+e.message); }
  try{ if(p) p.detachMediaElement(); }catch(e){}
  try{ if(p) p.destroy(); }catch(e){}
  state.player=null;
  try{ v.removeAttribute('src'); v.load(); }catch(e){}
  setStatus('已停止并断开');
  log('STOP: player destroyed / stream disconnected');
  state.stopping=false;
}

function armOpenGopStartupConceal(video, logFn, concealMs) {
  if (!video) {
    return function () {};
  }

  const log = logFn || function () {};
  const targetMs =
    Number.isFinite(concealMs) ? concealMs : 1600;

  const host = video.parentElement;

  const oldOpacity = video.style.opacity;
  const oldTransition = video.style.transition;
  const oldHostBackground =
    host ? host.style.backgroundColor : '';

  let firstMediaTime = null;
  let callbackId = null;
  let hardTimer = null;
  let fadeTimer = null;
  let timeUpdateHandler = null;
  let finished = false;

  if (host) {
    host.style.backgroundColor = '#000';
  }

  /*
   * 不能用 display:none 或 visibility:hidden。
   * Safari 可能停止或降低视频解码频率。
   * opacity:0 仍然允许正常解码和 requestVideoFrameCallback。
   */
  video.style.transition = 'none';
  video.style.opacity = '0';

  function restoreStyles() {
    video.style.transition = oldTransition;
    video.style.opacity = oldOpacity;

    if (host) {
      host.style.backgroundColor = oldHostBackground;
    }
  }

  function reveal(reason, mediaTime) {
    if (finished) return;
    finished = true;

    if (
      callbackId != null &&
      typeof video.cancelVideoFrameCallback === 'function'
    ) {
      try {
        video.cancelVideoFrameCallback(callbackId);
      } catch (_) {
        // 忽略
      }
    }

    callbackId = null;

    if (timeUpdateHandler) {
      video.removeEventListener(
        'timeupdate',
        timeUpdateHandler
      );
      timeUpdateHandler = null;
    }

    if (hardTimer != null) {
      clearTimeout(hardTimer);
      hardTimer = null;
    }

    video.style.transition = 'opacity 120ms linear';
    video.style.opacity = '1';

    log(
      'OPEN_GOP_CONCEAL: reveal reason=' + reason +
      ' mediaTime=' +
      (
        Number.isFinite(mediaTime)
          ? mediaTime.toFixed(3)
          : 'n/a'
      ) +
      ' targetMs=' + targetMs
    );

    fadeTimer = setTimeout(function () {
      fadeTimer = null;
      restoreStyles();
    }, 160);
  }

  function onVideoFrame(now, metadata) {
    if (finished) return;

    const mediaTime =
      metadata && Number.isFinite(metadata.mediaTime)
        ? metadata.mediaTime
        : video.currentTime;

    if (firstMediaTime == null) {
      firstMediaTime = mediaTime;

      log(
        'OPEN_GOP_CONCEAL: first hidden frame mediaTime=' +
        mediaTime.toFixed(3) +
        ' concealMs=' + targetMs
      );
    }

    const decodedSpanMs =
      (mediaTime - firstMediaTime) * 1000;

    if (decodedSpanMs >= targetMs) {
      reveal('decoded-media-span', mediaTime);
      return;
    }

    callbackId =
      video.requestVideoFrameCallback(onVideoFrame);
  }

  if (
    typeof video.requestVideoFrameCallback === 'function'
  ) {
    callbackId =
      video.requestVideoFrameCallback(onVideoFrame);
  } else {
    /*
     * 旧 Safari 的后备路径。
     */
    timeUpdateHandler = function () {
      if (finished) return;

      const mediaTime = video.currentTime;

      if (firstMediaTime == null) {
        firstMediaTime = mediaTime;
      }

      if (
        (mediaTime - firstMediaTime) * 1000 >= targetMs
      ) {
        reveal('timeupdate-span', mediaTime);
      }
    };

    video.addEventListener(
      'timeupdate',
      timeUpdateHandler
    );
  }

  /*
   * 防止解码器异常时视频永久不可见。
   * 正常情况下会先由 decoded-media-span 揭开。
   */
  hardTimer = setTimeout(function () {
    reveal('safety-timeout', video.currentTime);
  }, 8000);

  /*
   * 在 STOP 或切换频道时调用这个返回函数。
   */
  return function cancelOpenGopStartupConceal() {
    if (
      callbackId != null &&
      typeof video.cancelVideoFrameCallback === 'function'
    ) {
      try {
        video.cancelVideoFrameCallback(callbackId);
      } catch (_) {
        // 忽略
      }
    }

    callbackId = null;

    if (timeUpdateHandler) {
      video.removeEventListener(
        'timeupdate',
        timeUpdateHandler
      );
      timeUpdateHandler = null;
    }

    if (hardTimer != null) {
      clearTimeout(hardTimer);
      hardTimer = null;
    }

    if (fadeTimer != null) {
      clearTimeout(fadeTimer);
      fadeTimer = null;
    }

    finished = true;
    restoreStyles();
  };
}
function jumpToLatest(){
  const v=$('video');
  try{
    if(!v.buffered.length){ log('JUMP: 无 buffered'); return; }
    const end=v.buffered.end(v.buffered.length-1);
    const target=Math.max(v.buffered.start(v.buffered.length-1), end-0.5);
    log('JUMP: bufferedEnd='+end.toFixed(3)+' target='+target.toFixed(3));
    v.currentTime=target;
    const p=v.play();
    if(p&&p.catch) p.catch(e=>log('JUMP play rejected '+e.name+': '+e.message));
  }catch(e){ log('JUMP error '+e.message); }
}

async function load(){
  state.current=null; state.active='';
  stopPlayer();
  setStatus('正在读取 M3U…');
  const ac=new AbortController();
  const t=setTimeout(()=>ac.abort(), 20000);
  try{
    const r=await fetch('/cgi-bin/iptvweb-m3u?'+Date.now(), {cache:'no-store', signal:ac.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text=await r.text();
    try{const mr=await fetch('/luci-static/resources/iptvweb/unicast-map.json?'+Date.now(),{cache:'no-store'});state.unicastMap=mr.ok?await mr.json():[];}catch(e){state.unicastMap=[];}
    state.items=parseM3U(text);state.items.forEach(ch=>{ch.rtsp=resolveUnicast(ch);});
    state.groups=[...new Set(state.items.map(x=>x.group))];
    if(state.items.length) state.active=state.items[0].group;
    renderGroups();
    loadEpg(false);
    if(!state.items.length){
      setStatus('M3U 解析到 0 个频道');

    }else{
      setStatus(state.items.length+' 个频道');
    }
  }catch(e){
    const msg=e.name==='AbortError'?'M3U 读取超时 20s':'M3U 读取失败: '+(e.message||e);
    setStatus(msg);
    console.error(e);

  }finally{
    clearTimeout(t);
  }
}

$('stopBtn2').onclick=()=>{stopCatchupTicker();state.catchup.active=false;$('catchupPanel').hidden=true;stopPlayback();};
$('recoverBtn').onclick=toggleVideoPlayback;
$('catchupStartBtn').onclick=startCatchup;
$('epgRefresh').onclick=()=>loadEpg(true);
$('epgPrevDay').onclick=()=>{const d=availableEpgDates(state.current).filter(x=>x<state.epgDate).pop();if(d)chooseEpgDate(d);};
$('epgNextDay').onclick=()=>{const d=availableEpgDates(state.current).find(x=>x>state.epgDate);if(d)chooseEpgDate(d);};
$('epgToday').onclick=()=>chooseEpgDate(bjInput(Date.now()).date);
$('epgDate').onchange=e=>chooseEpgDate(e.target.value);
$('catchupExitBtn').onclick=exitCatchup;
$('diagToggleBtn').onclick=()=>{$('diagPanel').hidden=!$('diagPanel').hidden;if(!$('diagPanel').hidden)renderDiagLog();};
$('diagCloseBtn').onclick=()=>{$('diagPanel').hidden=true;};
$('diagClearBtn').onclick=()=>{state.log=[];renderDiagLog();};
$('diagCopyBtn').onclick=async()=>{const value=state.log.join('\n');try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(value);$('diagCopyBtn').textContent='已复制';}else{const el=$('diagLog');const range=document.createRange();range.selectNodeContents(el);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);$('diagCopyBtn').textContent='请长按复制';}}catch(e){$('diagCopyBtn').textContent='请长按复制';}};









load();
</script>
