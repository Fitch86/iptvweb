const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(line,name){const re=new RegExp(name+'="([^"]*)"','i'),m=line.match(re);return m?m[1]:''}
function parseM3U(text){
  const lines=text.split(/\r?\n/),out=[]; let info=null;
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith('#EXTINF:')) info=line;
    else if(info && !line.startsWith('#')){
      out.push({
        name:info.split(',').slice(1).join(',')||attr(info,'tvg-name'),
        id:attr(info,'tvg-id'), logo:attr(info,'tvg-logo'),
        group:attr(info,'group-title')||'其他', url:line
      });
      info=null;
    }
  }
  return out;
}
function streamUrl(ch){
  try{
    const u=new URL(ch.url, location.href);
    const m=u.pathname.match(/^\/udp\/([^:]+):(\d+)$/);
    if(m){
      const proxy=new URL('/cgi-bin/iptvweb-stream', window.location.href);
      proxy.searchParams.set('group', m[1]);
      proxy.searchParams.set('port', m[2]);
      return proxy.href;
    }
  }catch(e){}
  return new URL(ch.url, window.location.href).href;
}

function audioStreamUrl(ch){
  const candidates=[];
  try{ candidates.push(String(ch&&ch.url||'')); }catch(e){}
  try{ candidates.push(String(streamUrl(ch)||'')); }catch(e){}
  for(const raw of candidates){
    if(!raw) continue;
    try{
      const u=new URL(raw, window.location.href);
      const path=u.pathname.replace(/\/+$/,'');
      let m=path.match(/\/udp\/(\d+\.\d+\.\d+\.\d+):(\d+)$/);
      if(!m) m=raw.match(/\/udp\/(\d+\.\d+\.\d+\.\d+):(\d+)(?:[\/?#]|$)/);
      if(m){
        const proxy=new URL('/cgi-bin/iptvweb-audio-pes', window.location.href);
        proxy.searchParams.set('group', m[1]); proxy.searchParams.set('port', m[2]);
        return proxy.href;
      }
    }catch(e){}
  }
  return '';
}

function probeIndependentAudio(ch, seq){
  if(!isIOSSafari() || seq!==state.seq) return;
  const url=audioStreamUrl(ch); if(!url) return;
  try{
    const u=new URL(url, window.location.href);
    const probe=new URL('/cgi-bin/iptvweb-audio-probe', window.location.href);
    probe.search=u.search;
    fetch(probe.href, {cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    }).then(text=>{
      if(seq!==state.seq) return;
      let x;
      try{x=JSON.parse(text);}catch(e){ throw new Error('probe JSON parse: '+e.message+' body='+text.slice(0,240)); }
      if(x&&x.ok){
        state.webAudioInfo=x;
        log('SAFARI_AUDIO: MPEG header pid='+x.pid+' stream_type='+x.pmt_stream_type+' '+x.version+' '+x.layer+' '+x.bitrate_kbps+'kbps '+x.sample_rate+'Hz '+x.channels+'ch frame='+x.frame_length+' hex='+x.header_hex);
      } else {
        log('SAFARI_AUDIO: MPEG header probe failed '+(x&&x.error||'unknown'));
      }
    }).catch(e=>log('SAFARI_AUDIO: MPEG header probe error '+e.message));
  }catch(e){ log('SAFARI_AUDIO: MPEG header probe exception '+e.message); }
}

function prepareSafariAudioContextFromGesture() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) {
    log('SAFARI_MP2PCM: AudioContext unavailable');
    return null;
  }

  let ctx = state.webAudioCtx;
  if (!ctx || ctx.state === 'closed') {
    ctx = new Ctx({latencyHint: 'interactive'});
    state.webAudioCtx = ctx;
  }

  state.audioCtxRate = ctx.sampleRate;

  // 必须在频道点击手势中尽早调用 resume()
  try {
    const p = ctx.resume();
    if (p && p.catch) {
      p.catch(e => log('SAFARI_MP2PCM: prepared context resume failed ' + e.message));
    }
  } catch (e) {
    log('SAFARI_MP2PCM: prepared context resume error ' + e.message);
  }

  return ctx;
}

function discardPreparedSafariAudioContext() {
  const ctx = state.webAudioCtx;
  state.webAudioCtx = null;
  state.audioCtxRate = 0;

  if (ctx && ctx.state !== 'closed') {
    try {
      const p = ctx.close();
      if (p && p.catch) p.catch(() => {});
    } catch (_) {}
  }
}

function parsePmtStreamType(value) {
  if (Number.isInteger(value)) return value;

  if (typeof value === 'string') {
    const s = value.trim();
    if (/^0x[0-9a-f]+$/i.test(s)) return parseInt(s, 16);
    if (/^\d+$/.test(s)) return Number(s);
  }
  return null;
}

async function detectSafariAudioRoute(ch, seq) {
  const audioUrl = audioStreamUrl(ch);
  if (!audioUrl) {
    return { kind: 'av-mse', streamType: null, reason: 'no audio URL' };
  }

  const source = new URL(audioUrl, location.href);
  const probe = new URL('/cgi-bin/iptvweb-audio-probe', location.href);
  probe.search = source.search;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3000);

  try {
    const response = await fetch(probe.href, {
      cache: 'no-store',
      signal: controller.signal
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);

    const info = await response.json();
    if (seq !== state.seq) return null;

    const streamType = parsePmtStreamType(info.pmt_stream_type);

    // 只有明确识别为 MPEG Audio 才走独立解码。
    if (info.pmt_found === true && (streamType === 3 || streamType === 4)) {
      return { kind: 'mpeg-audio', streamType, hasVideo: info.has_video !== false, info };
    }

    // AAC、未知类型、probe 不完整都保留 A/V 音轨。
    return { kind: 'av-mse', streamType, info };
  } catch (e) {
    return { kind: 'av-mse', streamType: null, reason: e.message };
  } finally {
    clearTimeout(timer);
  }
}

async function waitForWorkletSpace(seq){
  if(seq!==state.seq) throw new Error('stale playback sequence');
  if(state.audioWorkletInFlight < state.audioWorkletMaxInFlight) return;
  await new Promise((resolve,reject)=>{
    state.audioWorkletWaiters.push({resolve,reject,seq});
  });
  if(seq!==state.seq) throw new Error('stale playback sequence');
}

function notifyWorkletSpace(){
  while(state.audioWorkletWaiters.length && state.audioWorkletInFlight < state.audioWorkletMaxInFlight){
    const w=state.audioWorkletWaiters.shift();
    if(w.seq===state.seq) w.resolve(); else w.reject(new Error('stale playback sequence'));
  }
}

function resampleStereoLinear(stereo, frames, srcRate, dstRate){
  // Linear-interpolation resampler with cross-chunk phase carry, so total
  // output duration stays exact over long streams (no cumulative drift).
  state.audioResampleAcc += frames*dstRate/srcRate;
  const outFrames=Math.floor(state.audioResampleAcc);
  if(outFrames<=0) return {pcm:null,frames:0};
  state.audioResampleAcc-=outFrames;
  const step=srcRate/dstRate;
  const out=new Float32Array(outFrames*2);
  let pos=state.audioResamplePos;
  for(let i=0;i<outFrames;i++){
    const ip=pos|0, fr=pos-ip;
    const i0=Math.min(ip,frames-1), i1=Math.min(ip+1,frames-1);
    const l0=stereo[i0*2], l1=stereo[i1*2];
    const r0=stereo[i0*2+1], r1=stereo[i1*2+1];
    out[i*2]=l0+(l1-l0)*fr;
    out[i*2+1]=r0+(r1-r0)*fr;
    pos+=step;
  }
  state.audioResamplePos=Math.max(0,pos-frames);
  return {pcm:out,frames:outFrames};
}

function parseMpegAudioFrameHeader(a,o=0){
  if(!a || o+4>a.length || a[o]!==0xff || (a[o+1]&0xe0)!==0xe0) return null;
  const b1=a[o+1], b2=a[o+2], b3=a[o+3];
  const verBits=(b1>>3)&3, layerBits=(b1>>1)&3;
  if(verBits===1 || layerBits===0) return null;
  const version=verBits===3?'MPEG1':(verBits===2?'MPEG2':'MPEG2.5');
  const layer=layerBits===3?'I':(layerBits===2?'II':'III');
  const brIdx=(b2>>4)&15, srIdx=(b2>>2)&3, pad=(b2>>1)&1;
  const srTable={MPEG1:[44100,48000,32000],MPEG2:[22050,24000,16000],'MPEG2.5':[11025,12000,8000]};
  const brTable={
    MPEG1:[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320,0],
    MPEG2:[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160,0],
    'MPEG2.5':[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160,0]
  };
  const sampleRate=(srTable[version]||[])[srIdx]||0;
  const bitrate=(brTable[version]||[])[brIdx]||0;
  if(!sampleRate || !bitrate || brIdx===15 || srIdx===3) return null;
  let frameLength;
  if(layer==='I') frameLength=(Math.floor(12*bitrate*1000/sampleRate)+pad)*4;
  else frameLength=Math.floor((version==='MPEG1'?144:72)*bitrate*1000/sampleRate)+pad;
  const mode=(b3>>6)&3;
  return {version,layer,bitrateKbps:bitrate,sampleRate,frameLength,padding:pad,channels:mode===3?1:2};
}

function takeMpegAudioFrames(maxFrames=8){
  const frames=[];
  let b=state.audioMpegBuffer;
  while(frames.length<maxFrames && b.length>=4){
    let h=parseMpegAudioFrameHeader(b,0);
    if(!h){
      let found=-1;
      for(let i=1;i+4<=b.length;i++){
        if(parseMpegAudioFrameHeader(b,i)){ found=i; break; }
      }
      if(found<0){
        // Keep the last 3 bytes in case a sync/header straddles the next fetch chunk.
        const keep=b.length>3?b.subarray(b.length-3):b;
        state.audioMpegResyncBytes += b.length-keep.length;
        b=new Uint8Array(keep); break;
      }
      state.audioMpegResyncBytes += found;
      b=b.subarray(found);
      h=parseMpegAudioFrameHeader(b,0);
      if(!h) break;
    }
    if(b.length<h.frameLength) break;
    frames.push(b.slice(0,h.frameLength));
    state.audioMpegFrames++;
    b=b.subarray(h.frameLength);
  }
  state.audioMpegBuffer=b;
  return frames;
}

function appendMpegAudioBytes(part){
  const old=state.audioMpegBuffer||new Uint8Array(0);
  const b=new Uint8Array(old.length+part.length);
  b.set(old,0); b.set(part,old.length);
  state.audioMpegBuffer=b;
}

async function startWebAudioMpeg(ch, seq){
  if(!isIOSSafari() || seq!==state.seq) return;
  const url=audioStreamUrl(ch);
  log('SAFARI_AUDIO: MP2PCM continuous source='+url);
  if(!url){ state.webAudioState='no-url'; state.webAudioError='cannot extract multicast /udp/group:port'; log('SAFARI_AUDIO: cannot extract multicast /udp/group:port; MP2 decoder disabled'); return; }
  if(!window.AudioContext && !window.webkitAudioContext){
    state.webAudioState='unsupported'; state.webAudioError='AudioContext unavailable'; log('SAFARI_MP2PCM: AudioContext unavailable');  return;
  }
  const decNS=window['mpg123-decoder'];
  if(!decNS || !decNS.MPEGDecoder){
    state.webAudioState='unsupported'; state.webAudioError='local mpg123-decoder unavailable'; log('SAFARI_MP2PCM: local mpg123-decoder.min.js unavailable');  return;
  }
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) throw new Error('AudioContext unavailable');
    let ctx=state.webAudioCtx;
    if (!ctx || ctx.state === 'closed') {
      ctx = new Ctx({latencyHint:'interactive'});
    }
    state.webAudioCtx = ctx;
	
    state.webAudioState='connecting'; state.audioUrl=url;
    state.audioAbortController=new AbortController();
    state.audioPcmQueue=[]; state.audioQueuedSeconds=0; state.audioNextTime=0;
    state.audioScheduledDuration=0; state.audioPlayedEstimate=0; state.audioVideoAnchor=0;
    state.audioStarted=false; state.audioStreamDone=false; state.audioChunks=0; state.audioDecodedSamples=0;
    state.audioRate=0; state.audioChannels=0; state.audioSyncDrift=0; state.audioSyncResets=0;
    state.audioWorkletInFlight=0; state.audioWorkletWaiters=[]; state.audioWorkletReady=false;
    state.audioRingSeconds=0; state.audioWorkletUnderruns=0; state.audioWorkletOverflows=0;
    state.audioCtxRate=ctx.sampleRate; state.audioResampleActive=false; state.audioResampleAcc=0; state.audioResamplePos=0; state.audioMpegBuffer=new Uint8Array(0); state.audioMpegFrames=0; state.audioMpegResyncBytes=0;
    log('SAFARI_MP2PCM: AudioContext created state='+ctx.state);
    log('SAFARI_MP2PCM: AudioContext rate='+ctx.sampleRate+'Hz (playback clock)');
    state.audioCtxRate=ctx.sampleRate;
    try{ await ctx.resume(); log('SAFARI_MP2PCM: AudioContext resume state='+ctx.state); }catch(e){ log('SAFARI_MP2PCM: AudioContext resume failed '+e.name+': '+e.message); }
    if(seq!==state.seq) return;

    // AudioWorklet is unavailable for the normal http://192.168.1.1 UI on iOS
    // because AudioWorklet requires a secure context. Prefer it when available,
    // otherwise use a ScriptProcessorNode fallback with the same bounded PCM queue.
    state.webAudioBackend='none';
    const workletUrl='/luci-static/resources/iptvweb/audio-worklet/pcm-player-worklet.js';
    if(ctx.audioWorklet && ctx.audioWorklet.addModule && window.AudioWorkletNode){
      try{
        await ctx.audioWorklet.addModule(workletUrl);
        if(seq!==state.seq) return;
        const node=new AudioWorkletNode(ctx,'iptvweb-pcm-player',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
        node.connect(ctx.destination);
        node.port.onmessage=e=>{
          const d=e.data||{};
          if(seq!==state.seq) return;
          if(d.type==='ready'){
            state.audioWorkletReady=true;
            log('SAFARI_MP2PCM: AudioWorklet ready rate='+((d.sampleRate||0))+'Hz ring='+((d.capacityFrames||0)/Math.max(1,d.sampleRate||44100)).toFixed(2)+'s');
          }else if(d.type==='ack'){
            state.audioWorkletInFlight=Math.max(0,state.audioWorkletInFlight-1);
            notifyWorkletSpace();
          }else if(d.type==='resetAck'){
            state.audioWorkletInFlight=Math.max(0,state.audioWorkletInFlight-Number(d.dropped||0));
            notifyWorkletSpace();
          }else if(d.type==='stats'){
            state.audioRingSeconds=Number(d.queuedSeconds||0);
            state.audioWorkletUnderruns=Number(d.underruns||0);
            state.audioWorkletOverflows=Number(d.overflows||0);
            state.audioPlaying=!!d.started;
          }else if(d.type==='started'){
            state.audioPlaying=true;
            log('SAFARI_MP2PCM: AudioWorklet playback started at audioTime='+Number(d.time||0).toFixed(3));
          }else if(d.type==='underrun'){
            state.audioWorkletUnderruns=Number(d.count||state.audioWorkletUnderruns+1);
            log('SAFARI_MP2PCM: AudioWorklet underrun #'+state.audioWorkletUnderruns);
          }else if(d.type==='overflow'){
            state.audioWorkletOverflows=Number(d.count||state.audioWorkletOverflows+1);
            log('SAFARI_MP2PCM: AudioWorklet ring overflow #'+state.audioWorkletOverflows);
          }
        };
        state.webAudioWorkletNode=node;
        await new Promise(resolve=>{
          const deadline=performance.now()+1000;
          const tick=()=>{ if(state.audioWorkletReady || performance.now()>deadline) resolve(); else setTimeout(tick,10); };
          tick();
        });
        if(!state.audioWorkletReady) throw new Error('AudioWorklet did not become ready');
        state.webAudioBackend='worklet';
      }catch(e){
        try{ if(state.webAudioWorkletNode){state.webAudioWorkletNode.disconnect();state.webAudioWorkletNode.port.close();} }catch(_e){}
        state.webAudioWorkletNode=null;
        state.audioWorkletReady=false;
        log('SAFARI_MP2PCM: AudioWorklet unavailable ('+e.message+'); using ScriptProcessor fallback');
      }
    } else {
      log('SAFARI_MP2PCM: AudioWorklet unavailable; using ScriptProcessor fallback');
    }
    if(state.webAudioBackend==='none'){
      // Plain HTTP iOS Safari cannot use AudioWorklet. Do not use
      // ScriptProcessor here: its main-thread callback is sensitive to the
      // fetch/decoder event loop and was causing repeated PCM underruns.
      state.webAudioBackend='buffersource';
      state.audioScheduleQueue=[];
      state.audioSchedulePendingSamples=0;
      state.audioScheduleCursor=0;
      state.audioScheduleStarted=false;
      state.audioScheduledSources=[];
      state.audioQueuedSeconds=0;
      state.audioRingSeconds=0;
      log('SAFARI_MP2PCM: AudioBufferSource fallback ready scheduler=audio-thread');
    }

    const decoder=new decNS.MPEGDecoder({enableGapless:false});
    state.webAudioDecoder=decoder;
    await decoder.ready;
    if(seq!==state.seq) return;
    state.webAudioState='streaming';
    log('SAFARI_MP2PCM: decoder ready; continuous MPEG frame stream');

    const r=await fetch(url,{cache:'no-store',signal:state.audioAbortController.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(!r.body || !r.body.getReader) throw new Error('ReadableStream unavailable');
    const reader=r.body.getReader();
    state.audioReader=reader;
	while(seq===state.seq){
	  const part=await reader.read();
	  if(part.done){ state.audioStreamDone=true; break; }
	  if(!part.value || !part.value.byteLength) continue;
	  
	  // ★ 直接把收到的字节喂给 decoder，不要前端自己切帧
	  const decodeWall0=performance.now();
	  let result;
	  try{
		result = decoder.decode(part.value);   // ← 用 decode 而不是 decodeFrame
		state.audioDecodeCalls++;
	  }catch(e){
		state.audioDecodeErrors++;
		log('SAFARI_MP2PCM: decode ERROR #'+state.audioDecodeErrors+' '+e.name+': '+e.message+' bytes='+part.value.byteLength);
		continue;
	  }
	  state.audioDecodeWallMs+=performance.now()-decodeWall0;
	  state.audioLastDecodeWall=performance.now();
	  
	  if(!result || !result.samplesDecoded){
		state.audioDecodeEmpty++;
		continue;
	  }
	  
	  const samples = result.samplesDecoded;
	  const rate = result.sampleRate || 48000;
	  const channels = result.channelData.length;
	  state.audioRate=rate; state.audioChannels=channels;
	  state.audioChunks++; state.audioDecodedSamples+=samples;
	  
	  // 交错 L/R
	  const stereo=new Float32Array(samples*2);
	  const left = result.channelData[0] || null;
	  const right = result.channelData[1] || left;
	  for(let i=0;i<samples;i++){
		stereo[i*2]   = left  ? (left[i]||0)  : 0;
		stereo[i*2+1] = right ? (right[i]||0) : stereo[i*2];
	  }
	  
	  const ctxRate=ctx.sampleRate;
	  if(state.audioChunks===1){
		log('SAFARI_MP2PCM: first batch decoded='+rate+'Hz ch='+channels+' ctx='+ctxRate+'Hz resample='+(rate!==ctxRate?'on':'off')+' samples='+samples+' inputBytes='+part.value.byteLength);
	  }
	  
	  let outStereo=stereo, outSamples=samples;
	  if(rate!==ctxRate){
		state.audioResampleActive=true;
		const rs=resampleStereoLinear(stereo,samples,rate,ctxRate);
		if(!rs.pcm || !rs.frames) continue;
		outStereo=rs.pcm; outSamples=rs.frames;
	  }
	  
	  // ... 原有的 worklet/buffersource 入队逻辑保持不变
	  if(state.webAudioBackend==='worklet'){
		await waitForWorkletSpace(seq);
		state.audioWorkletInFlight++;
		const chunkId=state.audioChunks;
		state.webAudioWorkletNode.port.postMessage({type:'pcm',id:chunkId,data:outStereo.buffer,samples:outSamples,rate:ctxRate},[outStereo.buffer]);

	  }else if(state.webAudioBackend==='buffersource'){
		state.audioScheduleQueue.push({pcm:outStereo,samples:outSamples});

		state.audioQueuedSeconds=state.audioSchedulePendingSamples/ctxRate;
		state.audioRingSeconds=state.audioQueuedSeconds;
		if(!state.audioStarted && (state.safariAudioOnly || state.firstFrameAt || state.firstPlayingAt) && state.audioQueuedSeconds>=0.75) startAudioWorkletClock(seq);
		if(state.audioStarted) scheduleBufferSourceQueue(seq);
	  }
	  
	  // 诊断日志（保留）
	  const nowDiag=performance.now();
	  if(nowDiag-(state.audioLastDiagWall||0)>=1000){
		const dt=Math.max(0.001,(nowDiag-(state.audioLastDiagWall||nowDiag))/1000);
		const dc=state.audioChunks-(state.audioLastDiagChunks||0);
		const ds=state.audioDecodedSamples-(state.audioLastDiagSamples||0);
		log('SAFARI_MP2PCM: PCMSTAT chunks='+state.audioChunks+' dChunks='+dc+' samples='+state.audioDecodedSamples+' dSamples='+ds+' rate='+rate+' ctx='+ctxRate+' queue='+state.audioQueuedSeconds.toFixed(3)+'s decodeCalls='+state.audioDecodeCalls+' empty='+state.audioDecodeEmpty+' errors='+state.audioDecodeErrors+' wallSamplesPerSec='+(ds/dt).toFixed(0));
		state.audioLastDiagWall=nowDiag; state.audioLastDiagChunks=state.audioChunks; state.audioLastDiagSamples=state.audioDecodedSamples;
	  }
	}
    try{ reader.releaseLock(); }catch(e){}
    state.audioReader=null;
    if(state.audioStreamDone) log('SAFARI_MP2PCM: stream ended');
  }catch(e){
    if(seq!==state.seq || e.name==='AbortError') return;
    state.webAudioState='decode-error'; state.webAudioError=e.name+': '+e.message; state.audioError='WebAudioMP2PCMError';
    log('SAFARI_MP2PCM: '+e.name+': '+e.message); 
  }
}

function startAudioWorkletClock(seq){
  if(seq!==state.seq || !state.webAudioCtx || state.audioStarted) return;
  if(state.webAudioBackend==='worklet' && !state.webAudioWorkletNode) return;
  if(state.webAudioBackend!=='worklet' && state.webAudioBackend!=='scriptprocessor' && state.webAudioBackend!=='buffersource') return;
  const v=$('video');
  if(!state.safariAudioOnly && !state.firstFrameAt && !state.firstPlayingAt) return;
  state.audioVideoAnchor=Number(v.currentTime||0);
  const startAt=state.webAudioCtx.currentTime+state.audioStartDelay;
  state.audioStartContextTime=startAt;
  state.audioStarted=true; state.audioPlaying=false; state.audioPendingStart=false;
  state.audioStartedAt=performance.now()+state.audioStartDelay*1000;
  if(state.webAudioBackend==='worklet' && state.webAudioWorkletNode){
    state.webAudioWorkletNode.port.postMessage({type:'start',startAt});
  }else if(state.webAudioBackend==='buffersource'){
    state.audioScheduleCursor=startAt;
    state.audioScheduleStarted=true;
    scheduleBufferSourceQueue(seq);
  }
  log('SAFARI_MP2PCM: audio anchor video='+state.audioVideoAnchor.toFixed(3)+' startDelay='+state.audioStartDelay.toFixed(2)+'s backend='+state.webAudioBackend);
}

function scheduleBufferSourceQueue(seq){
  if(seq!==state.seq || !state.webAudioCtx || state.webAudioBackend!=='buffersource' || !state.audioScheduleStarted) return;
  const ctx=state.webAudioCtx;
  const now=ctx.currentTime;
  if(state.audioScheduleCursor < now+0.02) state.audioScheduleCursor=now+0.02;
  while(state.audioScheduleQueue.length){
    const q=state.audioScheduleQueue.shift();
    const frames=q.samples|0;
    if(!frames) continue;
    const ab=ctx.createBuffer(2,frames,ctx.sampleRate);
    const left=new Float32Array(frames), right=new Float32Array(frames);
    for(let i=0;i<frames;i++){
      const l=q.pcm[i*2]||0;
      left[i]=l; right[i]=q.pcm[i*2+1]||l;
    }
    ab.copyToChannel(left,0); ab.copyToChannel(right,1);
    const src=ctx.createBufferSource();
    src.buffer=ab; src.connect(ctx.destination);
    const at=Math.max(state.audioScheduleCursor,ctx.currentTime+0.01);
    try{ src.start(at); }catch(e){ state.audioDecodeErrors++; try{src.disconnect();}catch(_){}; continue; }
    state.audioScheduledSources.push(src);
    src.onended=()=>{ try{src.disconnect();}catch(_){}; const i=state.audioScheduledSources.indexOf(src); if(i>=0) state.audioScheduledSources.splice(i,1); };
    state.audioScheduleCursor=at+frames/ctx.sampleRate;
    state.audioSchedulePendingSamples=Math.max(0,state.audioSchedulePendingSamples-frames);
  }
  state.audioQueuedSeconds=Math.max(0,state.audioScheduleCursor-ctx.currentTime);
  state.audioRingSeconds=state.audioQueuedSeconds;
}

function schedulePcmQueue(seq){
  startAudioWorkletClock(seq);
}

function audioSyncTick(seq){
  if(seq!==state.seq || !state.webAudioCtx || !state.audioStarted) return;
  const ctx=state.webAudioCtx, v=$('video');
  const now=ctx.currentTime;
  const audioPos=Math.max(0,now-state.audioStartContextTime);
  const videoPos=Math.max(0,(Number(v.currentTime||0)-state.audioVideoAnchor));
  const drift=audioPos-videoPos;
  state.audioPlayedEstimate=audioPos; state.audioSyncDrift=drift;
  // The Worklet owns the real audio clock. Do not repeatedly flush the ring
  // buffer for ordinary network jitter; only re-anchor after a large error.
  const sinceReset=state.audioLastResetAt ? (performance.now()-state.audioLastResetAt)/1000 : 999;
  if(Math.abs(drift)>0.80 && sinceReset>=5){
    log('SAFARI_AVSYNC: drift='+drift.toFixed(3)+'s video='+videoPos.toFixed(3)+' audio='+audioPos.toFixed(3)+' ring='+state.audioRingSeconds.toFixed(3)+'s');
    resetAudioSchedule(seq,'drift');
  }
  
}

function resetAudioSchedule(seq,reason){
  if(seq!==state.seq || !state.webAudioCtx) return;
  const ctx=state.webAudioCtx;
  state.audioVideoAnchor=Number($('video').currentTime||0);
  const startAt=ctx.currentTime+0.10;
  state.audioStartContextTime=startAt;
  state.audioLastResetAt=performance.now();
  state.audioSyncResets++;
  if(state.webAudioBackend==='worklet' && state.webAudioWorkletNode){
    state.webAudioWorkletNode.port.postMessage({type:'reset',startAt});
  }else if(state.webAudioBackend==='scriptprocessor'){
    state.audioPcmQueue=[]; state.audioPcmOffset=0; state.audioQueuedSeconds=0; state.audioRingSeconds=0;
  }else if(state.webAudioBackend==='buffersource'){
    for(const src of state.audioScheduledSources||[]){ try{src.stop();}catch(_){} try{src.disconnect();}catch(_){} }
    state.audioScheduledSources=[]; state.audioScheduleQueue=[]; state.audioSchedulePendingSamples=0;
    state.audioScheduleCursor=ctx.currentTime+0.10; state.audioQueuedSeconds=0; state.audioRingSeconds=0; state.audioScheduleStarted=true;
  }
  if(reason) log('SAFARI_AVSYNC: '+state.webAudioBackend+' re-anchor reason='+reason+' reset#='+state.audioSyncResets);
}

function bufferAhead(v){
  try{
    if(!v.buffered || !v.buffered.length) return 0;

    const t = v.currentTime;
    for(let i = 0; i < v.buffered.length; i++){
      const s = v.buffered.start(i);
      const e = v.buffered.end(i);
      if(t >= s - 0.05 && t <= e + 0.05){
        return Math.max(0, e - t);
      }
    }

    // 启动时 currentTime=0，但首个缓冲区间从一个小的正时间开始。
    // 这是启动缓冲长度的估算，不表示 currentTime 到缓冲区之间连续可播。
    if(t <= 0.05){
      const s = v.buffered.start(0);
      const e = v.buffered.end(0);
      if(s >= 0 && s <= 0.5 && e >= s){
        return Math.max(0, e - s);
      }
    }

    return 0;
  }catch(e){
    return 0;
  }
}

  state.webAudioBuffer=null;
  state.audioPcmQueue=[]; state.audioPcmOffset=0; state.audioQueuedSeconds=0; state.audioNextTime=0; state.audioScheduledDuration=0;
  state.audioPlayedEstimate=0; state.audioVideoAnchor=0; state.audioStartContextTime=0; state.audioLastResetAt=0; state.audioStarted=false; state.audioStreamDone=false;

function installGestureHooks(){
  if(state.gestureHooksInstalled) return;
  state.gestureHooksInstalled=true;
  const v=$('video');
  // Desktop Chrome's native video click action can race a custom toggle.
  // Use the page's click handler there; retain native controls on other browsers.
  // Keep native controls available on desktop Chrome (fullscreen/volume/seek).
  v.controls=true;
  // Let native controls work, but take ownership of clicks on the video surface.
  // Chrome's built-in video click action can run after pointerup and undo our toggle
  // (observed pause -> play about 300 ms later). Handle only click in capture phase
  // and cancel the browser default for the picture area.
  v.addEventListener('click',event=>{
    if(event.target!==v) return;
    if(v.controls && Number.isFinite(event.offsetY) && event.offsetY > v.clientHeight-44) return;
    event.preventDefault();
    event.stopPropagation();
    if(typeof event.stopImmediatePropagation==='function') event.stopImmediatePropagation();
    const now=performance.now();
    if(now-state.diagLastSurfaceToggleAt<350) return;
    state.diagLastSurfaceToggleAt=now;
    log('VIDEO surface click-captured offset='+event.offsetX+','+event.offsetY+' defaultPrevented='+event.defaultPrevented);
    toggleVideoPlayback();
  },{capture:true});

function toggleVideoPlayback(){

    }else{
      state.userPaused=false;
      try{ const q=ctx.resume(); if(q&&q.catch) q.catch(()=>{}); }catch(e){}
      setStatus('广播播放中');
    }
    return;
  }
  if(!p){
    // Fallback for a browser-native media element if the player object is not ready.
    if(v.paused || v.ended){ try{ const q=v.play(); if(q&&q.catch) q.catch(()=>{}); }catch(e){} }
    else { try{ v.pause(); }catch(e){} }
    return;
  }
  const shouldPause=!v.paused && !v.ended;
  if(shouldPause){
    state.userPaused=true;
    try{ p.pause(); }catch(e){}
    try{ v.pause(); }catch(e){}
    if(state.webAudioCtx && state.safariAudioRoute==='mpeg-audio'){
      try{ const q=state.webAudioCtx.suspend(); if(q&&q.catch) q.catch(()=>{}); }catch(e){}
    }
    setStatus('已暂停');
    return;
  }
  state.userPaused=false;
  if(state.webAudioCtx && state.safariAudioRoute==='mpeg-audio'){
    try{ const q=state.webAudioCtx.resume(); if(q&&q.catch) q.catch(()=>{}); }catch(e){}
  }
  try{
    const q=p.play();
    if(q&&q.catch) q.catch(()=>{ try{ const r=v.play(); if(r&&r.catch) r.catch(()=>{}); }catch(e){} });
  }catch(e){ try{ const q=v.play(); if(q&&q.catch) q.catch(()=>{}); }catch(_){} }
}

function attachVideoDiagnostics(v, seq){
  v.autoplay=false; v.removeAttribute('autoplay');
  if(state.diagEnabled) videoSnapshot('attachVideoDiagnostics');
  ['loadstart','loadedmetadata','loadeddata','canplay','canplaythrough','play','playing','pause','waiting','stalled','seeking','seeked','ended','emptied','abort','durationchange','resize','error'].forEach(name=>{
    v.addEventListener(name,()=>{if(seq===state.seq && state.diagEnabled) videoSnapshot('event='+name);});
  });
  v.addEventListener('pause', ()=>{
    if(seq!==state.seq || !state.playIssuedAt || state.stopping) return;
    state.userPaused=true;
  });
  v.addEventListener('play', ()=>{
    if(seq!==state.seq) return;
    state.userPaused=false;
  });
  v.addEventListener('playing', ()=>{
    if(seq!==state.seq) return;
    if(!state.firstPlayingAt) state.firstPlayingAt=performance.now();
    scheduleWebAudioAfterVideo(seq);
    if(!state.audioSyncTimer) state.audioSyncTimer=setInterval(()=>audioSyncTick(seq),500);
  });
  if('requestVideoFrameCallback' in v){
    const cb=(now, meta)=>{
      if(seq!==state.seq) return;
      state.lastFrame={wall:performance.now(),mediaTime:Number(meta.mediaTime),presentedFrames:Number(meta.presentedFrames||0)};
      if(meta.width) state.lastVideoWidth=meta.width;
      if(meta.height) state.lastVideoHeight=meta.height;
      if(!state.firstFrameAt){
        state.firstFrameAt=performance.now();
        log('VIDEO first requestVideoFrameCallback mediaTime='+Number(meta.mediaTime).toFixed(3)+' presentedFrames='+Number(meta.presentedFrames||0)+' size='+v.videoWidth+'x'+v.videoHeight);
        scheduleWebAudioAfterVideo(seq);
      }
      const frameWall=performance.now();
      if(state.diagEnabled && (!state.diagLastFrameLog || frameWall-state.diagLastFrameLog>5000)){
        state.diagLastFrameLog=frameWall;
        log('VIDEO frame mediaTime='+Number(meta.mediaTime).toFixed(3)+' presentedFrames='+Number(meta.presentedFrames||0)+' size='+v.videoWidth+'x'+v.videoHeight+' readyState='+v.readyState);
      }
      v.requestVideoFrameCallback(cb);
    };
    v.requestVideoFrameCallback(cb);
  }
}

function isIOSSafari(){
  const ua=navigator.userAgent||'';
  const ios=/iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

// Safari Video-only fallback: filter MPEG-TS before mpegts.js sees it.
// We keep PAT/PMT/PCR/video packets, rewrite PMT to remove audio ES entries,
// and drop all other elementary-stream packets. This is intentionally a
// browser-side custom loader experiment; the normal A/V path is untouched.
function makeSafariVideoOnlyLoader(onOpenGopBootstrap){
  const Base=mpegts.BaseLoader;
  if(!Base) throw new Error('mpegts.BaseLoader unavailable');
  const K=Base;

  // ===== Open GOP → IDR bitstream rewriter (放在 SafariVideoOnlyLoader class 前面) =====

  class BitReader {
    constructor(buf) { this.buf = buf; this.bytePos = 0; this.bitPos = 0; }
	get pos() { return this.bytePos * 8 + this.bitPos; } 
    readBit() {
      const byte = this.buf[this.bytePos];
      const bit = (byte >> (7 - this.bitPos)) & 1;
      this.bitPos++;
      if (this.bitPos === 8) { this.bitPos = 0; this.bytePos++; }
      return bit;
    }
    readBits(n) { let v = 0; for (let i = 0; i < n; i++) v = (v * 2) + this.readBit(); return v >>> 0; }
    readUEG() {
      let zeros = 0;
      while (this.readBit() === 0) { zeros++; if (zeros > 32) throw new Error('UEG overflow'); }
      if (zeros === 0) return 0;
      return (Math.pow(2, zeros) - 1 + this.readBits(zeros));
    }
    //readSEG() { const v = this.readUEG(); return (v % 2 === 0) ? -(v / 2) : (v + 1) / 2; }
	readSEG() { const v = this.readUEG(); if (v === 0) return 0; return (v % 2 === 0) ? (v / 2) : -(v + 1) / 2; }
  }

  class BitWriter {
    constructor() { this.bytes = []; this.cur = 0; this.bitPos = 0; }
    writeBit(b) {
      this.cur = (this.cur << 1) | (b & 1);
      this.bitPos++;
      if (this.bitPos === 8) { this.bytes.push(this.cur); this.cur = 0; this.bitPos = 0; }
    }
    writeBits(v, n) { for (let i = n - 1; i >= 0; i--) this.writeBit((v >>> i) & 1); }
    writeUEG(codeNum) {
      const v = codeNum + 1;
      let nbits = 0, temp = v;
      while (temp > 1) { temp >>= 1; nbits++; }
      for (let i = 0; i < nbits; i++) this.writeBit(0);
      this.writeBits(v, nbits + 1);
    }
    copyBitsFrom(reader, n) {
      let v = 0;
      for (let i = 0; i < n; i++) { const b = reader.readBit(); this.writeBit(b); v = (v << 1) | b; }
      return v >>> 0;
    }
    copyUEGFrom(reader) {
      let zeros = 0;
      while (true) {
        const b = reader.readBit(); this.writeBit(b);
        if (b === 1) break;
        zeros++; if (zeros > 32) throw new Error('UEG overflow');
      }
      if (zeros === 0) return 0;
      return (Math.pow(2, zeros) - 1 + this.copyBitsFrom(reader, zeros));
    }
    padToByte() { while (this.bitPos !== 0) this.writeBit(0); }
    toBytes() { this.padToByte(); return Uint8Array.from(this.bytes); }
  }

  function removeEmulationPrevention(src) {
    const out = new Uint8Array(src.length);
    let w = 0;
    let zeroCount = 0;

    for (let i = 0; i < src.length; i++) {
      const b = src[i];

      // 只删除合法的 emulation_prevention_three_byte：
      // 00 00 03 00/01/02/03
      if (
        zeroCount >= 2 &&
        b === 0x03 &&
        i + 1 < src.length &&
        src[i + 1] <= 0x03
      ) {
        // 这里不要清零 zeroCount：
        // RBSP 中前面的 00 00 与下一个字节仍然连续。
        continue;
      }

      out[w++] = b;

      if (b === 0x00) {
        zeroCount++;
      } else {
        zeroCount = 0;
      }
    }

    return out.slice(0, w);
  }

  function addEmulationPrevention(src) {
    // 最坏情况下约每两个 00 插入一个 03。
    const out = new Uint8Array(
      src.length + Math.ceil(src.length / 2) + 16
    );

    let w = 0;
    let zeroCount = 0;

    for (let i = 0; i < src.length; i++) {
      const b = src[i];

      if (zeroCount >= 2 && b <= 0x03) {
        out[w++] = 0x03;

        // 关键：插入 03 后，EBSP 中的连续 00 已被打断。
        zeroCount = 0;
      }

      out[w++] = b;

      if (b === 0x00) {
        zeroCount++;
      } else {
        zeroCount = 0;
      }
    }

    return out.slice(0, w);
  }

  function skipScalingList(reader, size) {
    let lastScale = 8, nextScale = 8;
    for (let j = 0; j < size; j++) {
      if (nextScale !== 0) {
        const deltaScale = reader.readSEG();
        nextScale = (lastScale + deltaScale + 256) % 256;
      }
      lastScale = (nextScale === 0) ? lastScale : nextScale;
    }
  }

  const H264_HIGH_PROFILES = [100,110,122,244,44,83,86,118,128,138,139,134,135];

  function parseSPS(spsNalWithHeader) {
    const rbsp = removeEmulationPrevention(spsNalWithHeader.subarray(1));
    const r = new BitReader(rbsp);
    const profileIdc = r.readBits(8);
    r.readBits(8); r.readBits(8);
    r.readUEG();
    let chromaFormatIdc = 1, separateColourPlane = false;
    if (H264_HIGH_PROFILES.indexOf(profileIdc) !== -1) {
      chromaFormatIdc = r.readUEG();
      if (chromaFormatIdc === 3) separateColourPlane = !!r.readBit();
      r.readUEG(); r.readUEG(); r.readBit();
      if (r.readBit()) {
        const count = (chromaFormatIdc !== 3) ? 8 : 12;
        for (let i = 0; i < count; i++) if (r.readBit()) skipScalingList(r, i < 6 ? 16 : 64);
      }
    }
    const frameNumBits = r.readUEG() + 4;
    const picOrderCntType = r.readUEG();
    if (picOrderCntType === 0) {
      r.readUEG();
    } else if (picOrderCntType === 1) {
      r.readBit(); r.readSEG(); r.readSEG();
      const numRef = r.readUEG();
      for (let i = 0; i < numRef; i++) r.readSEG();
    }
    r.readUEG(); r.readBit(); r.readUEG(); r.readUEG();
    const frameMbsOnly = !!r.readBit();
    return { profileIdc, chromaFormatIdc, separateColourPlane, frameNumBits, frameMbsOnly };
  }

  function isISliceNal(buf, nal) {
    const type = buf[nal.start] & 0x1f;
    if (type !== 1 && type !== 5) return false;
    try {
      const prefix = removeEmulationPrevention(buf.subarray(nal.start + 1, Math.min(nal.start + 17, nal.end)));
      const r = new BitReader(prefix);
      r.readUEG();
      const sliceType = r.readUEG();
      return (sliceType % 5) === 2;
    } catch (e) { return false; }
  }

  function rewriteSliceToIDR(nal, sps) {
    if (!nal || nal.length < 2) {
      throw new Error('invalid slice NAL');
    }

    /*
     * scanAnnexBNals() 可能把 Annex-B 的 trailing_zero_8bits
     * 包含在 nal 的末尾。
     *
     * 这些尾部 00 不属于 slice 的核心 EBSP/RBSP，不能参与
     * remove/addEmulationPrevention，否则大量连续 00 会导致
     * 插入大量 03，使 NAL 异常膨胀。
     */
    let coreEnd = nal.length;

    while (
      coreEnd > 1 &&
      nal[coreEnd - 1] === 0x00
    ) {
      coreEnd--;
    }

    const trailingZeroBytes = nal.length - coreEnd;

    if (coreEnd < 2) {
      throw new Error(
        'invalid slice NAL core: nalBytes=' + nal.length +
        ', trailingZeros=' + trailingZeroBytes
      );
    }

    /*
     * 不包含：
     *   - NAL header（nal[0]）
     *   - NAL 末尾的 trailing_zero_8bits
     */
    const rbsp = removeEmulationPrevention(
      nal.subarray(1, coreEnd)
    );

    if (!rbsp.length) {
      throw new Error('empty slice RBSP');
    }

    const r = new BitReader(rbsp);

    const firstMb = r.readUEG();
    const sliceType = r.readUEG();
    const ppsId = r.readUEG();

    let colourPlaneId = 0;

    if (sps.separateColourPlane) {
      colourPlaneId = r.readBits(2);
    }

    // 丢弃原 non-IDR slice 的 frame_num。
    r.readBits(sps.frameNumBits);

    /*
     * CCTV3 的 SPS 日志显示 frameMbsOnly=false，
     * 所以必须先读取并保留 field_pic_flag /
     * bottom_field_flag，然后才能插入 idr_pic_id。
     */
    let fieldPicFlag = 0;
    let bottomFieldFlag = 0;

    if (!sps.frameMbsOnly) {
      fieldPicFlag = r.readBit();

      if (fieldPicFlag) {
        bottomFieldFlag = r.readBit();
      }
    }

    const w = new BitWriter();

    w.writeUEG(firstMb);
    w.writeUEG(sliceType);
    w.writeUEG(ppsId);

    if (sps.separateColourPlane) {
      w.writeBits(colourPlaneId, 2);
    }

    // 合成 IDR 的 frame_num 设置为 0。
    w.writeBits(0, sps.frameNumBits);

    if (!sps.frameMbsOnly) {
      w.writeBit(fieldPicFlag);

      if (fieldPicFlag) {
        w.writeBit(bottomFieldFlag);
      }
    }

    /*
     * IDR slice_header 比 non-IDR 多出 idr_pic_id。
     * 这里使用 0。
     */
    w.writeUEG(0);

    /*
     * 将剩余的原始 RBSP bit 原样复制。
     * 注意：这里只复制核心 RBSP，不包含已经剥离的尾部零字节。
     */
    const totalBits = rbsp.length * 8;

    while (r.pos < totalBits) {
      w.writeBit(r.readBit());
    }

    const newRbsp = addEmulationPrevention(
      w.toBytes()
    );

    /*
     * 输出结构：
     *
     *   新 NAL header
     *   + 新核心 EBSP
     *   + 原样保留的 trailing_zero_8bits
     */
    const out = new Uint8Array(
      1 + newRbsp.length + trailingZeroBytes
    );

    let nalRefIdc = nal[0] & 0x60;

    // IDR slice 的 nal_ref_idc 不能为 0。
    if (nalRefIdc === 0) {
      nalRefIdc = 0x60;
    }

    // 保留 forbidden_zero_bit，NAL type 改为 5。
    out[0] =
      (nal[0] & 0x80) |
      nalRefIdc |
      0x05;

    out.set(newRbsp, 1);

    // 尾部零字节原样接回，不重新进行防竞争处理。
    if (trailingZeroBytes > 0) {
      out.set(
        nal.subarray(coreEnd),
        1 + newRbsp.length
      );
    }

    /*
     * I→IDR 会因为新增 idr_pic_id、字节对齐和防竞争字节而
     * 产生少量长度变化，但不应增加几十、几百甚至几千字节。
     */
    const delta = out.length - nal.length;

    if (Math.abs(delta) > 64) {
      throw new Error(
        'suspicious NAL growth while converting I to IDR: ' +
        nal.length + 'B→' + out.length + 'B' +
        ', coreBytes=' + coreEnd +
        ', trailingZeros=' + trailingZeroBytes +
        ', frameNumBits=' + sps.frameNumBits
      );
    }

    return out;
  }

  function scanAnnexBNals(buf, from) {
    const starts = [];
    let i = from; const n = buf.length;
    while (i < n - 2) {
      if (buf[i] === 0 && buf[i+1] === 0 && buf[i+2] === 1) {
        let scStart = i;
        if (i > from && buf[i-1] === 0) scStart = i - 1;
        starts.push({ scStart, dataStart: i + 3 });
        i += 3;
      } else i++;
    }
    const nals = [];
    for (let k = 0; k < starts.length; k++) {
      const cur = starts[k];
      const nextScStart = (k + 1 < starts.length) ? starts[k+1].scStart : n;
      nals.push({ scStart: cur.scStart, start: cur.dataStart, end: nextScStart,
        scBytes: buf.subarray(cur.scStart, cur.dataStart) });
    }
    return nals;
  }

  function parsePesHeader(pes) {
    if (pes.length < 9) return null;
    if (!(pes[0] === 0 && pes[1] === 0 && pes[2] === 1)) return null;
    const pesPacketLength = (pes[4] << 8) | pes[5];
    const pesHeaderDataLength = pes[8];
    const esStart = 9 + pesHeaderDataLength;
    if (esStart > pes.length) return null;
    return { pesPacketLength, esStart };
  }

  function extractTSPayload(pkt) {
    const afc = (pkt[3] >> 4) & 0x3;
    let offset = 4;
    if (afc === 2) return null;
    if (afc === 3) offset = 5 + pkt[4];
    else if (afc !== 1) return null;
    if (offset >= 188) return null;
    return pkt.subarray(offset, 188);
  }

  function rebuildFirstPacket(originalPkt, newPayload) {
    const afc0 = (originalPkt[3] >> 4) & 0x3;
    const payloadOffset = (afc0 === 3) ? (5 + originalPkt[4]) : 4;
    const capacity = 188 - payloadOffset;

    if (newPayload.length >= capacity) {
      const out = new Uint8Array(188);
      out.set(originalPkt.subarray(0, payloadOffset), 0);
      out.set(newPayload.subarray(0, capacity), payloadOffset);
      return { packet: out, consumed: capacity };
    }
    const out = new Uint8Array(188);
    out[0] = 0x47; out[1] = originalPkt[1]; out[2] = originalPkt[2];
    const avail = newPayload.length;
    if (afc0 === 3) {
      const origAfLen = originalPkt[4];
      const shortfall = capacity - avail;
      const newAfLen = origAfLen + shortfall;
      out[3] = originalPkt[3];
      out[4] = newAfLen;
      out.set(originalPkt.subarray(5, 5 + origAfLen), 5);
      for (let i = 0; i < shortfall; i++) out[5 + origAfLen + i] = 0xFF;
      out.set(newPayload, 5 + newAfLen);
    } else {
      out[3] = (originalPkt[3] & 0x0f) | 0x30;
      const afLen = 183 - avail;
      out[4] = afLen;
      if (afLen > 0) { out[5] = 0x00; for (let i = 0; i < afLen - 1; i++) out[6 + i] = 0xFF; }
      out.set(newPayload, 5 + afLen);
    }
    return { packet: out, consumed: avail };
  }

  function buildSubsequentPacket(pid, payload, offset) {
    const out = new Uint8Array(188);
    out[0] = 0x47; out[1] = (pid >> 8) & 0x1f; out[2] = pid & 0xff;
    const remaining = payload.length - offset;
    if (remaining >= 184) {
      out[3] = 0x10;
      out.set(payload.subarray(offset, offset + 184), 4);
      return { packet: out, consumed: 184 };
    }
    const L = 183 - remaining;
    out[3] = 0x30; out[4] = L;
    if (L > 0) { out[5] = 0x00; for (let i = 0; i < L - 1; i++) out[6 + i] = 0xFF; }
    out.set(payload.subarray(offset, offset + remaining), 5 + L);
    return { packet: out, consumed: remaining };
  }

  class PesAssembler {
    constructor() { this.packets = []; this.started = false; }
    push(pkt, pusi) {
      let completed = null;
      if (pusi) {
        if (this.started && this.packets.length) completed = this._finish();
        this.started = true;
        this.packets = [pkt];
      } else if (this.started) {
        this.packets.push(pkt);
      }
      return completed;
    }
    flush() {
      if (this.started && this.packets.length) {
        const r = this._finish();
        this.packets = []; this.started = false;
        return r;
      }
      return null;
    }
    _finish() {
      const pkts = this.packets;
      const parts = []; let total = 0;
      for (const p of pkts) {
        const pl = extractTSPayload(p);
        if (pl) { parts.push(pl); total += pl.length; }
      }
      const pesBytes = new Uint8Array(total);
      let off = 0;
      for (const p of parts) { pesBytes.set(p, off); off += p.length; }
      return { packets: pkts, pesBytes };
    }
  }

  function readOpenGopPesPts90k(pesBytes) {
    if (!pesBytes || pesBytes.length < 14) {
      return null;
    }

    if (
      pesBytes[0] !== 0x00 ||
      pesBytes[1] !== 0x00 ||
      pesBytes[2] !== 0x01
    ) {
      return null;
    }

    const ptsDtsFlags = (pesBytes[7] >> 6) & 0x03;

    // 10 = 只有 PTS；11 = PTS + DTS。
    if (ptsDtsFlags !== 2 && ptsDtsFlags !== 3) {
      return null;
    }

    const p0 = pesBytes[9];
    const p1 = pesBytes[10];
    const p2 = pesBytes[11];
    const p3 = pesBytes[12];
    const p4 = pesBytes[13];

    // 使用乘法而不是 32 位移位，因为 PTS 是 33 位。
    return (
      ((p0 >>> 1) & 0x07) * 1073741824 + // 2^30
      p1 * 4194304 +                     // 2^22
      ((p2 >>> 1) & 0x7f) * 32768 +      // 2^15
      p3 * 128 +                         // 2^7
      ((p4 >>> 1) & 0x7f)
    );
  }

  function openGopPtsDelta90k(value, anchor) {
    const MOD = 8589934592; // 2^33
    const HALF = 4294967296;

    let delta = value - anchor;

    if (delta > HALF) {
      delta -= MOD;
    } else if (delta < -HALF) {
      delta += MOD;
    }

    return delta;
  }

  class OpenGopFixer {
    constructor(pid, logFn, opts) {
      this.pid = pid;
      this.log = logFn || (() => {});
      this.dryRun = !!(opts && opts.dryRun);
      this.assembler = new PesAssembler();
      this.lastSpsParams = null;
	  this.spsSignature = null;
      this.outCc = 0;
      this.ccInited = false;
      //this.stats = { rewritten: 0, wouldRewrite: 0, passthrough: 0, failed: 0 };
	  this.stats = { rewritten: 0, wouldRewrite: 0, passthrough: 0, failed: 0, droppedLeading: 0 };
	  
      // ★ 新增：只启动一次的状态
      this.bootstrapped = false;         // 是否已经做过唯一一次 I→IDR 转换
      this.frameNumOffset = 0;           // 永久生效的 frame_num 常量偏移	  
	  this.onBootstrap = (opts && opts.onBootstrap) || null;   // 新增
	  // 启动用合成 IDR 的 PTS。
  	  this.bootstrapPts90k = null;

	  // 在启动阶段删除 PTS 早于 bootstrap I 图像的 Open-GOP leading pictures。
	  this.leadingDropActive = false;
	  this.leadingDropCount = 0;
    }

    feed(pkt) {
      const pusi = !!(pkt[1] & 0x40);
      const completed = this.assembler.push(pkt, pusi);
      if (!completed) return [];
      return this._emit(completed);
    }

    flush() {
      const completed = this.assembler.flush();
      return completed ? this._emit(completed) : [];
    }

	_emit({ packets, pesBytes }) {

	_handleVideoPacket(pkt, pid, out) {
	  const pusi = (pkt[1] & 0x40) !== 0;
	  const cc = pkt[3] & 0x0f;
	  const afc = (pkt[3] >> 4) & 3;
	  const hasPayload = afc === 1 || afc === 3;
	  const tei = (pkt[1] & 0x80) !== 0;

	  const rai =
		(afc === 2 || afc === 3) &&
		(pkt[4] || 0) >= 1 &&
		(pkt[5] & 0x40) !== 0;

	  const hasDiscontinuity =
		(afc === 2 || afc === 3) &&
		(pkt[4] || 0) >= 1 &&
		(pkt[5] & 0x80) !== 0;

	  const nalTypes = this._scanH264Nals(pkt, pid);
	  this._diagLogVideoPts(pkt, pid, cc, pusi);

	  if (nalTypes.indexOf(5) !== -1 && this._diagH264IdrLogCount < 50) {
		this._diagH264IdrLogCount++;
		log('SAFARI_H264_IDR: PID=' + pid + ' CC=' + cc + ' PUSI=' + pusi +
		  ' gate=' + this._videoStartedPids.has(pid));
	  }

	  if (nalTypes.length && this._diagH264LogCount < 120) {
		const name = t => ({
		  1: 'SLICE', 2: 'DPA', 3: 'DPB', 4: 'DPC', 5: 'IDR', 6: 'SEI',
		  7: 'SPS', 8: 'PPS', 9: 'AUD', 13: 'SPSEXT', 14: 'PREFIX', 19: 'AUX', 20: 'EXT'
		}[t] || ('NAL' + t));

		log('SAFARI_H264: PID=' + pid + ' CC=' + cc + ' PUSI=' + pusi + ' RAI=' + rai +
		  ' gate=' + this._videoStartedPids.has(pid) +
		  ' NAL=' + nalTypes.map(t => name(t) + '(' + t + ')').join(','));
		this._diagH264LogCount++;
	  }

	  if (hasPayload) {
		const lastCC = this._lastVideoCC.get(pid);
		if (lastCC !== undefined && !hasDiscontinuity && cc !== lastCC &&
			cc !== ((lastCC + 1) & 0x0f) && this._diagCcGapCount < 20) {
		  log('SAFARI_TS_FILTER: video CC GAP PID=' + pid +
			' previous=' + lastCC + ' current=' + cc +
			' expected=' + ((lastCC + 1) & 0x0f));
		  this._diagCcGapCount++;
		}
		this._lastVideoCC.set(pid, cc);
	  }

	  if (tei) {
		this._videoStartedPids.delete(pid);
		if (this._h264PendingPesByPid) this._h264PendingPesByPid.delete(pid);
		return;
	  }

	  if (!this._videoStartedPids.has(pid)) {

		let canOpen = pusi && hasPayload;
		let reason = 'PUSI';

		if (isH264) {
		  const hasSps = nalTypes.indexOf(7) !== -1;
		  const hasPps = nalTypes.indexOf(8) !== -1;
		  const hasIdr = nalTypes.indexOf(5) !== -1;

		  canOpen = pusi && hasPayload && hasSps && hasPps && (hasIdr || rai);
		  reason = hasIdr ? 'IDR+SPS/PPS' : 'RAI+SPS/PPS';
		}

		if (!canOpen) {
		  this._diagSkippedVideoUntilPusi++;
		  return;
		}

		if (isH264 && rai && nalTypes.indexOf(5) === -1 && !this._startupHoldNeeded) {
		  this._startupHoldNeeded = true;
		  this._startupHoldPid = pid;
		  this._startupHoldSince = 0;
		  this._startupFirstPts = null;
		  this._startupMinPtsDelta = 0;
		  this._startupMaxPtsDelta = 0;

		  log('SAFARI_TS_FILTER: no-IDR startup hold armed PID=' + pid + ' targetSpanMs=2500');
		}

		this._videoStartedPids.add(pid);
		log('SAFARI_TS_FILTER: video PES gate opened PID=' + pid +
		  ' CC=' + cc + ' PUSI=' + pusi + ' RAI=' + rai +
		  ' reason=' + reason + ' skipped=' + this._diagSkippedVideoUntilPusi);
	  }

	  out.push(pkt);
	  this._diagOutPackets++;

	  if (!this._diagVideoPackets.has(pid)) {
		this._diagVideoPackets.add(pid);
		log('SAFARI_TS_FILTER: first forwarded video packet PID=' + pid +
		  ' CC=' + cc + ' PUSI=' + pusi + ' RAI=' + rai);
	  }
	}	
    _filterChunk(chunk){

        const need=b.length>=188*3 ? 3 : 2;
        const last=b.length-188*(need-1);
        for(let i=0;i<last;i++){
          if(b[i]!==0x47 || b[i+188]!==0x47) continue;
          if(need===3 && b[i+376]!==0x47) continue;

        }

        this._syncLocked=true;

      if(!this._syncLocked && this._buffer.length>188*3) this._buffer=this._buffer.slice(-188*2);

        const pid=((pkt[1]&0x1f)<<8)|pkt[2];

          const rp=this._rewritePMTPacket(pkt);
          if(rp) out.push(rp);
          continue;
        }
		const isVideoPid = (this._videoPids.size && this._videoPids.has(pid)) || (this._videoPid != null && pid === this._videoPid);
		if (isVideoPid) {
		  let fixer = this._openGopFixers.get(pid);
		  if (!fixer) {
  		    //fixer = new OpenGopFixer(pid, (msg) => log('SAFARI_OPENGOP: ' + msg), { dryRun: this._openGopDryRun });
			fixer = new OpenGopFixer(pid, (msg) => log('SAFARI_OPENGOP: ' + msg), {
							dryRun: this._openGopDryRun,
							onBootstrap: (originalFn) => {          // ← 新增
								if (onOpenGopBootstrap) {              // 闭包直接拿到 makeSafariVideoOnlyLoader 的参数
									try { onOpenGopBootstrap(pid, originalFn); } catch (e) {}
								}
							}
			});

		  }

		  let fixedPkts;
		  try {
		    fixedPkts = fixer.feed(pkt);
		  } catch (e) {
		    log('SAFARI_OPENGOP: feed() threw PID=' + pid + ' err=' + (e && e.message));

		  }

		  for (const fp of fixedPkts) {
		    this._handleVideoPacket(fp, pid, out);
		  }

		}
        if(this._pcrPid!=null && pid===this._pcrPid){ out.push(pkt); continue; }
      }
      const total=out.length*188;
      const now=performance.now();
      if(state.diagEnabled && now-this._diagLastStats>5000){
        this._diagLastStats=now;
        log('SAFARI_TS_FILTER: stats inBytes='+this._diagInBytes+' outBytes='+this._outBytes+' videoPackets='+this._diagOutPackets+' sync='+!!this._syncLocked+' pmtPid='+this._pmtPid+' videoPids='+Array.from(this._videoPids).join(',')+' pcrPid='+this._pcrPid+' bufferedBytes='+this._buffer.length);
		for (const [fpid, fx] of this._openGopFixers) {
		  log('SAFARI_OPENGOP: stats PID=' + fpid +
			  ' rewritten=' + fx.stats.rewritten +
			  ' wouldRewrite=' + fx.stats.wouldRewrite +
			  ' passthrough=' + fx.stats.passthrough +
 	          ' failed=' + fx.stats.failed);
		}

    }
    _payload(pkt){
      const afc=(pkt[3]>>4)&3;
      let o=4;
      if(afc===0 || afc===2) return null;

	_readPesTimestamp33(pl, offset, prefix) {
	  if (offset + 5 > pl.length) return null;

	  const b0 = pl[offset];
	  const b1 = pl[offset + 1];
	  const b2 = pl[offset + 2];
	  const b3 = pl[offset + 3];
	  const b4 = pl[offset + 4];

	  if (
		((b0 >> 4) & 0x0f) !== prefix ||
		(b0 & 1) === 0 ||
		(b2 & 1) === 0 ||
		(b4 & 1) === 0
	  ) {
		return null;
	  }

	  return (b0 & 0x0e) * 536870912 +
			 b1 * 4194304 +
			 (b2 & 0xfe) * 16384 +
			 b3 * 128 +
			 (b4 & 0xfe) / 2;
	}

	_readVideoPesTimestamps(pkt) {
	  const pl = this._payload(pkt);
	  if (!pl || !(pkt[1] & 0x40) || pl.length < 9) return null;

	  if (
		pl[0] !== 0x00 || pl[1] !== 0x00 || pl[2] !== 0x01 ||
		pl[3] < 0xe0 || pl[3] > 0xef ||
		(pl[6] & 0xc0) !== 0x80
	  ) {
		return null;
	  }

	  const flags = (pl[7] >> 6) & 3;
	  if (flags !== 2 && flags !== 3) return null;

	  const headerLength = pl[8] || 0;
	  if (headerLength < 5) return null;

	  const pts = this._readPesTimestamp33(
		pl, 9, flags === 3 ? 3 : 2
	  );
	  if (pts == null) return null;

	  let dts = null;
	  if (flags === 3 && headerLength >= 10) {
		dts = this._readPesTimestamp33(pl, 14, 1);
	  }

	  return { flags, pts, dts };
	}
	
    _trackStartupPts(data) {
      const wrap = 8589934592; // 2^33
      const half = 4294967296; // 2^32

      for (let off = 0; off + 188 <= data.length; off += 188) {
        const pkt = data.subarray(off, off + 188);

        if (pkt[0] !== 0x47 || !(pkt[1] & 0x40)) continue;

        const pid = ((pkt[1] & 0x1f) << 8) | pkt[2];
        if (pid !== this._startupHoldPid) continue;

        const ts = this._readVideoPesTimestamps(pkt);
        if (!ts) continue;

        if (this._startupFirstPts === null) {
          this._startupFirstPts = ts.pts;
          this._startupMinPtsDelta = 0;
          this._startupMaxPtsDelta = 0;
          continue;
        }

        // 处理 33-bit PTS 回绕；允许 B 帧导致 PTS 前后重排。
        let d = ts.pts - this._startupFirstPts;
        if (d > half) d -= wrap;
        else if (d < -half) d += wrap;

        if (d < this._startupMinPtsDelta) {
          this._startupMinPtsDelta = d;
        }
        if (d > this._startupMaxPtsDelta) {
          this._startupMaxPtsDelta = d;
        }
      }

      if (this._startupFirstPts === null) return 0;
      return this._startupMaxPtsDelta - this._startupMinPtsDelta;
    }

    _takeStartupHold() {
      const out = new Uint8Array(this._startupHoldBytes);
      let offset = 0;

      for (let i = 0; i < this._startupHoldParts.length; i++) {
        const part = this._startupHoldParts[i];
        out.set(part, offset);
        offset += part.length;
      }

      this._startupHoldParts.length = 0;
      this._startupHoldBytes = 0;
      return out;
    }
	
	_diagLogVideoPts(pkt, pid, cc, pusi) {
	  if (!pusi || this._diagVideoPtsCount >= 120) return;

	  const ts = this._readVideoPesTimestamps(pkt);
	  if (!ts) return;

	  const previous = this._diagVideoPtsLast.get(pid);

	  const delta33 = (current, last) => {
		let d = current - last;
		const half = 4294967296;
		const wrap = 8589934592;
		if (d > half) d -= wrap;
		else if (d < -half) d += wrap;
		return d;
	  };

	  const ptsDelta = previous
		? delta33(ts.pts, previous.pts)
		: null;

	  const dtsDelta =
		ts.dts != null && previous && previous.dts != null
		  ? delta33(ts.dts, previous.dts)
		  : null;

	  this._diagVideoPtsLast.set(pid, {
		pts: ts.pts,
		dts: ts.dts
	  });

		'SAFARI_VIDEO_TS: PID=' + pid +
		' CC=' + cc +
		' flags=' + (ts.flags === 3 ? 'PTS+DTS' : 'PTS_ONLY') +
		' PTS90k=' + Math.round(ts.pts) +
		' PTSdeltaMs=' +
		  (ptsDelta == null ? 'first' : (ptsDelta / 90).toFixed(3)) +
		' DTS90k=' +
		  (ts.dts == null ? 'none' : Math.round(ts.dts)) +
		' DTSdeltaMs=' +
		  (dtsDelta == null ? 'n/a' : (dtsDelta / 90).toFixed(3))
	  );

	_scanH264Nals(pkt, pid) {
	  let pl = this._payload(pkt);
	  if (!pl || !pl.length) return [];

	  // PUSI 视频包从 PES header 开始；扫描 ES payload，不扫描 PES header。
	  if (pkt[1] & 0x40) {
		if (
		  pl.length < 9 ||
		  pl[0] !== 0x00 || pl[1] !== 0x00 || pl[2] !== 0x01 ||
		  pl[3] < 0xe0 || pl[3] > 0xef
		) {
		  return [];
		}

		const esStart = 9 + pl[8];
		if (esStart > pl.length) return [];
		pl = pl.subarray(esStart);
	  }

	  const tail = this._h264TailByPid.get(pid) || new Uint8Array(0);
	  const all = new Uint8Array(tail.length + pl.length);
	  all.set(tail, 0);
	  all.set(pl, tail.length);

	  const types = [];
	  for (let i = 0; i < all.length;) {
		let nal = -1;

		// 先检查 4 字节 Annex-B start code，再检查 3 字节。
		if (
		  i + 4 < all.length &&
		  all[i] === 0 && all[i + 1] === 0 &&
		  all[i + 2] === 0 && all[i + 3] === 1
		) {
		  nal = i + 4;
		} else if (
		  i + 3 < all.length &&
		  all[i] === 0 && all[i + 1] === 0 && all[i + 2] === 1
		) {
		  nal = i + 3;
		}

		if (nal >= 0 && nal < all.length) {
		  types.push(all[nal] & 0x1f);
		  i = nal + 1;
		} else {
		  i++;
		}
	  }

	  // start code 可能跨 TS 包，保留尾部字节供下一包拼接检查。
	  this._h264TailByPid.set(
		pid,
		all.slice(Math.max(0, all.length - 4))
	  );

	  return types;
	}	
    _inspectPAT(pkt){
      if(!(pkt[1]&0x40)) return;
      const pl=this._payload(pkt); if(!pl||pl.length<9) return;
      const ptr=pl[0]; const s=1+ptr;
      if(pl.length<s+8 || pl[s]!==0x00) return;
      const sectionLen=((pl[s+1]&0x0f)<<8)|pl[s+2];
      const end=Math.min(pl.length,s+3+sectionLen);
      for(let i=s+8;i+3<end-4;i+=4){
        const pn=(pl[i]<<8)|pl[i+1], pid=((pl[i+2]&0x1f)<<8)|pl[i+3];
