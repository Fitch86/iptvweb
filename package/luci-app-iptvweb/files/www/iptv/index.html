<header><h1>OpenWrt IPTV <span class="small">rev4.2 硬分轨 + TS/PCR 显微镜版</span></h1><button id="refresh">刷新</button><button id="jumpLive">跳到最新帧</button><button id="reinit">重新初始化</button><button id="copyLog">复制日志</button><button id="stopBtn">⏹ 停止并断开</button><button id="clearLog">清空日志</button><label class="small">显微镜 <select id="microMode"><option value="full" selected>完整</option><option value="compact">精简</option></select></label><label class="small">播放模式 <select id="avMode"><option value="av" selected>A/V 正常</option><option value="video">Video-only</option></select></label><button id="probeCaps">设备解码能力</button><span id="status" class="small"></span></header>

<script src="/luci-static/resources/iptvweb/mpegts.min.js"></script>
<script>
let lastMediaInfoKey='';
const state={items:[],groups:[],active:'',current:null,player:null,seq:0,playStarted:0,firstFrameAt:0,firstPlayingAt:0,last:{t:0,wall:0},stats:{},log:[],waitingStart:0,stallStart:0,waitingCount:0,stallCount:0,playIssuedAt:0,startTimer:0,userGestureCount:0,recoveries:0,lastRecoveryAt:0,lastProgressWall:0,lastProgressTime:0,playingSince:0,stuckTimer:0,gestureHooksInstalled:false,mediaInfo:null,lastErrorText:'',audioDecodeError:false,ts:{pmts:[],pts:0,dts:0,continuity:0,privateAudio:[]},timeline:[],timelineTimer:0,lastFrame:null,classification:'STARTING',classificationReason:'',classificationAt:0,userPaused:false,stopping:false,diagTimer:0,avMode:'av',caps:null,rawTsProbe:null};
const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(line,name){const re=new RegExp(name+'="([^"]*)"','i'),m=line.match(re);return m?m[1]:''}
function parseM3U(text){const lines=text.split(/\r?\n/),out=[];let info=null;for(const raw of lines){const line=raw.trim();if(!line)continue;if(line.startsWith('#EXTINF:'))info=line;else if(info&&!line.startsWith('#')){out.push({name:info.split(',').slice(1).join(',')||attr(info,'tvg-name'),id:attr(info,'tvg-id'),logo:attr(info,'tvg-logo'),group:attr(info,'group-title')||'其他',url:line});info=null}}return out}
function streamUrl(ch){try{const u=new URL(ch.url,location.href);const m=u.pathname.match(/^\/udp\/([^:]+):(\d+)$/);if(m){const proxy=new URL('/cgi-bin/iptvweb-stream',window.location.href);proxy.searchParams.set('group',m[1]);proxy.searchParams.set('port',m[2]);return proxy.href;}}catch(e){}return new URL(ch.url,window.location.href).href}
function renderGroups(){const html=state.groups.map(g=>{const list=state.items.filter(x=>x.group===g);const open=state.active===g;return `<section class="group ${open?'open':''}" data-g="${esc(g)}"><div class="group-head"><span class="arrow">${open?'▼':'▶'}</span><span>${esc(g)}</span><span class="count">${list.length}</span></div><div class="group-channels">${list.map(x=>`<div class="channel ${state.current===x?'active':''}" data-i="${state.items.indexOf(x)}">${x.logo?`<img src="${esc(x.logo)}" loading="lazy" alt="">`:''}<div class="name">${esc(x.name)}</div></div>`).join('')}</div></section>`}).join('');$('groups').innerHTML=html;document.querySelectorAll('.group-head').forEach(h=>h.onclick=()=>{const g=h.parentElement.dataset.g;state.active=state.active===g?'':g;renderGroups()});document.querySelectorAll('.channel').forEach(x=>x.onclick=()=>play(state.items[+x.dataset.i]))}
function stopDiagTimers(){if(state.stuckTimer){clearInterval(state.stuckTimer);state.stuckTimer=0}if(state.timelineTimer){clearInterval(state.timelineTimer);state.timelineTimer=0}if(state.diagTimer){clearInterval(state.diagTimer);state.diagTimer=0}}
function startDiagTimer(seq){if(state.diagTimer)clearInterval(state.diagTimer);state.diagTimer=setInterval(()=>{if(seq!==state.seq){clearInterval(state.diagTimer);state.diagTimer=0;return}if($('video').paused){stopDiagTimers();return}updateDiag()},500)}
function stopPlayer(){ if(window.IPTVWebRev42) IPTVWebRev42.stop('player stop');if(state.startTimer){clearTimeout(state.startTimer);state.startTimer=0}stopDiagTimers();if(state.player){try{state.player.pause()}catch(e){}try{state.player.unload()}catch(e){}try{state.player.detachMediaElement()}catch(e){}try{state.player.destroy()}catch(e){}state.player=null}}
function setStatus(t){$('status').textContent=t||''}
function avMode(){return $('avMode')&&$('avMode').value==='video'?'video':'av'}
async function probeCapabilities(){
 const v=$('video'); const tests=[
  ['H264 1080p25','video/mp4; codecs=\"avc1.640028\"',1920,1080,25,5000000],
  ['HEVC 4K50 Main10','video/mp4; codecs=\"hvc1.2.1.L180.B0\"',3840,2160,50,20000000],
  ['MP3 48k stereo','audio/mpeg; codecs=\"mp3\"',0,0,0,192000]
 ];
 const out=[]; out.push('UA='+navigator.userAgent);
 for(const [name,mime,w,h,fps,br] of tests){let ct='';try{ct=v.canPlayType(mime)}catch(e){ct='ERR:'+e.message}let mc='n/a';try{if(navigator.mediaCapabilities&&navigator.mediaCapabilities.decodingInfo&&w){const r=await navigator.mediaCapabilities.decodingInfo({type:'media-source',video:{contentType:mime,width:w,height:h,bitrate:br,framerate:fps}});mc=JSON.stringify({supported:r.supported,powerEfficient:r.powerEfficient,smooth:r.smooth})}}catch(e){mc='ERR:'+e.message}out.push(name+' | canPlayType='+ct+' | MediaCapabilities='+mc)}
 state.caps=out; out.forEach(x=>log('CAPS '+x)); setStatus('已记录设备解码能力'); updateDiag();
}
function rel(){return state.playStarted?((performance.now()-state.playStarted)/1000).toFixed(3):'0.000'}
function log(msg){const line='['+rel()+'s] '+msg;console.log('[IPTV rev4.2] '+line);state.log.push(line);if(state.log.length>180)state.log.shift();$('log').textContent=state.log.join('\n');$('log').scrollTop=$('log').scrollHeight}
function rangeText(r){try{if(!r||!r.length)return '-';let a=[];for(let i=0;i<r.length;i++)a.push(r.start(i).toFixed(3)+'-'+r.end(i).toFixed(3));return a.join(' | ')}catch(e){return 'ERR:'+e.message}}
function getInternalSourceBuffers(){
  try{
    const p=state.player;if(!p)return '-';
    const cands=[p._mseController,p.mseController,p._mseController&&p._mseController._sourceBuffers,p._mseController&&p._mseController.sourceBuffers,p._sourceBuffers,p.sourceBuffers];
    for(const c of cands){
      if(!c)continue;
      if(typeof c.length==='number' && c.length>0 && typeof c.item==='function'){
        let a=[];for(let i=0;i<c.length;i++){const x=c.item(i);a.push((x&&x.type)||'?'+':'+rangeText(x&&x.buffered))}return a.join(' || ');
      }
      if(Array.isArray(c) && c.length){return c.map(x=>(x&&x.type||'?')+':'+rangeText(x&&x.buffered)).join(' || ')}
      if(typeof c==='object'){
        const vals=Object.values(c).filter(x=>x&&typeof x==='object'&&'buffered' in x);if(vals.length)return vals.map(x=>(x.type||'?')+':'+rangeText(x.buffered)).join(' || ');
      }
    }
  }catch(e){return 'ERR:'+e.message}
  return '-';
}
function installGestureHooks(){
 if(state.gestureHooksInstalled)return; state.gestureHooksInstalled=true;
 const v=$('video');
 v.addEventListener('click',()=>gesturePlay('video-click'),{passive:true});
 v.addEventListener('pointerdown',()=>log('USER_GESTURE pointerdown'),{passive:true});
 v.addEventListener('touchstart',()=>log('USER_GESTURE touchstart'),{passive:true});
 const b=$('recoverBtn'); if(b)b.onclick=()=>gesturePlay('recovery-button');
}
function gesturePlay(reason){
 const v=$('video'),p=state.player; state.userGestureCount++; state.userPaused=false; log('RESUME_DIAGNOSTICS reason='+reason); if(p){startTimelineMicroscope(state.seq);startStuckMonitor(state.seq);startDiagTimer(state.seq);}
 log('USER_GESTURE '+reason+' paused='+v.paused+' current='+v.currentTime.toFixed(3)+' readyState='+v.readyState+' bufferAhead='+bufferAhead(v).toFixed(3));
 if(!p)return;
 try{const q=p.play();if(q&&q.then)q.then(()=>log('GESTURE player.play resolved')).catch(e=>log('GESTURE player.play rejected '+e.name+': '+e.message));}catch(e){log('GESTURE player.play threw '+e.name+': '+e.message)}
 if(v.paused){try{const q=v.play();if(q&&q.then)q.then(()=>log('GESTURE video.play resolved')).catch(e=>log('GESTURE video.play rejected '+e.name+': '+e.message));}catch(e){log('GESTURE video.play threw '+e.name+': '+e.message)}}
}
function recoverPlayback(reason){
 const v=$('video'),p=state.player,now=performance.now(); if(!p)return;
 if(state.recoveries>=2){log('RECOVERY skipped limit=2 reason='+reason);return}if(now-state.lastRecoveryAt<3000){log('RECOVERY skipped cooldown reason='+reason);return}
 state.lastRecoveryAt=now;state.recoveries++;state.lastProgressWall=now;state.lastProgressTime=v.currentTime||0;
 log('RECOVERY #'+state.recoveries+' reason='+reason+' paused='+v.paused+' current='+v.currentTime.toFixed(3)+' readyState='+v.readyState+' bufferAhead='+bufferAhead(v).toFixed(3));
 try{const q=p.play();if(q&&q.then)q.then(()=>log('RECOVERY player.play resolved')).catch(e=>log('RECOVERY player.play rejected '+e.name+': '+e.message));}catch(e){log('RECOVERY player.play threw '+e.name+': '+e.message)}
 if(v.paused){try{const q=v.play();if(q&&q.then)q.then(()=>log('RECOVERY video.play resolved')).catch(e=>log('RECOVERY video.play rejected '+e.name+': '+e.message));}catch(e){log('RECOVERY video.play threw '+e.name+': '+e.message)}}
}
function startStuckMonitor(seq){
 if(state.stuckTimer)clearInterval(state.stuckTimer); state.lastProgressWall=performance.now();state.lastProgressTime=$('video').currentTime||0;state.playingSince=0;
 state.stuckTimer=setInterval(()=>{if(seq!==state.seq){clearInterval(state.stuckTimer);return}const v=$('video'),now=performance.now();if(v.paused||v.ended){state.lastProgressWall=now;state.lastProgressTime=v.currentTime||0;return}const t=v.currentTime||0;if(t>state.lastProgressTime+0.05){state.lastProgressTime=t;state.lastProgressWall=now;return}if(state.playingSince&&now-state.playingSince>=2500&&now-state.lastProgressWall>=2000){recoverPlayback('time-not-advancing');state.playingSince=now}},500);
}
function bufferAhead(v){try{if(!v.buffered.length)return 0;const t=v.currentTime;for(let i=0;i<v.buffered.length;i++){if(t>=v.buffered.start(i)-0.05&&t<=v.buffered.end(i)+0.05)return Math.max(0,v.buffered.end(i)-t)}return 0}catch(e){return 0}}
function classifyTimeline(){
 const v=$('video'), now=performance.now(), tl=state.timeline;
 let reason=''; let c='STARTING';
 const recent=tl.filter(x=>now-x.wall<4000);
 const first=tl.length?tl[0]:null, last=tl.length?tl[tl.length-1]:null;
 const decoded=state.stats&&Number(state.stats.decodedFrames||0);
 const buffered=bufferAhead(v);
 const playing=!!state.firstPlayingAt && !v.paused && !v.ended;
 if(state.userPaused && v.paused){c='USER PAUSED';reason='用户主动暂停，已停止诊断采样';state.classification=c;state.classificationReason=reason;state.classificationAt=now;return c;}
 const delta=last&&first?(last.currentTime-first.currentTime):0;
 const frameDelta=last&&first?(last.presentedFrames-first.presentedFrames):0;
 if(v.error||state.lastErrorText){c='MEDIA ERROR';reason=state.lastErrorText||('video.error code='+v.error.code);}
 else if(state.audioDecodeError){c='AUDIO DECODE ERROR';reason='mpegts ERROR/diagnostic indicates audio decode failure';}
 else if(playing && recent.length>=2){
   const a=recent[0],b=recent[recent.length-1];
   const dt=(b.wall-a.wall)/1000, ct=b.currentTime-a.currentTime, pf=b.presentedFrames-a.presentedFrames;
   if(dt>=1.5 && ct<0.08){
     if(pf<=0 && decoded>10){c='DECODER/TIMELINE STUCK';reason='currentTime 与 presentedFrames 均基本不推进';}
     else {c='TIMELINE STUCK';reason='buffer/数据存在，但 currentTime 在持续播放状态下不推进';}
   } else if(ct>0.08 || pf>0){c='PLAYBACK OK';reason='currentTime / video frames 持续推进';}
 }
 if(c==='STARTING' && recent.length>=2){
   const a=recent[0],b=recent[recent.length-1],dt=(b.wall-a.wall)/1000,ct=b.currentTime-a.currentTime;
   if(dt>=1.5 && ct<0.08 && buffered>1){c='BUFFER GROWING NO PLAY';reason='bufferAhead 在增长，但播放时间线未推进';}
 }
 if(c==='STARTING' && state.firstPlayingAt){c='PLAY STARTED';reason='已触发 playing，继续观察时间线';}
 if(c==='STARTING' && state.mediaInfo){c='MEDIA DETECTED';reason='已识别音视频编码，等待持续推进';}
 state.classification=c;state.classificationReason=reason;state.classificationAt=now;
 return c;
}
function timelineSample(source){
 const v=$('video'), now=performance.now(), st=state.stats||{};
 let presented=0, mediaTime=null;
 if(state.lastFrame){presented=Number(state.lastFrame.presentedFrames||0);mediaTime=Number(state.lastFrame.mediaTime);}
 const item={wall:now,rel:state.playStarted?(now-state.playStarted)/1000:0,currentTime:Number(v.currentTime||0),mediaTime:isFinite(mediaTime)?mediaTime:null,presentedFrames:presented,decodedFrames:Number(st.decodedFrames||0),droppedFrames:Number(st.droppedFrames||0),buffered:rangeText(v.buffered),seekable:rangeText(v.seekable),ahead:bufferAhead(v),readyState:v.readyState,paused:v.paused,source:source||'timer'};
 state.timeline.push(item);if(state.timeline.length>240)state.timeline.shift();
 return item;
}
function startTimelineMicroscope(seq){
 if(state.timelineTimer)clearInterval(state.timelineTimer);
 state.timeline=[];state.lastFrame=null;
 state.timelineTimer=setInterval(()=>{if(seq!==state.seq){clearInterval(state.timelineTimer);return}timelineSample('250ms');classifyTimeline();updateDiag()},250);
}
function timelineSummary(){
 const a=state.timeline;if(a.length<2)return '样本不足';
 const first=a[0],last=a[a.length-1],dt=(last.wall-first.wall)/1000,dc=last.currentTime-first.currentTime,df=last.presentedFrames-first.presentedFrames,dd=last.droppedFrames-first.droppedFrames;
 return 'Δwall='+dt.toFixed(2)+'s Δcurrent='+dc.toFixed(3)+'s Δpresented='+df+' Δdecoded='+((last.decodedFrames-first.decodedFrames)||0)+' Δdropped='+dd;
}
function updateDiag(){
 const rawTsLine=state.rawTsProbe?'RAW TS/PCR packets='+state.rawTsProbe.packets+' bytes='+state.rawTsProbe.bytes+' continuity='+state.rawTsProbe.continuity+' syncLoss='+state.rawTsProbe.syncLoss:'';

 const v=$('video'); let b='-',s='-';try{b=rangeText(v.buffered);s=rangeText(v.seekable)}catch(e){}
 const now=performance.now(), dt=state.last.wall?(now-state.last.wall)/1000:0, rate=state.last.wall?(v.currentTime-state.last.t)/Math.max(dt,0.001):0;state.last={t:v.currentTime,wall:now};
 const ahead=bufferAhead(v), cls=classifyTimeline();
 const mi=state.mediaInfo||{};const vc=mi.videoCodec||'-',ac=mi.audioCodec||'-';
 const frame=state.lastFrame||{};
 $('diag').textContent=
  '【状态】 '+cls+(state.classificationReason?' | '+state.classificationReason:'')+'\n'+
  '【编码】 V='+(vc||'-')+' / A='+(ac||'-')+' | '+(mi.width||v.videoWidth||'-')+'x'+(mi.height||v.videoHeight||'-')+' @ '+(mi.fps||'-')+'fps | audio='+(mi.hasAudio?'yes':'?')+' '+(mi.audioSampleRate||'-')+'Hz/'+(mi.audioChannelCount||'-')+'ch\n'+
  '【时间线】 current='+(isFinite(v.currentTime)?v.currentTime.toFixed(3):'NaN')+' | buffered='+b+' | seekable='+s+' | ahead='+(isFinite(ahead)?ahead.toFixed(3):'-')+'s\n'+
  '【显微镜】 mediaTime='+(frame.mediaTime!=null?Number(frame.mediaTime).toFixed(3):'-')+' | presentedFrames='+(frame.presentedFrames??'-')+' | '+timelineSummary()+'\n'+
  '【A/V】 decoded='+(state.stats.decodedFrames??'-')+' dropped='+(state.stats.droppedFrames??'-')+' | current Δ/s='+(isFinite(rate)?rate.toFixed(3):'-')+' | waiting='+state.waitingCount+' stalled='+state.stallCount+' recover='+state.recoveries+'\n'+
  '【设备能力】 '+(state.caps&&state.caps.length?state.caps.join('\n'):'未测试')+'\n'+
  '【TS】 PTS日志='+state.ts.pts+' DTS日志='+state.ts.dts+' 连续性异常='+state.ts.continuity+' | private-audio PID='+ (state.ts.privateAudio.length?state.ts.privateAudio.join(','):'-')+'\n'+
  '【播放器】 ready='+v.readyState+' network='+v.networkState+' paused='+v.paused+' ended='+v.ended+' duration='+(isFinite(v.duration)?v.duration.toFixed(3):String(v.duration))+' playbackRate='+v.playbackRate+'\n'+
  '【错误】 '+(state.lastErrorText||'-')+'\n'+
  '【mpegts】 speed='+(state.stats.speed??'-')+' KB/s loader='+(state.stats.loaderType??'-')+' | sourceBuffers='+getInternalSourceBuffers();
}
function attachVideoDiagnostics(v,seq){
 v.autoplay=false;
 v.removeAttribute('autoplay');
 ['loadstart','durationchange','loadedmetadata','loadeddata','canplay','canplaythrough','play','playing','pause','waiting','stalled','suspend','progress','seeking','seeked','timeupdate','ratechange','volumechange','ended','emptied','error'].forEach(ev=>v.addEventListener(ev,()=>{
   if(seq!==state.seq)return; const now=performance.now(); let extra='';
   if(ev==='play' && !state.playIssuedAt)extra=' SOURCE=unexpected-autoplay';
   if(ev==='pause' && !state.playIssuedAt && state.startTimer){clearTimeout(state.startTimer);state.startTimer=0;log('CANCEL delayed start: video.pause before explicit play()');}
   if(ev==='pause' && state.playIssuedAt && !state.stopping){state.userPaused=true;stopDiagTimers();log('USER_PAUSED: 停止诊断采样，可直接复制日志；点击播放/恢复后重新采样');}
   if(ev==='play' && state.userPaused){state.userPaused=false;startTimelineMicroscope(seq);startStuckMonitor(seq);startDiagTimer(seq);log('USER_RESUMED: 重新启动诊断采样');}
   if(ev==='waiting'){state.waitingCount++;if(!state.waitingStart)state.waitingStart=now;extra=' current='+v.currentTime.toFixed(3)+' bufferAhead='+bufferAhead(v).toFixed(3)+'s';}
   if(ev==='playing'){state.playingSince=now;state.lastProgressWall=now;state.lastProgressTime=v.currentTime||0;if(state.waitingStart){extra=' waitingRecovered='+((now-state.waitingStart)/1000).toFixed(3)+'s current='+v.currentTime.toFixed(3)+' bufferAhead='+bufferAhead(v).toFixed(3)+'s';state.waitingStart=0;}}
   if(ev==='stalled'){state.stallCount++;if(!state.stallStart)state.stallStart=now;extra=' current='+v.currentTime.toFixed(3)+' bufferAhead='+bufferAhead(v).toFixed(3)+'s';}
   if(ev==='progress')extra=' current='+v.currentTime.toFixed(3)+' bufferAhead='+bufferAhead(v).toFixed(3)+'s';

(function(){
  'use strict';
  window.IPTVWebRev42=window.IPTVWebRev42||{};
  const R=window.IPTVWebRev42;
  R.reset=function(){
    R.stop();
    R.seq=0;
    R.s={wallStart:0,bytes:0,packets:0,syncLoss:0,continuity:0,pids:{},pcr:{},pes:{},windows:[]};
  };
  R.reset();

  function pidOf(p){return ((p[1]&31)<<8)|p[2];}
  function pts5(p,o){
    return (((p[o]&14)*0x20000000)+(p[o+1]*0x400000)+(p[o+2]&254)*0x2000+

  }

    const S=R.s,b=buf instanceof Uint8Array?buf:new Uint8Array(buf);
    S.bytes+=b.length;
    const old=R.carry||new Uint8Array(0),x=new Uint8Array(old.length+b.length);
    x.set(old);x.set(b,old.length);

        let f=-1;
        for(let i=off+1;i+188<=x.length;i++){if(x[i]===0x47){f=i;break}}
        if(f<0){S.syncLoss++;R.carry=x.slice(Math.max(0,x.length-187));return;}
        S.syncLoss++;off=f;
      }
      const p=x.slice(off,off+188);off+=188;S.packets++;
      const pid=pidOf(p),pusi=!!(p[1]&64),afc=(p[3]>>4)&3,cc=p[3]&15;
      let d=4,hasPCR=false;
      if(afc===2||afc===3){
        const al=p[4];d=5+al;
        if(al>=7&&(p[5]&16)){
          const base=((p[6]*0x1000000)+(p[7]<<16)+(p[8]<<8)+p[9])>>>0;
          const ext=((p[10]&1)<<8)|p[11],v=base*300+ext;

          q.last=v;q.count++;hasPCR=true;
        }
      }
      if(afc===1||afc===3){
        const q=S.pids[pid]||(S.pids[pid]={packets:0,starts:0,lastCC:null,continuity:0,tei:0});
        q.packets++;if(pusi)q.starts++;if(p[1]&128)q.tei++;

        }
      }
    }

  }
  R.emit=function(kind){
    if(!R.s)return;

        pcr:c?{first:c.first,last:c.last,count:c.count}:null,
        pes:q?{count:q.count,firstPts:q.firstPts,lastPts:q.lastPts,ptsDelta:q.ptsDelta,

    }

    if(R.timer){clearTimeout(R.timer);R.timer=0}

  };
})();
