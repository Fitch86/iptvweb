<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenWrt IPTV</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:12px 16px;background:#181818;position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center}
header h1{font-size:18px;margin:0}.layout{display:flex;min-height:calc(100vh - 50px)}
#sidebar{width:280px;background:#171717;padding:10px;overflow:auto;border-right:1px solid #292929}.side-title{font-weight:600;padding:4px 8px 10px}.group{margin-bottom:4px}.group-head{display:flex;align-items:center;gap:5px;padding:8px 7px;border-radius:6px;cursor:pointer}.group-head:hover{background:#242424}.group-head .arrow{width:16px;text-align:center}.group-head .count{margin-left:auto;color:#777;font-size:12px}.group-channels{display:none;padding-left:6px}.group.open .group-channels{display:block}.channel{display:flex;align-items:center;gap:8px;padding:7px 7px;border-radius:6px;cursor:pointer}.channel:hover,.channel.active{background:#2a2a2a}.channel img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:4px}.channel .name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}main{flex:1;min-width:0;padding:12px}.player{max-width:1100px;margin:auto;background:#000;border-radius:8px;overflow:hidden}
video{display:block;width:100%;aspect-ratio:16/9;background:#000}.now{padding:10px 2px;font-size:15px}

.small{color:#999;font-size:12px}button{background:#2b6cb0;border:0;color:white;padding:7px 10px;border-radius:5px;cursor:pointer}
@media(max-width:700px){#sidebar{width:180px}.player{border-radius:0}}
</style>
</head>
<body>
<header><h1>OpenWrt IPTV</h1><button id="refresh">刷新</button><span id="status" class="small"></span></header>
<div class="layout">
<aside id="sidebar">
  <div class="side-title">频道</div>
  <div id="groups"></div>
</aside>
<main>
  <div class="player"><video id="video" controls autoplay playsinline></video></div>
  <div class="now" id="now">选择频道开始播放</div>
</main>
</div>

<script src="/luci-static/resources/iptvweb/mpegts.min.js"></script>
<script>
const state={items:[],groups:new Map(),active:'',current:null,player:null};
const $=id=>document.getElementById(id);

function attr(line,name){
  const re=new RegExp(name+'="([^"]*)"','i'),m=line.match(re); return m?m[1]:'';
}
function parseM3U(text){
  const lines=text.split(/\r?\n/), out=[]; let info=null;
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith('#EXTINF:')) info=line;
    else if(info && !line.startsWith('#')){
      out.push({name:info.split(',').slice(1).join(',')||attr(info,'tvg-name'),
        id:attr(info,'tvg-id'),logo:attr(info,'tvg-logo'),
        group:attr(info,'group-title')||'其他',url:line}); info=null;
    }
  } return out;
}
function streamUrl(ch){
  try { const u=new URL(ch.url); const m=u.pathname.match(/^\/udp\/([^:]+):(\d+)/); if(m) return `/cgi-bin/iptvweb-stream?group=${encodeURIComponent(m[1])}&port=${m[2]}`; } catch(e){}
  return ch.url;
}
function renderGroups(){
  const groups=[...state.groups.keys()];
  $('groups').innerHTML=groups.map(g=>{
    const list=state.items.filter(x=>x.group===g);
    return `<section class="group ${state.active===g?'open':''}" data-g="${esc(g)}">
      <div class="group-head"><span class="arrow">${state.active===g?'▼':'▶'}</span><span>${esc(g)}</span><span class="count">${list.length}</span></div>
      <div class="group-channels">${list.map(x=>`<div class="channel ${state.current===x?'active':''}" data-i="${state.items.indexOf(x)}">${x.logo?`<img src="${esc(x.logo)}" loading="lazy">`:''}<div class="name">${esc(x.name)}</div></div>`).join('')}</div>
    </section>`;
  }).join('');
  document.querySelectorAll('.group-head').forEach(h=>h.onclick=()=>{
    const sec=h.parentElement, g=sec.dataset.g;
    state.active=(state.active===g?'':g); renderGroups();
  });
  document.querySelectorAll('.channel').forEach(x=>x.onclick=()=>play(state.items[+x.dataset.i]));
}
function renderChannels(){}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function play(ch){
  state.current=ch; renderGroups();
  if(state.player){try{state.player.destroy()}catch(e){} state.player=null}
  const v=$('video'); v.removeAttribute('src'); v.load();
  $('now').textContent=ch.name;
  const url=streamUrl(ch);
  if(window.mpegts && mpegts.isSupported()){
    state.player=mpegts.createPlayer({type:'mpegts',url:url,isLive:true});
    state.player.attachMediaElement(v); state.player.load(); state.player.play().catch(()=>{});
  } else {
    v.src=url; v.play().catch(()=>{});
  }
}
async function load(){
  $('status').textContent='正在读取 M3U…';
  try{
    await window.__mpegtsReady.catch(()=>{});
    const r=await fetch('/cgi-bin/iptvweb-m3u?'+Date.now(),{cache:'no-store'});
    const text=await r.text(); state.items=parseM3U(text); state.groups=new Map();
    for(const x of state.items) state.groups.set(x.group,true);
    if(!state.active && state.items.length) state.active=state.items[0].group; renderGroups();
    $('status').textContent=`${state.items.length} 个频道`;
  }catch(e){$('status').textContent='M3U 读取失败';console.error(e)}
}
$('refresh').onclick=load; load();
</script>
</body>
</html>
