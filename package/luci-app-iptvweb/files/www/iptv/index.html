<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenWrt IPTV rev4.3</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#111;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
header{min-height:50px;padding:6px 14px;background:#181818;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #292929}
header h1{font-size:16px;margin:0}
.small{color:#999;font-size:12px}
button{background:#2b6cb0;border:0;color:#fff;padding:7px 10px;border-radius:5px;cursor:pointer}
button.danger{background:#7a2e2e}
.toolbar{width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.layout{display:flex;height:calc(100vh - 86px);min-height:0}
#sidebar{width:290px;flex:0 0 290px;background:#171717;overflow:auto;border-right:1px solid #292929;padding:8px}
.side-title{font-weight:600;padding:5px 8px 9px}
.group{margin-bottom:3px}
.group-head{display:flex;align-items:center;gap:5px;padding:8px 7px;border-radius:6px;cursor:pointer;user-select:none}
.group-head:hover{background:#242424}
.group-head .arrow{width:16px;text-align:center}
.group-head .count{margin-left:auto;color:#777;font-size:12px}
.group-channels{display:none;padding-left:5px}
.group.open .group-channels{display:block}
.channel{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:6px;cursor:pointer;min-height:44px}
.channel:hover,.channel.active{background:#2a2a2a}
.channel img{width:34px;height:34px;flex:0 0 34px;object-fit:contain;background:#fff;border-radius:4px}
.channel .name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;min-width:0;min-height:0;padding:12px;display:flex;flex-direction:column;overflow:auto}
.player{width:100%;max-width:1200px;margin:0 auto;background:#000;border-radius:8px;overflow:hidden;position:relative}
video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.now{width:100%;max-width:1200px;margin:9px auto 0;padding:8px 2px;font-size:15px}
.hint{color:#999;font-size:12px;margin-top:3px}
@media(max-width:700px){body{overflow:auto}.layout{height:auto;min-height:calc(100vh - 86px);flex-direction:column}#sidebar{order:2;width:100%;flex:none;max-height:45vh;border-right:0;border-top:1px solid #292929}main{order:1;padding:0 0 8px;overflow:visible}.player{border-radius:0}}
</style>
</head>
<body>
<header>
  <h1>OpenWrt IPTV <span class="small">rev4.3 频道列表修复 + 单变量实验</span></h1>
  <button id="refresh">刷新</button>
  <button id="jumpLive">跳到最新帧</button>
  <button id="reinit">重新初始化</button>
  <button id="copyLog">复制日志</button>
  <button id="stopBtn" class="danger">⏹ 停止并断开</button>
  <button id="clearLog">清空日志</button>
  <span id="status" class="small"></span>
  <div class="toolbar">
    <label class="small">播放模式
      <select id="avMode">
        <option value="av" selected>1. A/V 正常</option>
        <option value="video">2. Video-only (hasAudio=false)</option>
        <option value="muted">3. 保留音轨但静音</option>
      </select>
    </label>
    <label class="small"><input type="checkbox" id="fixAudioGap"> 实验 fixAudioTimestampGap</label>
    <label class="small"><input type="checkbox" id="nudgeWaiting"> 实验 waiting时微移currentTime</label>
    <label class="small">显微镜 <select id="microMode"><option value="full" selected>完整</option><option value="compact">精简</option></select></label>
    <button id="tsAnalyze">浏览器 TS 分析(12s)</button>
    <button id="tsCapture">路由器抓包 15s</button>
    <button id="probeCaps">设备解码能力</button>
  </div>
</header>
<div class="layout">
  <aside id="sidebar"><div class="side-title">频道</div><div id="groups"></div></aside>
  <main>
    <div class="player">
      <video id="video" controls playsinline></video>
      <div style="display:flex;gap:7px;margin:7px 0 0">
        <button id="recoverBtn" type="button" style="flex:1">▶ 播放 / 恢复</button>
        <button id="stopBtn2" type="button" style="flex:1" class="danger">⏹ 停止并断开</button>
      </div>
    </div>
    <div class="now" id="now">选择频道开始播放
      <div class="hint">
        rev4.5：基于 rev4.3，保持频道列表/安装路径/播放逻辑不变；TS 分析只按 PMT 分类，Private PES 单独解包，MP3 仅在正确音频 PID/Private PES payload 中检测。
        核心参数保持 isLive=false、stash 384KB、fixAudioTimestampGap 默认关。
        一次只改一个实验项。TS 分析/抓包会先停止播放，避免第二个 udpxy 客户端抢流。
      </div>
      <pre id="diag" class="hint" style="white-space:pre-wrap;margin:6px 0 0;font-family:ui-monospace,monospace"></pre>
      <pre id="tsReport" class="hint" style="white-space:pre-wrap;margin:6px 0 0;font-family:ui-monospace,monospace"></pre>
      <pre id="log" class="hint" style="white-space:pre-wrap;margin:6px 0 0;max-height:240px;overflow:auto;background:#0b0b0b;padding:8px;border-radius:5px;font-size:11px"></pre>
    </div>
  </main>
</div>
<script src="/luci-static/resources/iptvweb/mpegts.min.js"></script>
<script>
window.addEventListener('error', function(e){
  try{
    var el=document.getElementById('status');
    if(el) el.textContent='JS错误: '+(e.message||e);
    var logEl=document.getElementById('log');
    if(logEl) logEl.textContent += '\n[JS error] '+(e.message||e)+' @'+(e.filename||'')+':'+(e.lineno||'');
  }catch(_){}
});
window.addEventListener('unhandledrejection', function(e){
  try{
    var el=document.getElementById('status');
    if(el) el.textContent='Promise错误: '+(e.reason && e.reason.message ? e.reason.message : e.reason);
  }catch(_){}
});

const REV='4.5';
const state={
  items:[], groups:[], active:'', current:null, player:null, seq:0,
  playStarted:0, firstFrameAt:0, firstPlayingAt:0, last:{t:0,wall:0}, stats:{},
  log:[], waitingStart:0, stallStart:0, waitingCount:0, stallCount:0,
  playIssuedAt:0, startTimer:0, userGestureCount:0, recoveries:0,
  lastRecoveryAt:0, lastProgressWall:0, lastProgressTime:0, playingSince:0,
  stuckTimer:0, gestureHooksInstalled:false, mediaInfo:null, lastErrorText:'',
  audioDecodeError:false, ts:{pts:0,dts:0,continuity:0,privateAudio:[]},
  timeline:[], timelineTimer:0, lastFrame:null, classification:'STARTING',
  classificationReason:'', classificationAt:0, userPaused:false, stopping:false,
  diagTimer:0, avMode:'av', caps:null, nudgedThisPlay:false, analyzeCtl:null
};

const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(line,name){const re=new RegExp(name+'="([^"]*)"','i'),m=line.match(re);return m?m[1]:''}
function parseM3U(text){
  const lines=text.split(/\r?\n/),out=[]; let info=null;
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith('#EXTINF:')) info=line;
    else if(info && !line.startsWith('#')){
      out.push({
        name:info.split(',').slice(1).join(',')||attr(info,'tvg-name'),
        id:attr(info,'tvg-id'), logo:attr(info,'tvg-logo'),
        group:attr(info,'group-title')||'其他', url:line
      });
      info=null;
    }
  }
  return out;
}
function streamUrl(ch){
  try{
    const u=new URL(ch.url, location.href);
    const m=u.pathname.match(/^\/udp\/([^:]+):(\d+)$/);
    if(m){
      const proxy=new URL('/cgi-bin/iptvweb-stream', window.location.href);
      proxy.searchParams.set('group', m[1]);
      proxy.searchParams.set('port', m[2]);
      return proxy.href;
    }
  }catch(e){}
  return new URL(ch.url, window.location.href).href;
}
function renderGroups(){
  const html=state.groups.map(g=>{
    const list=state.items.filter(x=>x.group===g);
    const open=state.active===g;
    return `<section class="group ${open?'open':''}" data-g="${esc(g)}"><div class="group-head"><span class="arrow">${open?'▼':'▶'}</span><span>${esc(g)}</span><span class="count">${list.length}</span></div><div class="group-channels">${list.map(x=>`<div class="channel ${state.current===x?'active':''}" data-i="${state.items.indexOf(x)}">${x.logo?`<img src="${esc(x.logo)}" loading="lazy" alt="">`:''}<div class="name">${esc(x.name)}</div></div>`).join('')}</div></section>`;
  }).join('');
  $('groups').innerHTML=html;
  document.querySelectorAll('.group-head').forEach(h=>h.onclick=()=>{
    const g=h.parentElement.dataset.g;
    state.active=state.active===g?'':g;
    renderGroups();
  });
  document.querySelectorAll('.channel').forEach(x=>x.onclick=()=>play(state.items[+x.dataset.i]));
}

function rel(){return state.playStarted?((performance.now()-state.playStarted)/1000).toFixed(3):'0.000'}
function log(msg){
  const line='['+rel()+'s] '+msg;
  console.log('[IPTV rev'+REV+'] '+line);
  state.log.push(line);
  if(state.log.length>220) state.log.shift();
  const el=$('log');
  if(el){ el.textContent=state.log.join('\n'); el.scrollTop=el.scrollHeight; }
}
function setStatus(t){ $('status').textContent=t||''; }
function avMode(){ return $('avMode') && $('avMode').value==='video' ? 'video' : ($('avMode') && $('avMode').value==='muted' ? 'muted' : 'av'); }
function rangeText(r){
  try{
    if(!r||!r.length) return '-';
    const a=[];
    for(let i=0;i<r.length;i++) a.push(r.start(i).toFixed(3)+'-'+r.end(i).toFixed(3));
    return a.join(' | ');
  }catch(e){ return 'ERR:'+e.message; }
}
function bufferAhead(v){
  try{
    if(!v.buffered.length) return 0;
    const t=v.currentTime;
    for(let i=0;i<v.buffered.length;i++){
      if(t>=v.buffered.start(i)-0.05 && t<=v.buffered.end(i)+0.05) return Math.max(0, v.buffered.end(i)-t);
    }
    return 0;
  }catch(e){ return 0; }
}
function chromeCounters(v){
  const g=k=> (k in v) ? v[k] : '-';
  return 'decV='+g('webkitVideoDecodedByteCount')+' decA='+g('webkitAudioDecodedByteCount')+' frames='+g('webkitDecodedFrameCount')+' drop='+g('webkitDroppedFrameCount');
}
function mseDump(){
  try{
    const p=state.player; if(!p) return '-';
    const ctl=p._msectl || p._mseController || null;
    if(!ctl) return 'no _msectl';
    const sbs=ctl._sourceBuffers || ctl.sourceBuffers;
    if(!sbs) return 'no sourceBuffers';
    const parts=[];
    const keys=(!Array.isArray(sbs) && typeof sbs==='object') ? Object.keys(sbs) : null;
    if(keys){
      for(const k of keys){
        const sb=sbs[k];
        if(!sb){ parts.push(k+':null'); continue; }
        parts.push(k+' type='+(sb.type||'?')+' buffered='+rangeText(sb.buffered)+' updating='+!!sb.updating+' tsOffset='+Number(sb.timestampOffset||0).toFixed(4));
      }
      return parts.join(' || ') || 'empty';
    }
    return String(sbs);
  }catch(e){ return 'ERR:'+e.message; }
}

function stopDiagTimers(){
  if(state.stuckTimer){ clearInterval(state.stuckTimer); state.stuckTimer=0; }
  if(state.timelineTimer){ clearInterval(state.timelineTimer); state.timelineTimer=0; }
  if(state.diagTimer){ clearInterval(state.diagTimer); state.diagTimer=0; }
}
function startDiagTimer(seq){
  if(state.diagTimer) clearInterval(state.diagTimer);
  state.diagTimer=setInterval(()=>{
    if(seq!==state.seq){ clearInterval(state.diagTimer); state.diagTimer=0; return; }
    updateDiag();
  }, 500);
}
function stopPlayer(){
  if(state.analyzeCtl){ try{ state.analyzeCtl.abort(); }catch(e){} state.analyzeCtl=null; }
  if(state.startTimer){ clearTimeout(state.startTimer); state.startTimer=0; }
  stopDiagTimers();
  if(state.player){
    try{ state.player.pause(); }catch(e){}
    try{ state.player.unload(); }catch(e){}
    try{ state.player.detachMediaElement(); }catch(e){}
    try{ state.player.destroy(); }catch(e){}
    state.player=null;
  }
}

function installGestureHooks(){
  if(state.gestureHooksInstalled) return;
  state.gestureHooksInstalled=true;
  const v=$('video');
  v.addEventListener('click', ()=>gesturePlay('video-click'), {passive:true});
  const b=$('recoverBtn');
  if(b) b.onclick=()=>gesturePlay('recovery-button');
}
function gesturePlay(reason){
  const v=$('video'), p=state.player;
  state.userGestureCount++;
  state.userPaused=false;
  log('USER_GESTURE '+reason+' paused='+v.paused+' current='+v.currentTime.toFixed(3)+' readyState='+v.readyState+' bufferAhead='+bufferAhead(v).toFixed(3));
  if(p){
    startTimelineMicroscope(state.seq);
    startStuckMonitor(state.seq);
    startDiagTimer(state.seq);
  }
  if(!p) return;
  try{
    const q=p.play();
    if(q&&q.then) q.then(()=>log('GESTURE player.play resolved')).catch(e=>log('GESTURE player.play rejected '+e.name+': '+e.message));
  }catch(e){ log('GESTURE player.play threw '+e.name+': '+e.message); }
}
function recoverPlayback(reason){
  const v=$('video'), p=state.player, now=performance.now();
  if(!p) return;
  if(state.recoveries>=2){ log('RECOVERY skipped limit=2 reason='+reason); return; }
  if(now-state.lastRecoveryAt<3000){ log('RECOVERY skipped cooldown reason='+reason); return; }
  state.lastRecoveryAt=now; state.recoveries++;
  log('RECOVERY #'+state.recoveries+' reason='+reason+' paused='+v.paused+' current='+v.currentTime.toFixed(3)+' readyState='+v.readyState+' bufferAhead='+bufferAhead(v).toFixed(3));
  try{
    const q=p.play();
    if(q&&q.then) q.then(()=>log('RECOVERY player.play resolved')).catch(e=>log('RECOVERY player.play rejected '+e.name+': '+e.message));
  }catch(e){ log('RECOVERY player.play threw '+e.name+': '+e.message); }
}
function startStuckMonitor(seq){
  if(state.stuckTimer) clearInterval(state.stuckTimer);
  state.lastProgressWall=performance.now();
  state.lastProgressTime=$('video').currentTime||0;
  state.playingSince=0;
  state.stuckTimer=setInterval(()=>{
    if(seq!==state.seq){ clearInterval(state.stuckTimer); return; }
    const v=$('video'), now=performance.now();
    if(v.paused||v.ended){ state.lastProgressWall=now; state.lastProgressTime=v.currentTime||0; return; }
    const t=v.currentTime||0;
    if(t>state.lastProgressTime+0.05){ state.lastProgressTime=t; state.lastProgressWall=now; return; }
    if(state.playingSince && now-state.playingSince>=2500 && now-state.lastProgressWall>=2000){
      recoverPlayback('time-not-advancing');
      state.playingSince=now;
    }
  }, 500);
}

function classifyTimeline(){
  const v=$('video'), now=performance.now(), tl=state.timeline;
  let reason='', c='STARTING';
  const recent=tl.filter(x=>now-x.wall<4000);
  const decoded=state.stats && Number(state.stats.decodedFrames||0);
  const buffered=bufferAhead(v);
  const playing=!!state.firstPlayingAt && !v.paused && !v.ended;
  if(state.userPaused && v.paused){ c='USER PAUSED'; reason='用户主动暂停'; state.classification=c; state.classificationReason=reason; return c; }
  if(v.error||state.lastErrorText){ c='MEDIA ERROR'; reason=state.lastErrorText||('video.error code='+v.error.code); }
  else if(state.audioDecodeError){ c='AUDIO DECODE ERROR'; reason='mpegts audio decode failure'; }
  else if(playing && recent.length>=2){
    const a=recent[0], b=recent[recent.length-1];
    const dt=(b.wall-a.wall)/1000, ct=b.currentTime-a.currentTime, pf=b.presentedFrames-a.presentedFrames;
    if(dt>=1.5 && ct<0.08){
      if(pf<=0 && decoded>10){ c='DECODER/TIMELINE STUCK'; reason='currentTime 与 presentedFrames 均不推进'; }
      else { c='TIMELINE STUCK'; reason='有 buffer，但 currentTime 不推进'; }
    } else if(ct>0.08 || pf>0){ c='PLAYBACK OK'; reason='时间线持续推进'; }
  }
  if(c==='STARTING' && recent.length>=2){
    const a=recent[0], b=recent[recent.length-1], dt=(b.wall-a.wall)/1000, ct=b.currentTime-a.currentTime;
    if(dt>=1.5 && ct<0.08 && buffered>1){ c='BUFFER GROWING NO PLAY'; reason='bufferAhead 在增长，但播放时间线未推进'; }
  }
  if(c==='STARTING' && state.firstPlayingAt){ c='PLAY STARTED'; reason='已触发 playing'; }
  if(c==='STARTING' && state.mediaInfo){ c='MEDIA DETECTED'; reason='已识别编码'; }
  state.classification=c; state.classificationReason=reason; state.classificationAt=now;
  return c;
}
function timelineSample(source){
  const v=$('video'), now=performance.now(), st=state.stats||{};
  let presented=0, mediaTime=null;
  if(state.lastFrame){ presented=Number(state.lastFrame.presentedFrames||0); mediaTime=Number(state.lastFrame.mediaTime); }
  const item={
    wall:now, rel:state.playStarted?(now-state.playStarted)/1000:0,
    currentTime:Number(v.currentTime||0), mediaTime:isFinite(mediaTime)?mediaTime:null,
    presentedFrames:presented, decodedFrames:Number(st.decodedFrames||0),
    droppedFrames:Number(st.droppedFrames||0), buffered:rangeText(v.buffered),
    ahead:bufferAhead(v), readyState:v.readyState, paused:v.paused, source:source||'timer'
  };
  state.timeline.push(item); if(state.timeline.length>240) state.timeline.shift();
  return item;
}
function startTimelineMicroscope(seq){
  if(state.timelineTimer) clearInterval(state.timelineTimer);
  state.timeline=[]; state.lastFrame=null;
  state.timelineTimer=setInterval(()=>{
    if(seq!==state.seq){ clearInterval(state.timelineTimer); return; }
    timelineSample('250ms'); classifyTimeline(); updateDiag();
  }, 250);
}
function timelineSummary(){
  const a=state.timeline; if(a.length<2) return '样本不足';
  const first=a[0], last=a[a.length-1];
  const dt=(last.wall-first.wall)/1000;
  return 'Δwall='+dt.toFixed(2)+'s Δcurrent='+(last.currentTime-first.currentTime).toFixed(3)+'s Δpresented='+(last.presentedFrames-first.presentedFrames)+' Δdecoded='+((last.decodedFrames-first.decodedFrames)||0);
}

function waitingSnapshot(v, ev){
  const ahead=bufferAhead(v);
  const line=[
    'WAITING_SNAPSHOT ev='+ev,
    'current='+v.currentTime.toFixed(3),
    'ahead='+ahead.toFixed(3)+'s',
    'readyState='+v.readyState,
    'networkState='+v.networkState,
    'paused='+v.paused,
    'buffered='+rangeText(v.buffered),
    'seekable='+rangeText(v.seekable),
    'duration='+(isFinite(v.duration)?v.duration.toFixed(3):String(v.duration)),
    chromeCounters(v),
    'mse='+mseDump()
  ].join(' ');
  log(line);
  if(ahead>=1 && v.readyState>=3){
    log('WAITING_WITH_BUFFER 不是缺数据。ahead='+ahead.toFixed(3)+'s readyState='+v.readyState+' → 更像 MSE/A-V sync/decoder，而不是 HTTP/udpxy');
  }
  if($('nudgeWaiting').checked && ahead>=1 && !state.nudgedThisPlay){
    state.nudgedThisPlay=true;
    const t=v.currentTime;
    try{
      v.currentTime=t;
      log('NUDGE applied currentTime='+t.toFixed(3)+' (same value; Chrome MSE unblock experiment)');
    }catch(e){ log('NUDGE failed '+e.message); }
  }
}

function updateDiag(){
  const v=$('video');
  let b='-', s='-';
  try{ b=rangeText(v.buffered); s=rangeText(v.seekable); }catch(e){}
  const now=performance.now();
  const dt=state.last.wall?(now-state.last.wall)/1000:0;
  const rate=state.last.wall?(v.currentTime-state.last.t)/Math.max(dt,0.001):0;
  state.last={t:v.currentTime, wall:now};
  const ahead=bufferAhead(v), cls=classifyTimeline();
  const mi=state.mediaInfo||{};
  const frame=state.lastFrame||{};
  $('diag').textContent=
    '【状态】 '+cls+(state.classificationReason?' | '+state.classificationReason:'')+'\n'+
    '【编码】 V='+(mi.videoCodec||'-')+' / A='+(mi.audioCodec||'-')+' | '+(mi.width||v.videoWidth||'-')+'x'+(mi.height||v.videoHeight||'-')+' @ '+(mi.fps||'-')+'fps | audio='+(mi.hasAudio?'yes':'?')+' '+(mi.audioSampleRate||'-')+'Hz/'+(mi.audioChannelCount||'-')+'ch\n'+
    '【时间线】 current='+(isFinite(v.currentTime)?v.currentTime.toFixed(3):'NaN')+' | buffered='+b+' | seekable='+s+' | ahead='+(isFinite(ahead)?ahead.toFixed(3):'-')+'s\n'+
    '【显微镜】 mediaTime='+(frame.mediaTime!=null?Number(frame.mediaTime).toFixed(3):'-')+' | presentedFrames='+(frame.presentedFrames??'-')+' | '+timelineSummary()+'\n'+
    '【A/V】 decoded='+(state.stats.decodedFrames??'-')+' dropped='+(state.stats.droppedFrames??'-')+' | Δ/s='+(isFinite(rate)?rate.toFixed(3):'-')+' | waiting='+state.waitingCount+' stalled='+state.stallCount+' recover='+state.recoveries+'\n'+
    '【Chrome计数】 '+chromeCounters(v)+'\n'+
    '【MSE】 '+mseDump()+'\n'+
    '【实验】 avMode='+state.avMode+' fixAudioTimestampGap='+$('fixAudioGap').checked+' nudge='+$('nudgeWaiting').checked+' isLive=false stash=384KB\n'+
    '【播放器】 ready='+v.readyState+' network='+v.networkState+' paused='+v.paused+' ended='+v.ended+' duration='+(isFinite(v.duration)?v.duration.toFixed(3):String(v.duration))+'\n'+
    '【错误】 '+(state.lastErrorText||'-')+'\n'+
    '【mpegts】 speed='+(state.stats.speed??'-')+' KB/s loader='+(state.stats.loaderType??'-');
}

function attachVideoDiagnostics(v, seq){
  v.autoplay=false;
  v.removeAttribute('autoplay');
  const events=['loadstart','durationchange','loadedmetadata','loadeddata','canplay','canplaythrough','play','playing','pause','waiting','stalled','suspend','progress','seeking','seeked','timeupdate','ratechange','volumechange','ended','emptied','error'];
  events.forEach(ev=>v.addEventListener(ev, ()=>{
    if(seq!==state.seq) return;
    const now=performance.now();
    let extra='';
    if(ev==='play' && !state.playIssuedAt) extra=' SOURCE=unexpected-autoplay';
    if(ev==='pause' && state.playIssuedAt && !state.stopping){
      state.userPaused=true; stopDiagTimers();
      log('USER_PAUSED: 停止诊断采样');
    }
    if(ev==='play' && state.userPaused){
      state.userPaused=false;
      startTimelineMicroscope(seq); startStuckMonitor(seq); startDiagTimer(seq);
      log('USER_RESUMED');
    }
    if(ev==='waiting'){
      state.waitingCount++;
      if(!state.waitingStart) state.waitingStart=now;
      extra=' current='+v.currentTime.toFixed(3)+' bufferAhead='+bufferAhead(v).toFixed(3)+'s readyState='+v.readyState;
      waitingSnapshot(v, 'waiting');
    }
    if(ev==='playing'){
      state.playingSince=now; state.lastProgressWall=now; state.lastProgressTime=v.currentTime||0;
      if(state.waitingStart){
        extra=' waitingRecovered='+((now-state.waitingStart)/1000).toFixed(3)+'s current='+v.currentTime.toFixed(3)+' bufferAhead='+bufferAhead(v).toFixed(3)+'s';
        state.waitingStart=0;
      }
      extra += ' mse='+mseDump();
    }
    if(ev==='stalled'){
      state.stallCount++;
      extra=' current='+v.currentTime.toFixed(3)+' bufferAhead='+bufferAhead(v).toFixed(3)+'s';
      waitingSnapshot(v, 'stalled');
    }
    if(ev==='progress') extra=' current='+v.currentTime.toFixed(3)+' bufferAhead='+bufferAhead(v).toFixed(3)+'s';
    if(ev==='error' && v.error) extra=' code='+v.error.code+' '+(v.error.message||'');
    log('video.'+ev+extra);
    if(ev==='playing' && !state.firstPlayingAt) state.firstPlayingAt=now;
    updateDiag();
  }));
  if('requestVideoFrameCallback' in v){
    const cb=(now, meta)=>{
      if(seq!==state.seq) return;
      state.lastFrame={wall:performance.now(), mediaTime:Number(meta.mediaTime), presentedFrames:Number(meta.presentedFrames||0)};
      if(!state.firstFrameAt){
        state.firstFrameAt=performance.now();
        log('video.firstFrame rVFC mediaTime='+(meta.mediaTime??'?')+' presentedFrames='+(meta.presentedFrames??'?'));
      }
      v.requestVideoFrameCallback(cb);
    };
    v.requestVideoFrameCallback(cb);
  }
}

function playerConfig(){
  return {
    enableWorker:true,
    enableWorkerForMSE:false,
    enableStashBuffer:true,
    stashInitialSize:384*1024,
    lazyLoad:true,
    deferLoadAfterSourceOpen:true,
    autoCleanupSourceBuffer:false,
    liveBufferLatencyChasing:false,
    liveBufferLatencyChasingOnPaused:false,
    liveSync:false,
    fixAudioTimestampGap: !!$('fixAudioGap').checked,
    accurateSeek:false
  };
}

function createPlayer(ch, url, seq, mode){
  if(seq!==state.seq) return;
  const v=$('video');
  attachVideoDiagnostics(v, seq);
  if(mode==='muted'){ v.muted=true; v.volume=0; log('audio experiment: muted=true volume=0 (audio still demuxed)'); }
  else { v.muted=false; }
  const ds={type:'mpegts', url:url, isLive:false};
  if(mode==='video') ds.hasAudio=false;
  const config=playerConfig();
  log('CONFIG '+JSON.stringify(config));
  log('MediaDataSource '+JSON.stringify(ds));
  try{
    if(window.MediaSource){
      log('isTypeSupported video/mp4;codecs="avc1.640029"='+MediaSource.isTypeSupported('video/mp4; codecs="avc1.640029"'));
      log('isTypeSupported audio/mp4;codecs="mp3"='+MediaSource.isTypeSupported('audio/mp4; codecs="mp3"'));
      log('isTypeSupported audio/mpeg='+MediaSource.isTypeSupported('audio/mpeg'));
    }
  }catch(e){}
  let p;
  try{ p=mpegts.createPlayer(ds, config); }
  catch(e){ setStatus('播放器创建失败'); log('createPlayer error '+e.stack); return; }
  state.player=p;
  p.on(mpegts.Events.ERROR, (type, details, info)=>{
    if(seq!==state.seq) return;
    state.lastErrorText=String(details||type);
    if(/audio/i.test(String(details||'')+' '+JSON.stringify(info||{}))) state.audioDecodeError=true;
    log('mpegts.ERROR type='+type+' details='+details+' info='+JSON.stringify(info||{}));
    setStatus('播放错误：'+details);
    updateDiag();
  });
  p.on(mpegts.Events.MEDIA_INFO, info=>{
    if(seq!==state.seq) return;
    state.mediaInfo=info||{};
    log('MEDIA_INFO '+JSON.stringify(info));
    log('MSE after MEDIA_INFO '+mseDump());
    const vc=info&&info.videoCodec?info.videoCodec:'';
    const ac=info&&info.audioCodec?info.audioCodec:'';
    setStatus((mode==='video'?'Video-only · ':mode==='muted'?'Muted-AV · ':'A/V · ')+(vc||'')+(ac?' · '+ac:''));
    updateDiag();
  });
  ['LOADING_COMPLETE','RECOVERED_EARLY_EOF','STATISTICS_INFO'].forEach(name=>{
    const ev=mpegts.Events[name];
    if(!ev) return;
    p.on(ev, info=>{
      if(seq!==state.seq) return;
      if(name==='STATISTICS_INFO'){ state.stats=info||{}; return; }
      log(name+(info?' '+JSON.stringify(info):''));
    });
  });
  if(mpegts.LoggingControl && mpegts.LoggingControl.addLogListener){
    try{
      mpegts.LoggingControl.addLogListener((type, msg)=>{
        if(seq!==state.seq) return;
        const text=String(msg||'');
        if(!/PMT|PTS|DTS|timestamp|continuity|discontinuity|PCR|PES|private|SourceBuffer|timestampOffset/i.test(text)) return;
        if(/PTS/i.test(text)) state.ts.pts++;
        if(/DTS/i.test(text)) state.ts.dts++;
        if(/continuity|discontinuity/i.test(text)) state.ts.continuity++;
        if($('microMode').value==='full') log('TSLOG '+text.slice(0,700));
      });
    }catch(e){ log('TSLOG listener install failed '+e.message); }
  }
  startTimelineMicroscope(seq);
  p.attachMediaElement(v); log('attachMediaElement');
  p.load(); log('player.load()');
  startStuckMonitor(seq); startDiagTimer(seq);
  const start=()=>{
    if(seq!==state.seq || state.playIssuedAt) return;
    state.startTimer=0;
    state.playIssuedAt=performance.now();
    log('EXPLICIT play() readyState='+v.readyState+' bufferAhead='+bufferAhead(v).toFixed(3)+' (no buffer gate)');
    try{
      const q=p.play();
      if(q&&q.then) q.then(()=>log('player.play resolved')).catch(e=>log('player.play rejected '+e.name+': '+e.message));
    }catch(e){ log('player.play threw '+e.name+': '+e.message); }
  };
  if(v.readyState>=1) start();
  else v.addEventListener('loadedmetadata', start, {once:true});
}

function resetPlayState(){
  state.playStarted=performance.now();
  state.firstFrameAt=0; state.firstPlayingAt=0; state.last={t:0,wall:0};
  state.waitingStart=0; state.stallStart=0; state.waitingCount=0; state.stallCount=0;
  state.stats={}; state.playIssuedAt=0; state.lastRecoveryAt=0; state.recoveries=0;
  state.lastProgressWall=performance.now(); state.lastProgressTime=0; state.playingSince=0;
  state.mediaInfo=null; state.lastErrorText=''; state.audioDecodeError=false;
  state.ts={pts:0,dts:0,continuity:0,privateAudio:[]};
  state.timeline=[]; state.lastFrame=null;
  state.classification='STARTING'; state.classificationReason='';
  state.userPaused=false; state.stopping=false; state.nudgedThisPlay=false;
  state.log=[]; $('log').textContent='';
}

function play(ch){
  const seq=++state.seq;
  state.current=ch; state.active=ch.group; renderGroups();
  stopPlayer();
  const v=$('video');
  installGestureHooks();
  try{ v.pause(); }catch(e){}
  v.autoplay=false; v.removeAttribute('autoplay'); v.removeAttribute('src'); v.load();
  if(state.startTimer){ clearTimeout(state.startTimer); state.startTimer=0; }
  resetPlayState();
  $('now').firstChild.textContent=ch.name;
  const url=streamUrl(ch);
  state.avMode=avMode();
  log('PLAY '+ch.name);
  log('URL '+url);
  log('isLive=false avMode='+state.avMode+' rev='+REV);
  if(!window.mpegts || !mpegts.isSupported()){
    setStatus('浏览器不支持 MSE MPEG-TS / mpegts.js 未安装');
    log('mpegts.isSupported=false localMarker='+!!window.__iptvwebMpegtsLocalRequired);
    return;
  }
  createPlayer(ch, url, seq, state.avMode);
}

function stopPlayback(){
  state.stopping=true; state.userPaused=false;
  log('STOP: 用户请求停止并断开流');
  stopDiagTimers();
  const p=state.player, v=$('video');
  try{ v.pause(); }catch(e){}
  try{ if(p) p.unload(); }catch(e){ log('STOP unload error '+e.message); }
  try{ if(p) p.detachMediaElement(); }catch(e){}
  try{ if(p) p.destroy(); }catch(e){}
  state.player=null;
  try{ v.removeAttribute('src'); v.load(); }catch(e){}
  setStatus('已停止并断开');
  log('STOP: player destroyed / stream disconnected');
  state.stopping=false;
  updateDiag();
}
function jumpToLatest(){
  const v=$('video');
  try{
    if(!v.buffered.length){ log('JUMP: 无 buffered'); return; }
    const end=v.buffered.end(v.buffered.length-1);
    const target=Math.max(v.buffered.start(v.buffered.length-1), end-0.5);
    log('JUMP: bufferedEnd='+end.toFixed(3)+' target='+target.toFixed(3));
    v.currentTime=target;
    const p=v.play();
    if(p&&p.catch) p.catch(e=>log('JUMP play rejected '+e.name+': '+e.message));
  }catch(e){ log('JUMP error '+e.message); }
}
function reinit(){
  if(!state.current){ log('REINIT: 没有当前频道'); return; }
  log('REINIT: '+state.current.name);
  play(state.current);
}

async function copyDiagnostics(){
  const text='===== IPTV rev'+REV+' DIAGNOSTIC =====\n'+
    (state.caps&&state.caps.length?'===== DEVICE CAPABILITIES =====\n'+state.caps.join('\n')+'\n\n':'')+
    ($('diag').textContent||'')+'\n\n'+
    ($('tsReport').textContent||'')+'\n\n===== EVENT LOG =====\n'+state.log.join('\n');
  try{ await navigator.clipboard.writeText(text); log('COPY_LOG ok'); setStatus('日志已复制'); return; }
  catch(e){}
  try{
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); log('COPY_LOG fallback ok'); setStatus('日志已复制');
  }catch(e){ log('COPY_LOG failed '+e.message); }
}

async function probeCapabilities(){
  const v=$('video');
  const tests=[
    ['H264 1080p25','video/mp4; codecs="avc1.640028"',1920,1080,25,5000000],
    ['HEVC 4K50 Main10','video/mp4; codecs="hvc1.2.1.L180.B0"',3840,2160,50,20000000],
    ['MP3 48k stereo','audio/mpeg; codecs="mp3"',0,0,0,192000]
  ];
  const out=['UA='+navigator.userAgent];
  for(const [name,mime,w,h,fps,br] of tests){
    let ct='';
    try{ ct=v.canPlayType(mime); }catch(e){ ct='ERR:'+e.message; }
    let mc='n/a';
    try{
      if(navigator.mediaCapabilities && navigator.mediaCapabilities.decodingInfo && w){
        const r=await navigator.mediaCapabilities.decodingInfo({type:'media-source', video:{contentType:mime,width:w,height:h,bitrate:br,framerate:fps}});
        mc=JSON.stringify({supported:r.supported, powerEfficient:r.powerEfficient, smooth:r.smooth});
      }
    }catch(e){ mc='ERR:'+e.message; }
    out.push(name+' | canPlayType='+ct+' | MediaCapabilities='+mc);
  }
  state.caps=out; out.forEach(x=>log('CAPS '+x)); setStatus('已记录设备解码能力'); updateDiag();
}

/* ---- TS analysis (manual, never during playback) ---- */
function pts90(p, o){
  return (((p[o]&14)*0x20000000)+(p[o+1]*0x400000)+((p[o+2]&254)*0x2000)+((p[o+3]>>1)*128)+(p[o+4]>>1))>>>0;
}
function streamTypeName(t){
  const map={1:'MPEG1-video',2:'MPEG2-video',3:'MPEG1-audio(MP3)',4:'MPEG2-audio',15:'AAC-ADTS',17:'AAC-LATM',27:'H.264',36:'H.265',6:'PES-private',134:'SCTE-35'};
  return map[t]||('0x'+t.toString(16));
}

function parseTsBuffer(u8){
  const res={
    bytes:u8.length, packets:0, syncLoss:0, continuity:0, disc:0, rai:[],
    pids:{}, pmt:[],
    video:{pid:null,type:null,firstPts:null,firstDts:null,lastPts:null,count:0},
    audio:{pid:null,type:null,firstPts:null,firstDts:null,lastPts:null,count:0},
    privateAudio:[], pcr:{pid:null,first:null,last:null,count:0}
  };
  const lastCC={};
  const sections={};
  const pesState={};
  let pmtPid=null;

  function addSection(pid, data, parseSection){
    let a=sections[pid]||new Uint8Array(0);
    let merged=new Uint8Array(a.length+data.length); merged.set(a); merged.set(data,a.length); a=merged;
    while(a.length>=3){
      const sl=((a[1]&0x0f)<<8)|a[2], total=3+sl;
      if(total<3 || total>4096){ a=new Uint8Array(0); break; }
      if(a.length<total) break;
      parseSection(a.subarray(0,total));
      a=a.subarray(total);
    }
    sections[pid]=a;
  }
  function parsePAT(sec){
    if(sec[0]!==0x00 || sec.length<8) return;
    const end=Math.min(sec.length-4, 8+(((sec[1]&0x0f)<<8)|sec[2])-9);
    for(let o=8;o+4<=end;o+=4){
      const prog=(sec[o]<<8)|sec[o+1], pid=((sec[o+2]&0x1f)<<8)|sec[o+3];
      if(prog!==0){ pmtPid=pid; break; }
    }
  }
  function parsePMT(sec){
    if(sec[0]!==0x02 || sec.length<12) return;
    const sl=((sec[1]&0x0f)<<8)|sec[2];
    const pil=((sec[10]&0x0f)<<8)|sec[11];
    let o=12+pil, end=Math.min(sec.length-4,3+sl);
    while(o+5<=end){
      const type=sec[o], pid=((sec[o+1]&0x1f)<<8)|sec[o+2];
      const eil=((sec[o+3]&0x0f)<<8)|sec[o+4];
      const name=streamTypeName(type);
      const s={pid,type,name};
      if(!res.pmt.some(x=>x.pid===pid)) res.pmt.push(s);
      if([0x01,0x02,0x1b,0x24].includes(type) && res.video.pid==null){
        res.video.pid=pid; res.video.type=type;
      }
      if([0x03,0x04,0x0f,0x11].includes(type) && res.audio.pid==null){
        res.audio.pid=pid; res.audio.type=type;
      }
      if(type===0x06 && !res.privateAudio.some(x=>x.pid===pid)){
        res.privateAudio.push({pid,type,pes:0,firstPts:null,lastPts:null,samples:[],payloadBytes:0,substreams:{},pesSamples:[]});
      }
      o+=5+eil;
    }
  }
  function ptsFrom(a,o){
    if(o+4>=a.length) return null;
    return (((a[o]&14)*0x20000000)+(a[o+1]*0x400000)+((a[o+2]&254)*0x2000)+((a[o+3]>>1)*128)+(a[o+4]>>1))>>>0;
  }
  function hex(a,n=128){
    return Array.from(a.subarray(0,Math.min(n,a.length))).map(x=>x.toString(16).padStart(2,'0')).join(' ');
  }
  const brTable={
    1:[0,32,40,48,56,64,80,96,112,128,160,192,224,256,288,320],
    2:[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160],
    3:[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160]
  };
  const srBase=[44100,48000,32000];
  function mp3Header(a,o){
    if(o+3>=a.length || a[o]!==0xff || (a[o+1]&0xe0)!==0xe0) return null;
    const verBits=(a[o+1]>>3)&3, layer=(a[o+1]>>1)&3, bi=(a[o+2]>>4)&15, si=(a[o+2]>>2)&3;
    if(layer!==1 || bi===0 || bi===15 || si===3 || verBits===1) return null;
    const version=verBits===3?1:(verBits===2?2:2.5);
    const tableKey=version===1?1:2, kb=brTable[tableKey][bi], sr=srBase[si]/(version===2?2:version===2.5?4:1);
    if(!kb || !sr) return null;
    const pad=(a[o+2]>>1)&1, ch=((a[o+3]>>6)&3);
    const channels=ch===3?1:2;
    const samples=version===1?1152:576;
    const frameLen=Math.floor((version===1?144:72)*kb*1000/sr)+pad;
    if(frameLen<24 || o+frameLen>a.length) return null;
    return {version,layer:3,bitrate:kb,sampleRate:sr,channels,frameLen,samples};
  }
  function scanMp3(a, basePts, limit=24){
    const out=[];
    for(let i=0;i+4<a.length && out.length<limit;i++){
      let h=mp3Header(a,i); if(!h) continue;
      let pos=i, chain=[{offset:i,header:h}];
      while(chain.length<3){
        pos+=h.frameLen;
        const nh=mp3Header(a,pos);
        if(!nh || nh.version!==h.version || nh.sampleRate!==h.sampleRate || nh.channels!==h.channels) break;
        chain.push({offset:pos,header:nh});
        h=nh;
      }
      if(chain.length>=3){
        const f=chain[0];
        out.push({offset:f.offset, ...f.header, confirmed:true, pts:basePts});
        i=f.offset+f.header.frameLen*2;
      }
    }
    return out;
  }
  function parsePes(pid, bytes){
    if(bytes.length<14 || bytes[0]!==0 || bytes[1]!==0 || bytes[2]!==1) return;
    const sid=bytes[3], flags=bytes[7], hlen=bytes[8];
    let pts=null,dts=null;
    if((flags&0x80) && 9+4<bytes.length) pts=ptsFrom(bytes,9);
    if((flags&0xc0)===0xc0 && 14+4<bytes.length) dts=ptsFrom(bytes,14);
    const payloadStart=Math.min(bytes.length,9+hlen), payload=bytes.subarray(payloadStart);
    const privateRec=res.privateAudio.find(x=>x.pid===pid);
    const isPrivate=!!privateRec;
    const isAudio=(res.audio.pid===pid);
    const isVideo=(res.video.pid===pid);
    if(isVideo){
      res.video.count++; if(res.video.firstPts==null)res.video.firstPts=pts; if(res.video.firstDts==null)res.video.firstDts=dts;
      if(pts!=null)res.video.lastPts=pts;
    }
    if(isAudio){
      res.audio.count++; if(res.audio.firstPts==null)res.audio.firstPts=pts; if(res.audio.firstDts==null)res.audio.firstDts=dts;
      if(pts!=null)res.audio.lastPts=pts;
    }
    if(isPrivate){
      privateRec.pes++; privateRec.payloadBytes+=payload.length;
      if(privateRec.firstPts==null) privateRec.firstPts=pts; if(pts!=null) privateRec.lastPts=pts;
      const sub=payload.length?payload[0]:null;
      const key=sub==null?'-':'0x'+sub.toString(16).padStart(2,'0');
      privateRec.substreams[key]=(privateRec.substreams[key]||0)+1;
      privateRec.pesSamples.push({
        sid:'0x'+sid.toString(16), pts,dts,payloadLen:payload.length,
        payloadHex:hex(payload,96), substream:key
      });
      const frames=scanMp3(payload,pts,8);
      frames.forEach(f=>privateRec.samples.push({...f,sid,substream:key}));
    }
    if(isAudio && res.audio.type!==0x06){
      // Standard PMT-declared MPEG audio only. No scanning of video/private PIDs here.
      // Keep this conservative: the PMT classification is authoritative.
    }
  }
  function feedPes(pid, payload, pusi){
    if(!pesState[pid]) pesState[pid]={bytes:[],active:false};
    const s=pesState[pid];
    if(pusi){
      if(s.active && s.bytes.length) parsePes(pid,concatChunks(s.bytes));
      s.bytes=[]; s.active=true;
    }
    if(s.active && payload.length){
      // Bound each retained PES so a pathological stream cannot consume browser memory.
      let b=payload;
      const cur=s.bytes.reduce((n,x)=>n+x.length,0);
      if(cur<262144){
        if(cur+b.length>262144) b=b.subarray(0,262144-cur);
        s.bytes.push(b.slice());
      }
    }
  }
  function concatChunks(chunks){
    let n=0; chunks.forEach(x=>n+=x.length);
    const a=new Uint8Array(n); let o=0; chunks.forEach(x=>{a.set(x,o);o+=x.length;}); return a;
  }

  let off=0;
  while(off<u8.length){
    while(off<u8.length && u8[off]!==0x47) off++;
    if(off+188>u8.length) break;
    const p=u8.subarray(off,off+188); off+=188; res.packets++;
    const pid=((p[1]&31)<<8)|p[2], pusi=!!(p[1]&0x40), afc=(p[3]>>4)&3, cc=p[3]&15;
    let d=4, hasPayload=(afc===1||afc===3), hasPcr=false;
    if(afc===2||afc===3){
      const al=p[4]; d=5+al;
      if(al>=1){
        const flags=p[5];
        if(flags&0x80)res.disc++;
        if(flags&0x40)res.rai.push({pkt:res.packets,pid});
        if(al>=7&&(flags&0x10)){
          const base=((p[6]*0x1000000)+(p[7]<<16)+(p[8]<<8)+p[9])>>>0, ext=((p[10]&1)<<8)|p[11];
          const v=base*300+ext; if(res.pcr.first==null){res.pcr.first=v;res.pcr.pid=pid;} res.pcr.last=v;res.pcr.count++;hasPcr=true;
        }
      }
    }
    if(hasPayload && d<188){
      const rec=res.pids[pid]||(res.pids[pid]={packets:0,starts:0,continuity:0});
      rec.packets++;if(pusi)rec.starts++;
      if(lastCC[pid]!=null && ((lastCC[pid]+1)&15)!==cc){rec.continuity++;res.continuity++;}
      lastCC[pid]=cc;
    }
    if(!hasPayload||d>=188) continue;
    const payload=p.subarray(d);

    if(pid===0){
      let po=0;
      if(pusi){const pointer=payload[0]||0;po=1+pointer;}
      else po=0;
      if(po<payload.length)addSection(pid,payload.subarray(po),parsePAT);
      continue;
    }
    if(pmtPid!=null && pid===pmtPid){
      let po=0;
      if(pusi){const pointer=payload[0]||0;po=1+pointer;}
      addSection(pid,payload.subarray(po),parsePMT);
      continue;
    }
    const known=(res.video.pid===pid||res.audio.pid===pid||res.privateAudio.some(x=>x.pid===pid));
    if(known) feedPes(pid,payload,pusi);
  }
  Object.keys(pesState).forEach(pid=>{const s=pesState[pid];if(s.active&&s.bytes.length)parsePes(Number(pid),concatChunks(s.bytes));});
  return res;
}
function fmtPts(v){
  if(v==null) return '-';
  return v+' ('+(v/90).toFixed(3)+' ms, '+(v/90000).toFixed(6)+' s)';
}
function formatTsReport(res){
  const privateFirst=(res.privateAudio.length&&res.privateAudio[0].firstPts!=null)?res.privateAudio[0].firstPts:null;
  const audioFirst=res.audio.firstPts!=null?res.audio.firstPts:privateFirst;
  const avDelta=(audioFirst!=null&&res.video.firstPts!=null)?(audioFirst-res.video.firstPts)/90:null;
  const raiGaps=[];for(let i=1;i<res.rai.length;i++)raiGaps.push(res.rai[i].pkt-res.rai[i-1].pkt);
  const lines=[
    '===== TS/PCR + Private PES 精确解包 rev'+REV+' =====',
    'bytes='+res.bytes+' packets='+res.packets+' syncLoss='+res.syncLoss+' CC_err='+res.continuity+' discontinuity_indicator='+res.disc,
    'PMT streams: '+(res.pmt.length?res.pmt.map(s=>'pid='+s.pid+' type='+s.type+'('+s.name+')').join(', '):'(not seen)'),
    'PCR pid='+(res.pcr.pid??'-')+' count='+res.pcr.count+' first='+(res.pcr.first??'-')+' last='+(res.pcr.last??'-'),
    'VIDEO pid='+(res.video.pid??'-')+' type='+(res.video.type!=null?streamTypeName(res.video.type):'-')+' PES='+res.video.count,
    '  first PTS='+fmtPts(res.video.firstPts),
    '  first DTS='+fmtPts(res.video.firstDts),
    '  last  PTS='+fmtPts(res.video.lastPts),
    'AUDIO pid='+(res.audio.pid??'-')+' type='+(res.audio.type!=null?streamTypeName(res.audio.type):'-')+' PES='+res.audio.count,
    '  first PTS='+fmtPts(res.audio.firstPts),
    '  first DTS='+fmtPts(res.audio.firstDts),
    '  last  PTS='+fmtPts(res.audio.lastPts)
  ];
  lines.push('A-V start delta (audio-video) = '+(avDelta==null?'n/a':avDelta.toFixed(3)+' ms'));
  if(res.audio.firstPts==null && privateFirst!=null) lines.push('  (delta uses first PMT stream_type=0x06 Private PES PTS; not assumed decodable audio)');
  if(res.privateAudio.length){
    lines.push('PRIVATE AUDIO PID COUNT='+res.privateAudio.length);
    res.privateAudio.forEach(x=>{
      lines.push('PRIVATE PID='+x.pid+' stream_type=0x06 PES='+x.pes+' payloadBytes='+x.payloadBytes+' firstPTS='+fmtPts(x.firstPts)+' lastPTS='+fmtPts(x.lastPts));
      lines.push('  substreams='+Object.entries(x.substreams).map(([k,v])=>k+':'+v).join(', ')||'-');
      x.pesSamples.slice(0,6).forEach((p,i)=>{
        lines.push('  PES#'+(i+1)+' sid='+p.sid+' substream='+p.substream+' payloadLen='+p.payloadLen+' PTS='+fmtPts(p.pts));
        lines.push('    HEX '+p.payloadHex);
      });
      if(x.samples.length){
        lines.push('  CONFIRMED MP3 CHAINS='+x.samples.length);
        x.samples.slice(0,8).forEach((f,i)=>lines.push('    #'+(i+1)+' offset='+f.offset+' MPEG'+f.version+' Layer III '+f.bitrate+'kbps '+f.sampleRate+'Hz '+f.channels+'ch frameLen='+f.frameLen+' samples='+f.samples+' PTS='+fmtPts(f.pts)+' confirmed='+f.confirmed));
      }else{
        lines.push('  CONFIRMED MP3 CHAINS=0 (private PES payload 中未发现连续3帧一致MP3)');
      }
    });
  }else lines.push('PRIVATE AUDIO PID COUNT=0');
  lines.push('RAI/random_access count='+res.rai.length+(res.rai.length?(' first_pkt='+res.rai[0].pkt+' intervals_pkts='+(raiGaps.slice(0,12).join(',')||'-')):''));
  if(avDelta!=null) lines.push(Math.abs(avDelta)>400?'INTERPRET: A/V PTS 起始差 >400ms；与 Private PES 解码问题分开处理。':'INTERPRET: A/V PTS 起始差较小；下一步重点看 Private PES payload/子流格式。');
  return lines.join('\n');
}

async function analyzeTsInBrowser(){
  if(!state.current){ setStatus('请先选择频道'); return; }
  const url=streamUrl(state.current);
  log('TS_ANALYZE stop playback first, then fetch 12s of '+url);
  stopPlayback();
  setStatus('正在抓 12 秒 TS 做浏览器分析…');
  const ctl=new AbortController();
  state.analyzeCtl=ctl;
  const killer=setTimeout(()=>ctl.abort(), 13000);
  try{
    const resp=await fetch(url, {cache:'no-store', signal:ctl.signal});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const reader=resp.body.getReader();
    const chunks=[]; let bytes=0;
    const deadline=performance.now()+12000;
    while(bytes<8*1024*1024 && performance.now()<deadline){
      const {done, value}=await reader.read();
      if(done) break;
      chunks.push(value); bytes+=value.length;
    }
    try{ ctl.abort(); }catch(e){}
    const u8=new Uint8Array(bytes);
    let o=0; for(const c of chunks){ u8.set(c,o); o+=c.length; }
    const res=parseTsBuffer(u8);
    const text=formatTsReport(res);
    $('tsReport').textContent=text;
    log('TS_ANALYZE done bytes='+bytes+' packets='+res.packets);
    setStatus('TS 分析完成');
  }catch(e){
    if(e.name==='AbortError') log('TS_ANALYZE aborted/timeout');
    else { log('TS_ANALYZE error '+e.message); setStatus('TS 分析失败: '+e.message); }
  }finally{
    clearTimeout(killer);
    state.analyzeCtl=null;
  }
}

async function captureOnRouter(){
  if(!state.current){ setStatus('请先选择频道'); return; }
  const url=streamUrl(state.current);
  let group, port;
  try{
    const u=new URL(url);
    group=u.searchParams.get('group'); port=u.searchParams.get('port');
  }catch(e){}
  if(!group||!port){ setStatus('无法解析组播地址'); return; }
  log('TS_CAPTURE stop playback, then CGI capture 15s group='+group+' port='+port);
  stopPlayback();
  setStatus('路由器抓包 15 秒…请等待');
  try{
    const cap=new URL('/cgi-bin/iptvweb-capture', window.location.href);
    cap.searchParams.set('group', group);
    cap.searchParams.set('port', port);
    cap.searchParams.set('seconds', '15');
    const r=await fetch(cap.href, {cache:'no-store'});
    const text=await r.text();
    $('tsReport').textContent='===== 路由器抓包 =====\n'+text+'\n\n在电脑上:\nscp root@192.168.1.1:/tmp/iptvweb-capture.ts .\nffprobe -hide_banner -show_entries stream=index,codec_name,codec_type,profile,level,width,height,r_frame_rate,start_time,start_pts,sample_rate,channels -of json iptvweb-capture.ts\nffprobe -v error -select_streams v:0 -show_entries frame=pict_type,key_frame,pkt_pts_time,pkt_dts_time -of csv=p=0 -read_intervals %+12 iptvweb-capture.ts\nffprobe -v error -select_streams a:0 -show_entries packet=pts_time,dts_time,duration_time,size -of csv=p=0 -read_intervals %+5 iptvweb-capture.ts\n';
    log('TS_CAPTURE CGI:\n'+text);
    setStatus('抓包完成，见报告');
  }catch(e){
    log('TS_CAPTURE error '+e.message);
    setStatus('抓包失败: '+e.message);
  }
}

async function load(){
  state.current=null; state.active='';
  stopPlayer();
  setStatus('正在读取 M3U…');
  const ac=new AbortController();
  const t=setTimeout(()=>ac.abort(), 20000);
  try{
    const r=await fetch('/cgi-bin/iptvweb-m3u?'+Date.now(), {cache:'no-store', signal:ac.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text=await r.text();
    state.items=parseM3U(text);
    state.groups=[...new Set(state.items.map(x=>x.group))];
    if(state.items.length) state.active=state.items[0].group;
    renderGroups();
    if(!state.items.length){
      setStatus('M3U 解析到 0 个频道');
      $('tsReport').textContent='M3U 原始内容（前 800 字）:\n'+text.slice(0,800);
    }else{
      setStatus(state.items.length+' 个频道');
    }
  }catch(e){
    const msg=e.name==='AbortError'?'M3U 读取超时 20s':'M3U 读取失败: '+(e.message||e);
    setStatus(msg);
    console.error(e);
    $('tsReport').textContent=msg+'\n请检查 LuCI → Services → IPTV Web 的 M3U URL。rev4.2 安装脚本会覆盖 /etc/config/iptvweb，如果自定义订阅被还原成默认 myepg.org，需要重新填写。';
  }finally{
    clearTimeout(t);
  }
}

load();
